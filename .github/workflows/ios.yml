# iOS 的构建 / 模拟器验证。
#
# ⚠️ **开发机是 Linux，没有 Xcode**，所以 iOS 的界面层只能在这儿编。
# 分两半，各跑各的：
#   · logic  —— YxiKit（纯逻辑+SSH）在 Linux 容器里编+测，便宜、快
#   · sim    —— 真编 iOS App、起模拟器、装上去、截图，产物传回来
#
# ⚠️ macOS runner 按 10 倍分钟计费，所以只在 ios/ 真的改了才触发。
name: iOS

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  logic:
    name: 逻辑层（Linux）
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - working-directory: ios
        run: swift test 2>&1 | tail -30

  sim:
    name: iOS 编译 + 模拟器截图
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 放在这儿而不是 logic 作业里：两个作业是**并行**的，
      # 挡不住 sim 那 6 分钟的编译。要省时间就得挡在 xcodebuild 前面。
      - name: 文本体检（秒级，先挡一道）
        run: bash ios/dev/precheck.sh

      - name: 环境
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone (16|15)" | head -5

      - name: 装 XcodeGen 并生成工程
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          ls -d Yxi.xcodeproj

      - name: 编译（iOS 模拟器）
        working-directory: ios
        run: |
          set -o pipefail
          # ⚠️ -skipPackagePluginValidation：SwiftTerm 带了个构建插件（SwiftTermBuildInfoPlugin），
          #    Xcode 默认要人点「信任」，CI 里没人点 → 直接 BUILD FAILED。
          #    -skipMacroValidation 同理（宏也要批准）。
          xcodebuild build \
            -project Yxi.xcodeproj \
            -scheme YxiApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS= \
            2>&1 | grep -E "error:|warning: .*deprecated|BUILD|Compiling|Linking" | tail -60

      # ⚠️ 这一步是整条 CI 里**唯一**能证明「真能连上、真读得到文件」的地方。
      # 模拟器跟 Mac 共用网络栈，所以模拟器里的 127.0.0.1 **就是 runner 这台机器** ——
      # 跟安卓那边 `10.0.2.2` 指向服务器是同一个套路。
      # 于是这里在 runner 上现起一台 sshd + tmux + 一堆样本文件，让 App 真的去连。
      # ⚠️ 这一步是整条 CI 里**唯一**能证明「真能连上、真读得到文件」的地方。
      # 模拟器跟 Mac 共用网络栈，所以模拟器里的 127.0.0.1 **就是 runner 这台机器** ——
      # 跟安卓那边 `10.0.2.2` 指向服务器是同一个套路。
      # 于是这里在 runner 上现起一台 sshd + tmux + 一堆样本文件，让 App 真的去连。
      - name: 在 runner 上起一台真 SSH 服务器（给端到端用）
        id: sshd
        run: |
          set -e
          sudo systemsetup -setremotelogin on
          mkdir -p ~/.ssh && touch ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          # ⚠️ **只留 ed25519 这一把主机密钥。** 上一轮就栽在这儿：
          # macOS 的 sshd 默认同时提供 ed25519 / ecdsa / rsa，谈判出来的是哪一把不一定；
          # 我们只把 ed25519 那把提前交给 App，于是 App 认为「指纹对不上」，
          # 弹出「主机指纹变了，已拒绝连接」并拒连 —— 那是**它该有的行为**，不是 bug。
          # OpenSSH 里只要显式写了 HostKey，默认的几把就不再用。
          # ⚠️ StrictModes：macOS 上 /Users/runner 常常是组可写的，
          # sshd 会因此**静默拒绝**公钥认证（日志里才有原因）。CI 是一次性机器，关掉它。
          printf 'HostKey /etc/ssh/ssh_host_ed25519_key\nStrictModes no\n' \
            | sudo tee -a /etc/ssh/sshd_config >/dev/null
          sudo launchctl kickstart -k system/com.openssh.sshd || true
          echo "hostkey=$(sudo awk '{print $1" "$2}' /etc/ssh/ssh_host_ed25519_key.pub)" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do nc -z 127.0.0.1 22 && break; sleep 1; done
          nc -z 127.0.0.1 22 && echo "sshd 已就绪"
          # 服务器实际提供哪几把 —— 对不上就是上面那个错，先打出来省得瞎猜
          ssh-keyscan -p 22 127.0.0.1 2>/dev/null | awk '{print "提供：" $2}'

      - name: 摆一份样本工作区（会话 + 文件）
        run: |
          set -e
          brew list tmux >/dev/null 2>&1 || brew install tmux
          D="$HOME/demo"; mkdir -p "$D/子目录"
          printf '# 示例项目\n\n这是 **markdown** 阅读模式。\n\n- 第一条\n- 第二条\n' > "$D/README.md"
          printf '{"名字":"yxi","版本":"0.9.27","能力":["ssh","sftp","tmux"]}' > "$D/配置.json"
          printf 'print("hello")\n' > "$D/脚本.py"
          head -c 200000 /dev/urandom > "$D/大文件.bin"
          # 一个真 tmux 会话，让「会话」页有东西可显示
          tmux new-session -d -s cc-demo -c "$D" || true
          tmux send-keys -t cc-demo "echo 这是给截图用的示例会话" Enter || true
          ls -la "$D"

          # 实验室的样本：一张图 + 一段 html，好验预览那条路真的通
          L="$HOME/.yxi/lab"; mkdir -p "$L"
          python3 - "$L" <<'PYEOF'
          import base64, json, pathlib, sys
          lab = pathlib.Path(sys.argv[1])
          # 8x8 纯色 PNG，够证明「取回来 → 解码 → 画出来」这条链路通了
          png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAgAAAAIAQMAAAD+wSzIAAAABlBMVEX///+"
              "/v7+jQ3Y5AAAADklEQVQI12P4AIX8EAgALgAD/aNpbtEAAAAASUVORK5CYII=")
          (lab / "sample.png").write_bytes(png)
          (lab / "card.html").write_text(
              "<style>body{background:#221F1B;color:#FFB787;font:16px -apple-system;"
              "display:flex;align-items:center;justify-content:center;height:90vh}</style>"
              "<div>实验室 html 预览（内联 CSS 渲染）</div>", encoding="utf-8")
          (lab / "manifest.json").write_text(json.dumps([
              {"id": "s1", "title": "示例图片", "type": "image", "file": "sample.png",
               "desc": "验证 base64 取回 + 解码 + 显示", "by": "ci", "at": 1756300000},
              {"id": "s2", "title": "示例网页", "type": "html", "file": "card.html",
               "desc": "验证内联 CSS 真的渲染", "by": "ci", "at": 1756300001},
          ], ensure_ascii=False), encoding="utf-8")
          print("实验室样本就位")
          PYEOF

      - name: 起模拟器 · 装上去 · 截图
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print([x['udid'] for v in d['devices'].values() for x in v if x['name']=='iPhone 16'][0])")
          echo "模拟器 $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -name 'Yxi.app' -maxdepth 3 | head -1)
          echo "APP=$APP"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          # 每个标签页单独启一次并截图 —— 用启动参数指定初始页（见 AppState.tab 的注释）。
          # 比起引一整套 XCUITest，这样最省：一条 simctl 命令就够。
          shoot() {   # $1=标签 $2=文件名
            xcrun simctl terminate "$UDID" app.yxi 2>/dev/null || true
            xcrun simctl launch "$UDID" app.yxi --args -yxiTab "$1" >/dev/null
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$2"
          }
          shoot sessions 01-会话.png
          shoot hosts    02-主机.png
          shoot config   03-配置.png
          shoot settings 04-设置.png

          # ---- 端到端：连上 runner 那台真 sshd，截真界面 ----
          # ⚠️ 前面几张是「没连服务器」的样子；下面这几张才证明 SSH/SFTP 真的通。
          # 先让 App 把**它自己的**公钥吐出来（走的就是用户平时那条密钥认证），
          # 再写进 runner 的 authorized_keys。
          xcrun simctl terminate "$UDID" app.yxi 2>/dev/null || true
          xcrun simctl launch "$UDID" app.yxi --args -yxiDumpPubKey YES >/dev/null
          sleep 6
          CONTAINER=$(xcrun simctl get_app_container "$UDID" app.yxi data)
          echo "容器：$CONTAINER"; ls -la "$CONTAINER/Documents" 2>&1 | head
          PUB="$CONTAINER/Documents/pubkey.txt"
          E2E=1
          if [ ! -s "$PUB" ]; then
            echo "⚠️ App 没吐出公钥 —— 端到端这部分跳过（前面四张标签页截图仍然有效）"
            E2E=0
          elif grep -q '^ERROR:' "$PUB"; then
            echo "⚠️ App 取不到自己的密钥：$(cat "$PUB")"
            E2E=0
          else
            cat "$PUB" >> ~/.ssh/authorized_keys
            echo "公钥已装： $(cut -c1-40 "$PUB")…"
            # 自己先验一把 sshd 是否真的能用。⚠️ 要**另生成一把 CI 专用密钥**：
            # runner 自己那把并不在 authorized_keys 里，拿它测必然失败（上一轮的假警报）
            ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/ci_probe <<< y >/dev/null 2>&1 || true
            cat ~/.ssh/ci_probe.pub >> ~/.ssh/authorized_keys
            ssh -i ~/.ssh/ci_probe -o StrictHostKeyChecking=no -o BatchMode=yes \
                -o ConnectTimeout=8 "$(whoami)@127.0.0.1" 'echo SSH_OK; tmux ls' \
                || { echo "⚠️ sshd 自测没通，下面是详细过程："; \
                     ssh -v -i ~/.ssh/ci_probe -o StrictHostKeyChecking=no -o BatchMode=yes \
                         -o ConnectTimeout=8 "$(whoami)@127.0.0.1" true 2>&1 | tail -25; }
          fi

          # ⚠️ **必须用数组。** 主机公钥是 `ssh-ed25519 AAAA…`，**中间有空格**；
          # 放进普通变量再 `--args $SEED` 会被词分割成两个参数，App 收到的
          # hostKey 只剩 `ssh-ed25519` —— 解不出来，于是它按 fail-closed 判成
          # 「指纹变了」并拒连。上一轮截图里那句红字就是这么来的（App 是对的）。
          SEED=( -yxiSeedHost 127.0.0.1:22
                 -yxiSeedUser "$(whoami)"
                 -yxiSeedHostKey "${{ steps.sshd.outputs.hostkey }}" )
          live() {  # $1=文件名  $2..=额外启动参数
            local out="$1"; shift
            xcrun simctl terminate "$UDID" app.yxi 2>/dev/null || true
            xcrun simctl launch "$UDID" app.yxi --args "${SEED[@]}" "$@" >/dev/null
            sleep 12        # 连接 + 首次列目录要时间，别抢拍
            xcrun simctl io "$UDID" screenshot "shots/$out"
          }
          if [ "$E2E" = "1" ]; then
          live 05-已连接的会话页.png -yxiTab sessions
          live 06-文件浏览.png       -yxiOpen cc-demo -yxiMode files -yxiCwd "$HOME/demo"
          live 07-实验室.png         -yxiOpen cc-demo -yxiMode lab -yxiCwd "$HOME/demo"
          live 08-终端.png           -yxiOpen cc-demo -yxiMode terminal -yxiCwd "$HOME/demo"
          fi
          ls -lh shots/

      - name: 传回截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-shots
          path: ios/shots/
          if-no-files-found: warn
