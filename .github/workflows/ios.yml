# iOS 的构建 / 模拟器验证。
#
# ⚠️ **开发机是 Linux，没有 Xcode**，所以 iOS 的界面层只能在这儿编。
# 分两半，各跑各的：
#   · logic  —— YxiKit（纯逻辑+SSH）在 Linux 容器里编+测，便宜、快
#   · sim    —— 真编 iOS App、起模拟器、装上去、截图，产物传回来
#
# ⚠️ macOS runner 按 10 倍分钟计费，所以只在 ios/ 真的改了才触发。
name: iOS

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  logic:
    name: 逻辑层（Linux）
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - working-directory: ios
        run: swift test 2>&1 | tail -30

  sim:
    name: iOS 编译 + 模拟器截图
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone (16|15)" | head -5

      - name: 装 XcodeGen 并生成工程
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          ls -d Yxi.xcodeproj

      - name: 编译（iOS 模拟器）
        working-directory: ios
        run: |
          set -o pipefail
          # ⚠️ -skipPackagePluginValidation：SwiftTerm 带了个构建插件（SwiftTermBuildInfoPlugin），
          #    Xcode 默认要人点「信任」，CI 里没人点 → 直接 BUILD FAILED。
          #    -skipMacroValidation 同理（宏也要批准）。
          xcodebuild build \
            -project Yxi.xcodeproj \
            -scheme YxiApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | grep -E "error:|warning: .*deprecated|BUILD|Compiling|Linking" | tail -60

      - name: 起模拟器 · 装上去 · 截图
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print([x['udid'] for v in d['devices'].values() for x in v if x['name']=='iPhone 16'][0])")
          echo "模拟器 $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -name 'Yxi.app' -maxdepth 3 | head -1)
          echo "APP=$APP"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          # 每个标签页单独启一次并截图 —— 用启动参数指定初始页（见 AppState.tab 的注释）。
          # 比起引一整套 XCUITest，这样最省：一条 simctl 命令就够。
          shoot() {   # $1=标签 $2=文件名
            xcrun simctl terminate "$UDID" app.yxi 2>/dev/null || true
            xcrun simctl launch "$UDID" app.yxi --args -yxiTab "$1" >/dev/null
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$2"
          }
          shoot sessions 01-会话.png
          shoot hosts    02-主机.png
          shoot config   03-配置.png
          shoot settings 04-设置.png
          ls -lh shots/

      - name: 传回截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-shots
          path: ios/shots/
          if-no-files-found: warn
