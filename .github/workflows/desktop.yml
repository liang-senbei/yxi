# Windows 桌面版打包：jpackage app-image → Velopack（一键 Setup.exe + 静默自动更新 = Claude Desktop 的 Squirrel.Windows 同一路线）。
# jpackage 跨不了平台，所以放 GitHub 的 windows runner。触发：手动（gh workflow run desktop.yml --ref <分支>），或推 tag `desktop-v*`。
# 产物 artifact `Yxi-windows`：Releases/（Yxi-win-Setup.exe、Yxi-<v>-full.nupkg、releases.win.json、RELEASES）+ uber jar（`java -jar …` 就能跑）。
# 发布到 yxi.keuury.com/desktop/：android/desktop/publish.sh <run id>。
#
# ⚠️ settings.gradle 里带着 :app（Android）。实测（AGP 9.3.1，Linux 上无 local.properties、ANDROID_HOME 未设）：
#    只跑 :desktop 的任务时配置阶段**不要** Android SDK —— AGP 把 SDK 检查推迟到了执行阶段。
#    所以这里不装 setup-android（windows-latest 本身也预装了 SDK，ANDROID_HOME 是设好的，双保险）。
#    哪天 AGP 升级后配置阶段开始要 SDK 了，加 `--configure-on-demand`（也实测过能过）或 android-actions/setup-android。
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  windows:
    name: Windows Setup.exe + jar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Windows SSH key update contract (isolated temporary files)
        shell: pwsh
        timeout-minutes: 2
        run: |
          & powershell.exe -NoProfile -NonInteractive -File dev/test-link-windows-keys.ps1 2>&1 | Tee-Object smoke-link-keys.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows SSH key update contract failed' }

      - name: 打包（jpackage app-image + uber jar）
        working-directory: android
        shell: bash
        run: ./gradlew :desktop:createDistributable :desktop:packageUberJarForCurrentOS --no-daemon

      # vpk = Velopack 的打包器（dotnet 全局工具，windows runner 自带 dotnet）。输入就是 jpackage 的 app-image 目录。
      # 版本号从 app-image 里的 Yxi.cfg 读（= build.gradle.kts 的 packageVersion = 运行时 System.getProperty("jpackage.app-version")），三处同源。
      # --skipVeloAppCheck：vpk 默认静态扫主 exe 找 .NET 的 VelopackApp.Run()（不运行 exe；非 .NET 的 exe 其实会被静默跳过）。
      #   我们是 jpackage 启动器 + JVM，没有也不需要 SDK（--veloapp-* 钩子由 Update.kt 处理），加上只是明确点。
      # --noPortable：便携 zip 不要，uber jar 已经是"免安装"版。
      # 差量包（delta）要先把线上已发的拉下来做基线：`vpk download http --url https://yxi.keuury.com/desktop/ --outputDir Releases`；
      # Update.kt 目前只下 full 包，先不做。
      - name: Velopack（Setup.exe + nupkg + releases.win.json）
        working-directory: android/desktop
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.0
          app=build/compose/binaries/main/app/Yxi
          v=$(sed -n 's/^java-options=-Djpackage.app-version=//p' "$app/app/Yxi.cfg" | tr -d '\r')
          echo "version=$v"
          vpk pack --packId Yxi --packVersion "$v" --packDir "$app" --mainExe Yxi.exe --packTitle Yxi --packAuthors Yxi \
            --icon icon.ico --noPortable --skipVeloAppCheck --outputDir Releases
          ls -la Releases
          cat Releases/releases.win.json

      # 开窗口 3 秒退出、打印 smoke ok —— 证明 Compose + Skia 在 Windows 上起得来。
      # jar 与打包后的启动器均必须通过，才允许发布。
      - name: 冒烟
        working-directory: android
        shell: bash
        timeout-minutes: 3
        run: java -jar desktop/build/compose/jars/*.jar --smoke

      # 真装真启动（老板真机 2026-09-12 报「Failed to launch JVM」后加的）：上面的 --smoke 跑的是 uber jar，
      # 没碰过 jpackage 的启动器。这里在干净的 Windows runner 上：静默装 Setup.exe → 运行装好的 Yxi.exe --smoke。
      # 成功 = 3 秒退出码 0；「Failed to launch JVM」会弹一个框卡住直到超时 —— 两种结局一眼可分。
      # 验证通过后才上传发布产物；失败日志另行保留。
      - name: 真装真启动（Setup 静默装 → Yxi.exe --smoke）
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = Get-ChildItem "android/desktop/Releases" -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Releases 里没找到 Setup.exe" }
          Write-Host "静默安装 $($setup.FullName)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "--silent" -WindowStyle Hidden -Wait -PassThru
          Write-Host "Setup 退出码 $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Setup 安装失败" }
          $exe = "$env:LOCALAPPDATA\Yxi\current\Yxi.exe"
          if (-not (Test-Path $exe)) { throw "装完没找到 $exe" }
          Write-Host "运行 $exe --smoke"
          $p2 = Start-Process -FilePath $exe -ArgumentList "--smoke" -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Write-Host "Yxi.exe 退出码 $($p2.ExitCode)"
          Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  | $_" }
          if ($p2.ExitCode -ne 0) { throw "装好的 Yxi.exe --smoke 失败（退出码 $($p2.ExitCode)）—— launcher 级问题在这现形" }
          if (-not (Select-String -Path smoke-out.txt,smoke-err.txt -Pattern "smoke ok" -Quiet)) { throw "缺少 smoke ok，不能仅凭退出码判断启动成功" }
          $browserOptions = $env:JAVA_TOOL_OPTIONS
          try {
            $env:JAVA_TOOL_OPTIONS = '-Dyxi.browser.localFixture=true -Dyxi.browser.smokeImage="' + "$env:GITHUB_WORKSPACE\smoke-browser.png" + '" -Dyxi.credential.smokeDir="' + "$env:GITHUB_WORKSPACE\smoke-synthetic-credentials" + '"'
            foreach ($phase in @('write','reopen')) {
              $credentialArgs = if ($phase -eq 'write') { '--credential-smoke' } else { '--credential-smoke --reopen' }
              $credentialTest = Start-Process -FilePath $exe -ArgumentList $credentialArgs -WindowStyle Hidden -PassThru -RedirectStandardOutput "smoke-credential-$phase-out.txt" -RedirectStandardError "smoke-credential-$phase-err.txt"
              if (-not $credentialTest.WaitForExit(60000)) { $credentialTest.Kill($true); throw "凭据原生验证超时" }
              if ($credentialTest.ExitCode -ne 0) { throw "凭据原生验证失败：$($credentialTest.ExitCode)" }
              $credentialMarker = if ($phase -eq 'write') { 'credential native migration rotation and tamper checks ok' } else { 'credential native cross-process reopen logout and login ok' }
              if (-not (Get-Content "smoke-credential-$phase-out.txt" -Raw).Contains($credentialMarker)) { throw "缺少凭据验证标记" }
            }
            $browserTest = Start-Process -FilePath $exe -ArgumentList "--browser-smoke" -WindowStyle Hidden -PassThru -RedirectStandardOutput smoke-browser-out.txt -RedirectStandardError smoke-browser-err.txt
            if (-not $browserTest.WaitForExit(180000)) { $browserTest.Kill($true); throw "浏览器原生验证超时" }
            if ($browserTest.ExitCode -ne 0) { throw "浏览器原生验证失败：$($browserTest.ExitCode)" }
            $browserLog = Get-Content smoke-browser-out.txt -Raw
            foreach ($marker in @('browser native render and live style ok','browser native pixels ok','browser native shutdown ok')) {
              if (-not $browserLog.Contains($marker)) { throw "缺少浏览器验证标记：$marker" }
            }
          } finally { $env:JAVA_TOOL_OPTIONS = $browserOptions }

      - uses: actions/upload-artifact@v4
        with:
          name: Yxi-windows
          path: |
            android/desktop/Releases
            android/desktop/build/compose/jars/*.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yxi-windows-smoke-logs
          path: |
            smoke-*.txt
            smoke-browser.png
          if-no-files-found: ignore
