# Windows 桌面版打包：jpackage app-image → Velopack（一键 Setup.exe + 静默自动更新 = Claude Desktop 的 Squirrel.Windows 同一路线）。
# jpackage 跨不了平台，所以放 GitHub 的 windows runner。触发：手动（gh workflow run desktop.yml --ref <分支>），或推 tag `desktop-v*`。
# 产物 artifact `Yxi-windows`：Releases/（Yxi-win-Setup.exe、Yxi-<v>-full.nupkg、releases.win.json、RELEASES）+ uber jar（`java -jar …` 就能跑）。
# 发布到 yxi.keuury.com/desktop/：android/desktop/publish.sh <run id>。
# macOS 只出 Apple Silicon arm64，在 job `macos`：app-image → ad-hoc 重签 → hdiutil 做 dmg；artifact `Yxi-macos-arm64`（dmg + uber jar），未签名、未公证。
#
# ⚠️ settings.gradle 里带着 :app（Android）。实测（AGP 9.3.1，Linux 上无 local.properties、ANDROID_HOME 未设）：
#    只跑 :desktop 的任务时配置阶段**不要** Android SDK —— AGP 把 SDK 检查推迟到了执行阶段。
#    所以这里不装 setup-android（windows-latest 本身也预装了 SDK，ANDROID_HOME 是设好的，双保险）。
#    哪天 AGP 升级后配置阶段开始要 SDK 了，加 `--configure-on-demand`（也实测过能过）或 android-actions/setup-android。
name: Desktop

on:
  workflow_dispatch:
    inputs:
      transfer_only:
        description: 'Only transfer the verified 1.4.14 artifact to its temporary restricted receiver'
        type: boolean
        default: false
  push:
    tags: ['desktop-v*']

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.transfer_only != true
    name: Windows Setup.exe + jar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Windows native tray Chinese font check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tray-font-check | Out-Null
          & javac -encoding UTF-8 -d tray-font-check android/desktop/src/main/java/app/yxi/desktop/TrayMenuFont.java dev/TrayMenuFontCheck.java
          if ($LASTEXITCODE -ne 0) { throw 'Tray font check compilation failed' }
          & java -cp tray-font-check TrayMenuFontCheck | Tee-Object smoke-tray-font.txt
          if ($LASTEXITCODE -ne 0) { throw 'Native tray Chinese font check failed' }

      - name: Windows SSH key update contract (isolated temporary files)
        shell: pwsh
        timeout-minutes: 2
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File dev/test-link-windows-keys.ps1 2>&1 | Tee-Object smoke-link-keys.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows SSH key update contract failed' }

      - name: Workbench core regression
        shell: pwsh
        timeout-minutes: 20
        run: ./dev/test-workbench.ps1

      - name: 打包（jpackage app-image + uber jar）
        working-directory: android
        shell: bash
        run: ./gradlew :desktop:createDistributable :desktop:packageUberJarForCurrentOS --no-daemon

      # vpk = Velopack 的打包器（dotnet 全局工具，windows runner 自带 dotnet）。输入就是 jpackage 的 app-image 目录。
      # 版本号从 app-image 里的 Yxi.cfg 读（= build.gradle.kts 的 packageVersion = 运行时 System.getProperty("jpackage.app-version")），三处同源。
      # --skipVeloAppCheck：vpk 默认静态扫主 exe 找 .NET 的 VelopackApp.Run()（不运行 exe；非 .NET 的 exe 其实会被静默跳过）。
      #   我们是 jpackage 启动器 + JVM，没有也不需要 SDK（--veloapp-* 钩子由 Update.kt 处理），加上只是明确点。
      # --noPortable：便携 zip 不要，uber jar 已经是"免安装"版。
      # 差量包（delta）要先把线上已发的拉下来做基线：`vpk download http --url https://yxi.keuury.com/desktop/ --outputDir Releases`；
      # Update.kt 目前只下 full 包，先不做。
      - name: Velopack（Setup.exe + nupkg + releases.win.json）
        working-directory: android/desktop
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.0
          app=build/compose/binaries/main/app/Yxi
          v=$(sed -n 's/^java-options=-Djpackage.app-version=//p' "$app/app/Yxi.cfg" | tr -d '\r')
          echo "version=$v"
          vpk pack --packId Yxi --packVersion "$v" --packDir "$app" --mainExe Yxi.exe --packTitle Yxi --packAuthors Yxi \
            --icon icon.ico --noPortable --skipVeloAppCheck --outputDir Releases
          ls -la Releases
          cat Releases/releases.win.json

      # 开窗口 3 秒退出、打印 smoke ok —— 证明 Compose + Skia 在 Windows 上起得来。
      # jar 与打包后的启动器均必须通过，才允许发布。
      - name: 冒烟
        working-directory: android
        shell: bash
        timeout-minutes: 3
        run: java -jar desktop/build/compose/jars/*.jar --smoke

      # 真装真启动（老板真机 2026-09-12 报「Failed to launch JVM」后加的）：上面的 --smoke 跑的是 uber jar，
      # 没碰过 jpackage 的启动器。这里在干净的 Windows runner 上：静默装 Setup.exe → 运行装好的 Yxi.exe --smoke。
      # 成功 = 3 秒退出码 0；「Failed to launch JVM」会弹一个框卡住直到超时 —— 两种结局一眼可分。
      # 验证通过后才上传发布产物；失败日志另行保留。
      - name: 真装真启动（Setup 静默装 → Yxi.exe --smoke）
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = Get-ChildItem "android/desktop/Releases" -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Releases 里没找到 Setup.exe" }
          Write-Host "静默安装 $($setup.FullName)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "--silent" -WindowStyle Hidden -Wait -PassThru
          Write-Host "Setup 退出码 $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Setup 安装失败" }
          $exe = "$env:LOCALAPPDATA\Yxi\current\Yxi.exe"
          if (-not (Test-Path $exe)) { throw "装完没找到 $exe" }
          Write-Host "运行 $exe --smoke"
          $p2 = Start-Process -FilePath $exe -ArgumentList "--smoke" -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Write-Host "Yxi.exe 退出码 $($p2.ExitCode)"
          Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  | $_" }
          if ($p2.ExitCode -ne 0) { throw "装好的 Yxi.exe --smoke 失败（退出码 $($p2.ExitCode)）—— launcher 级问题在这现形" }
          if (-not (Select-String -Path smoke-out.txt,smoke-err.txt -Pattern "smoke ok" -Quiet)) { throw "缺少 smoke ok，不能仅凭退出码判断启动成功" }
          $browserOptions = $env:JAVA_TOOL_OPTIONS
          try {
            $env:JAVA_TOOL_OPTIONS = '-Dyxi.browser.localFixture=true -Dyxi.browser.smokeImage="' + "$env:GITHUB_WORKSPACE\smoke-browser.png" + '" -Dyxi.credential.smokeDir="' + "$env:GITHUB_WORKSPACE\smoke-synthetic-credentials" + '"'
            foreach ($phase in @('write','reopen')) {
              $credentialArgs = if ($phase -eq 'write') { '--credential-smoke' } else { '--credential-smoke --reopen' }
              $credentialTest = Start-Process -FilePath $exe -ArgumentList $credentialArgs -WindowStyle Hidden -PassThru -RedirectStandardOutput "smoke-credential-$phase-out.txt" -RedirectStandardError "smoke-credential-$phase-err.txt"
              if (-not $credentialTest.WaitForExit(60000)) { $credentialTest.Kill($true); throw "凭据原生验证超时" }
              if ($credentialTest.ExitCode -ne 0) { throw "凭据原生验证失败：$($credentialTest.ExitCode)" }
              $credentialMarker = if ($phase -eq 'write') { 'credential native migration rotation and tamper checks ok' } else { 'credential native cross-process reopen logout and login ok' }
              if (-not (Get-Content "smoke-credential-$phase-out.txt" -Raw).Contains($credentialMarker)) { throw "缺少凭据验证标记" }
            }
            $browserTest = Start-Process -FilePath $exe -ArgumentList "--browser-smoke" -WindowStyle Hidden -PassThru -RedirectStandardOutput smoke-browser-out.txt -RedirectStandardError smoke-browser-err.txt
            if (-not $browserTest.WaitForExit(180000)) { $browserTest.Kill($true); throw "浏览器原生验证超时" }
            if ($browserTest.ExitCode -ne 0) { throw "浏览器原生验证失败：$($browserTest.ExitCode)" }
            $browserLog = Get-Content smoke-browser-out.txt -Raw
            foreach ($marker in @('browser native render and live style ok','browser native pixels ok','browser native shutdown ok')) {
              if (-not $browserLog.Contains($marker)) { throw "缺少浏览器验证标记：$marker" }
            }
          } finally { $env:JAVA_TOOL_OPTIONS = $browserOptions }

      - uses: actions/upload-artifact@v4
        with:
          name: Yxi-windows
          path: |
            android/desktop/Releases
            android/desktop/build/compose/jars/*.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yxi-windows-smoke-logs
          path: |
            smoke-*.txt
            smoke-browser.png
            android/desktop/build/test-results/test/*.xml
            android/desktop/build/reports/tests/test/
          if-no-files-found: ignore

  # 不用 packageDmg：jpackage 做 dmg 要用 osascript 让 Finder 摆图标（TCC 自动化授权），无人值守的机器上会卡住或失败。
  # 正式签名 / 公证等 Developer ID：到时给 gradle 加 -Pyxi.mac.sign=true -Pyxi.mac.signIdentity=…、配 YXI_MAC_NOTARY_* 环境变量，
  # 并去掉下面的 ad-hoc 重签。未公证的 dmg 下载后会被 Gatekeeper 拦（要到「隐私与安全性」里点「仍要打开」）。
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.transfer_only != true
    name: macOS arm64 dmg + jar
    runs-on: macos-15   # Apple Silicon
    # publish.sh 要求整个 run 的 conclusion == success：macOS 还没上线，失败 / 超时不能挡 Windows 发布（本 job 自己照样标红）
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: jdk17   # :core 的 toolchain；仓库没配 toolchain 下载源，显式告诉 gradle 装在哪
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # 与 Windows 同一份类清单（dev/test-workbench.ps1 只能在 Windows 跑，这里用 bash 展开），另加两个 macOS 专属用例。
      # 钥匙串用例用 SecKeychainCreate 建的临时钥匙串文件（用完删），不碰登录钥匙串；runner 是一次性的，所以这里开 YXI_KEYCHAIN_TEST。
      - name: Workbench core regression（macOS）
        working-directory: android
        timeout-minutes: 25
        env:
          YXI_KEYCHAIN_TEST: '1'
        run: |
          args=()
          for c in $(tr -d '\r' < ../dev/workbench-test-classes.txt); do args+=(--tests "$c"); done
          ./gradlew -Pyxi.desktopOnly=true "-Porg.gradle.java.installations.paths=${{ steps.jdk17.outputs.path }}" :desktop:test \
            --no-daemon --max-workers=1 --console=plain "${args[@]}" \
            --tests app.yxi.desktop.LoginShellPathTest --tests app.yxi.desktop.MacKeychainCredentialProtectorTest

      - name: 打包（jpackage app-image + uber jar）
        working-directory: android
        timeout-minutes: 20
        run: ./gradlew -Pyxi.desktopOnly=true "-Porg.gradle.java.installations.paths=${{ steps.jdk17.outputs.path }}" :desktop:createDistributable :desktop:packageUberJarForCurrentOS --no-daemon

      # createDistributable 没有证书时已经给 .app 做了 ad-hoc + hardened runtime 签名、带上 entitlements.plist（Mac mini 上 codesign -dv 实测）；
      # 这里按以后正式签名的同一套 entitlements 显式重签一遍并 --strict 校验，不依赖插件内部行为。entitlements.plist 里的
      # disable-library-validation 不能去：ad-hoc 没有 Team ID，runtime 下连自带 JDK 的 libjli.dylib 都加载不了（实测）；JCEF 的
      # Helper / framework 是另一个 Team ID 签的，而且是运行时解压到数据目录的（BrowserRuntime.kt），不在 .app 的签名里。
      - name: ad-hoc 重签 + dmg（hdiutil）
        working-directory: android/desktop
        timeout-minutes: 10
        run: |
          app=build/compose/binaries/main/app/Yxi.app
          v=$(sed -n 's/^java-options=-Djpackage.app-version=//p' "$app/Contents/app/Yxi.cfg" | tr -d '\r')
          test -n "$v"
          echo "version=$v"
          codesign --force --deep --options runtime --entitlements entitlements.plist -s - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          rm -rf build/dmgroot && mkdir -p build/dmgroot
          ditto "$app" build/dmgroot/Yxi.app
          ln -s /Applications build/dmgroot/Applications
          dmg="build/Yxi-$v-macos-arm64.dmg"
          # hosted runner 上 hdiutil create 偶发 "Resource busy"，重试几次
          for i in 1 2 3; do
            hdiutil create -volname Yxi -srcfolder build/dmgroot -fs HFS+ -format UDZO -imagekey zlib-level=9 -ov "$dmg" && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done
          ls -l "$dmg"
          # 像用户那样装：挂载 dmg → 把 .app 拷出来，下一步跑拷出来的这份
          mkdir -p "$RUNNER_TEMP/mnt"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$RUNNER_TEMP/mnt" "$dmg"
          ditto "$RUNNER_TEMP/mnt/Yxi.app" "$RUNNER_TEMP/Yxi.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          codesign --verify --deep --strict "$RUNNER_TEMP/Yxi.app"

      # 开窗口 3 秒退出、打印 smoke ok：uber jar 和从 dmg 拷出来的 .app 都要过，再加浏览器原生验证。隔离 HOME（JCEF 运行时也解压在里面），
      # apple.awt.UIElement 不出 Dock 图标、不抢前台。--credential-smoke / --host-smoke 不在这跑：它们读写登录钥匙串，
      # ad-hoc 签名下可能弹授权框卡住；钥匙串那层由上面的临时钥匙串单测覆盖。
      - name: 冒烟（jar、.app、浏览器）
        timeout-minutes: 10
        run: |
          export HOME="$RUNNER_TEMP/yxi-home" && mkdir -p "$HOME"
          export JAVA_TOOL_OPTIONS="-Duser.home=$HOME -Dapple.awt.UIElement=true"
          check() { grep -q "$2" "$1" || { echo "缺少标记「$2」（$1）"; cat "$1"; exit 1; }; }
          java -jar android/desktop/build/compose/jars/*.jar --smoke > smoke-jar-out.txt 2>&1 || { cat smoke-jar-out.txt; exit 1; }
          check smoke-jar-out.txt "smoke ok"
          "$RUNNER_TEMP/Yxi.app/Contents/MacOS/Yxi" --smoke > smoke-out.txt 2> smoke-err.txt || { cat smoke-out.txt smoke-err.txt; exit 1; }
          check smoke-out.txt "smoke ok"
          export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Dyxi.browser.localFixture=true -Dyxi.browser.smokeImage=$GITHUB_WORKSPACE/smoke-browser.png"
          "$RUNNER_TEMP/Yxi.app/Contents/MacOS/Yxi" --browser-smoke > smoke-browser-out.txt 2> smoke-browser-err.txt \
            || { cat smoke-browser-out.txt smoke-browser-err.txt; exit 1; }
          for m in 'browser native render and live style ok' 'browser native pixels ok' 'browser native shutdown ok'; do check smoke-browser-out.txt "$m"; done

      - uses: actions/upload-artifact@v4
        with:
          name: Yxi-macos-arm64
          path: |
            android/desktop/build/Yxi-*-macos-arm64.dmg
            android/desktop/build/compose/jars/*.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yxi-macos-smoke-logs
          path: |
            smoke-*.txt
            smoke-browser.png
            android/desktop/build/test-results/test/*.xml
            android/desktop/build/reports/tests/test/
          if-no-files-found: ignore

  transfer:
    if: github.event_name == 'workflow_dispatch' && inputs.transfer_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download and verify the frozen artifact without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,pathlib,hashlib
          base='https://api.github.com/repos/liang-senbei/yxi'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=30) as r:return json.load(r)
          run=api('/actions/runs/35816868110')
          assert run['head_sha']=='cc422150d795fc58448adca6bd0a85a183b7a1cd' and run['conclusion']=='success'
          meta=api('/actions/artifacts/10731554456')
          digest='41b2280adc09e43f7c1da80a286e6f91abbd1f2ab2028e6b4c523fae66911738'
          assert meta['name']=='Yxi-windows' and meta['size_in_bytes']==910634830 and meta['digest']=='sha256:'+digest
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          try:
              urllib.request.build_opener(NoRedirect).open(urllib.request.Request(base+'/actions/artifacts/10731554456/zip',headers=headers),timeout=30)
              raise RuntimeError('Expected a download redirect')
          except urllib.error.HTTPError as response:
              assert response.code==302
              url=response.headers['Location'];response.close()
          assert url.startswith('https://')
          h=hashlib.sha256();size=0
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'yxi-artifact.zip'
          with urllib.request.urlopen(url,timeout=60) as response,target.open('xb') as output:
              while True:
                  chunk=response.read(1024*1024)
                  if not chunk:break
                  size+=len(chunk);assert size<=910634830
                  output.write(chunk);h.update(chunk)
          assert size==910634830 and h.hexdigest()==digest
          print('Frozen artifact size and SHA256 verified')
          PY
      - name: Transfer using the one-time forced-command key
        env:
          TRANSFER_KEY: ${{ secrets.YXI_RELEASE_TRANSFER_35816868110 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          key=root/'yxi-transfer-key';known=root/'yxi-transfer-known-hosts'
          private=os.environ.pop('TRANSFER_KEY')
          assert private.strip(),'Temporary transfer credential is unavailable'
          fd=os.open(key,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'w') as f:f.write(private.strip()+'\n')
          known.write_text('64.90.25.56 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICzZmr/DQxwT9G8RwcABQbDTYlJCPercdng9RZXUN5vk\n')
          try:
              with (root/'yxi-artifact.zip').open('rb') as stream:
                  subprocess.run(['ssh','-T','-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes',
                      '-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-o','ServerAliveInterval=30',
                      '-i',str(key),'root@64.90.25.56'],stdin=stream,timeout=900,check=True)
          finally:key.unlink(missing_ok=True)
          PY
