gradle.projectsEvaluated {
    def desktop = gradle.rootProject.project(':desktop')
    desktop.tasks.register('cacheIsolatedRuntime') {
        doLast {
            desktop.configurations.testRuntimeClasspath.files.each { artifact ->
                if (!artifact.isFile()) throw new GradleException('Missing test runtime artifact')
            }
        }
    }
    desktop.tasks.withType(Test).configureEach {
        systemProperty 'user.home', '/sandbox/home'
        systemProperty 'java.io.tmpdir', '/sandbox/tmp'
        maxParallelForks = 1
        maxHeapSize = '768m'
    }
}
