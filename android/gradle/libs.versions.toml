# 版本全部从 Maven 元数据实查得来，不是记忆里的（2026-08）
[versions]
agp = "9.3.1"
kotlin = "2.4.10"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
coroutines = "1.10.2"
markdown = "0.44.0"      # Compose 原生 markdown 渲染，不用 AndroidView 包 Markwon
termlib = "0.1.0"       # ConnectBot 的 Compose 原生终端控件（Apache-2.0，4 个 ABI 预编译）
jsch = "2.28.7"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
bouncycastle = "1.85.2"  # Android JCA 没有 Ed25519 Signature，靠 BC 提供（TROUBLESHOOTING #12）
camerax = "1.6.2"        # 扫一扫取景（只用 core/camera2/lifecycle/view，不拉 mlkit / play-services）
zxing = "3.5.4"          # 纯 Java 解码器，不依赖 Google 服务 —— 老板手机 GMS 是关的

[libraries]
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
termlib = { module = "org.connectbot:termlib", version.ref = "termlib" }
markdown = { module = "com.mikepenz:multiplatform-markdown-renderer-android", version.ref = "markdown" }
markdown-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3-android", version.ref = "markdown" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
