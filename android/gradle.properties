org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# ⚠️ 2026-09-04：构建变慢的三个原因，其中两个在这儿治。
# ① 以前每次都带 --no-daemon（因为守护进程曾经堆到 3.1GB 拖垮这台共享机器）——
#    代价是每次都冷启一个 JVM，增量构建从几十秒变成 3~5 分钟。
#    上面 jvmargs 已经把堆封在 2GB，再加一条 30 分钟空闲自杀，就不用再躲着守护进程了。
# ② release 现在跑 R8（混淆 + 资源压缩），那一步本身就要一两分钟 —— 改界面时用 assembleDebug 迭代，
#    只在发版和验混淆规则时才 assembleRelease。
# ③ 第三个原因不在这儿：这台机器常年有别的活（load 20+ / CPU steal 6~22%），那时候谁都快不了。
org.gradle.daemon.idletimeout=1800000
