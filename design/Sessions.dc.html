<!doctype html>
<html>

</head>
<body>
<x-dc>
<helmet>

  <style>
    body { margin:0; font-family:'Space Grotesk', system-ui, sans-serif; }
    a { color:#ffb787; } a:hover { color:#ffd0ad; }

  </style>
</helmet>

<div style="width:390px; height:844px; background:#16130f; color:#ebe1d9; display:flex; flex-direction:column; overflow:hidden;">

  <div style="padding:16px 16px 12px; background:#1e1b17; border-bottom:1px solid #2d2925; flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:3px;">
      <div style="font-size:21px; font-weight:700; letter-spacing:-0.02em; flex-grow:1;">ser8651</div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a89b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div style="font-size:11.5px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">14 个会话 · yxi-agent v1</div>

    <!-- 用量：ccusage 读本机 ~/.claude 算出来，天然按服务器分 -->
    <div style="margin-top:14px; background:#221f1b; border-radius:24px; padding:14px 16px; display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; align-items:baseline; gap:8px;">
        <div style="font-size:13px; font-weight:600; color:#d0c4b8; flex-grow:1;">5 小时额度</div>
        <div style="font-family:'JetBrains Mono', monospace; font-size:12px; color:#ffc46b; font-weight:500;">距重置 1h52m</div>
      </div>
      <div style="height:7px; border-radius:4px; background:#2d2925; overflow:hidden;"><div style="width:62%; height:7px; border-radius:4px; background:#ffc46b;"></div></div>
      <div style="display:flex; align-items:center; gap:14px; font-family:'JetBrains Mono', monospace; font-size:11.5px; color:#8a7d72;">
        <span>18.4M tok</span><span style="color:#ebe1d9; font-weight:500;">$12.80</span><span style="flex-grow:1; text-align:right;">$4.1/h</span>
      </div>
      <div style="display:flex; align-items:baseline; gap:8px; padding-top:4px;">
        <div style="font-size:13px; font-weight:600; color:#d0c4b8; flex-grow:1;">本周</div>
        <div style="font-family:'JetBrains Mono', monospace; font-size:11.5px; color:#8a7d72;">41%</div>
      </div>
      <div style="height:7px; border-radius:4px; background:#2d2925; overflow:hidden;"><div style="width:41%; height:7px; border-radius:4px; background:#8fd8c6;"></div></div>
    </div>
  </div>

  <div style="flex-grow:1; display:flex; flex-direction:column; gap:24px; padding:16px 18px; overflow:hidden;">

    <!-- 等你 -->
    <div style="display:flex; flex-direction:column; gap:9px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="width:7px; height:7px; border-radius:4px; background:#ffc46b;"></div>
        <div style="font-size:11.5px; font-weight:600; color:#ffc46b; letter-spacing:0.06em;">等你</div>
        <div style="font-size:11px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">2</div>
      </div>

      <div style="border-left:3px solid #ffc46b; border-radius:22px; background:#1e1b17; padding:12px 13px; display:flex; flex-direction:column; gap:6px;">
        <div style="display:flex; align-items:baseline; gap:8px;">
          <div style="font-size:14.5px; font-weight:600; flex-grow:1;">cc-mail</div>
          <div style="font-size:11px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">3 分钟</div>
        </div>
        <div style="font-size:12.5px; line-height:1.45; color:#d0c4b8;">要跑 <span style="font-family:'JetBrains Mono', monospace; font-size:11.5px; background:#6d3a10; color:#ffb4a6; border-radius:4px; padding:1px 5px;">rm -rf build/</span></div>
        <div style="display:flex; gap:8px; margin-top:3px;">
          <div style="flex-grow:1; height:44px; border-radius:18px; background:#ffb787; color:#4d2600; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center;">批准</div>
          <div style="flex-grow:1; height:44px; border-radius:18px; font-size:13px; font-weight:500; display:flex; align-items:center; justify-content:center;">拒绝</div>
        </div>
      </div>

      <div style="border-left:3px solid #ffc46b; border-radius:22px; background:#1e1b17; padding:12px 13px; display:flex; flex-direction:column; gap:5px;">
        <div style="display:flex; align-items:baseline; gap:8px;">
          <div style="font-size:14.5px; font-weight:600; flex-grow:1;">cc-nanobanana</div>
          <div style="font-size:11px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">12 分钟</div>
        </div>
        <div style="font-size:12.5px; line-height:1.45; color:#d0c4b8;">在问你选哪种存储方案</div>
      </div>
    </div>

    <!-- 干活中 -->
    <div style="display:flex; flex-direction:column; gap:9px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="width:7px; height:7px; border-radius:4px; background:#8fd8c6;"></div>
        <div style="font-size:11.5px; font-weight:600; color:#8fd8c6; letter-spacing:0.06em;">干活中</div>
        <div style="font-size:11px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">3</div>
      </div>

      <div style="border-radius:22px; background:#1e1b17; padding:12px 13px; display:flex; flex-direction:column; gap:5px;">
        <div style="display:flex; align-items:baseline; gap:8px;">
          <div style="font-size:14.5px; font-weight:600; flex-grow:1;">cc-Yxi</div>
          <div style="font-size:11px; color:#8fd8c6; font-family:'JetBrains Mono', monospace;">运行中</div>
        </div>
        <div style="font-size:12px; line-height:1.45; color:#a89b8f; font-family:'JetBrains Mono', monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">./gradlew assembleDebug</div>
      </div>

      <div style="border-radius:22px; background:#1e1b17; padding:12px 13px; display:flex; flex-direction:column; gap:5px;">
        <div style="display:flex; align-items:baseline; gap:8px;">
          <div style="font-size:14.5px; font-weight:600; flex-grow:1;">cc-项目</div>
          <div style="font-size:11px; color:#8fd8c6; font-family:'JetBrains Mono', monospace;">运行中</div>
        </div>
        <div style="font-size:12px; line-height:1.45; color:#a89b8f; font-family:'JetBrains Mono', monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Read src/main/kotlin/SshManager.kt</div>
      </div>
    </div>

    <!-- 已完成 -->
    <div style="display:flex; flex-direction:column; gap:9px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="width:7px; height:7px; border-radius:4px; background:#383430;"></div>
        <div style="font-size:11.5px; font-weight:600; color:#8a7d72; letter-spacing:0.06em;">已完成</div>
        <div style="font-size:11px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">9</div>
      </div>
      <div style="border-radius:22px; padding:11px 13px; display:flex; align-items:baseline; gap:8px;">
        <div style="font-size:14px; font-weight:500; color:#a89b8f; flex-grow:1;">cc-remote-dev-station</div>
        <div style="font-size:11px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">1 小时</div>
      </div>
    </div>

  </div>
</div>
