<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="yxi-aspect" content="9:16">
<title>activetheory.net 首页 · WebGL 复刻</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
  canvas{display:block}
  #txt{position:fixed;inset:0;pointer-events:none}
  #ui{position:fixed;inset:0;pointer-events:none}
  /* 导航药丸：参考帧 x 156–365 / y 31–77（390×844 基准）。字画在 #txt 画布上，好做像素格故障 */
  #nav{position:absolute;left:40%;top:3.67%;width:53.6%;height:5.5%;border-radius:999px;
       border:1.5px solid rgba(140,205,195,.78);background:rgba(2,6,8,.66);
       box-shadow:0 0 18px rgba(20,120,110,.25), inset 0 0 12px rgba(120,200,190,.08)}
  #nav i{position:absolute;left:43%;top:50%;width:14%;height:1px;background:rgba(255,255,255,.85)}
  #glow{position:absolute;left:50%;top:8.6%;width:44%;height:6%;
        background:radial-gradient(ellipse at 55% 0%,rgba(170,255,205,.9),rgba(60,190,140,.35) 35%,rgba(0,0,0,0) 70%)}
  #rain{position:absolute;left:54%;top:9%;width:42%;height:5%;opacity:.5;
        background:repeating-linear-gradient(90deg,rgba(180,255,220,.35) 0 1px,rgba(0,0,0,0) 1px 13px),repeating-linear-gradient(90deg,rgba(180,255,220,.3) 0 1px,rgba(0,0,0,0) 1px 31px);
        -webkit-mask-image:linear-gradient(rgba(0,0,0,.9),rgba(0,0,0,0));mask-image:linear-gradient(rgba(0,0,0,.9),rgba(0,0,0,0))}
</style>
</head>
<body>
<div id="ui"><div id="glow"></div><div id="rain"></div><div id="nav"><i></i></div></div>
<canvas id="txt"></canvas>
<script>__THREE__</script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// activetheory.net 首页第一屏的 WebGL 复刻（three.js r147），照他们自己的着色器逐层重建：
//  · 环 / 管 / Y：深色玻璃折射背景 + 菲涅尔彩虹边 + 流动法线扰动（HomeLogoShader / ChainShader）
//  · 星尘：GPU 点精灵，大小 ∝ 1000/距离，暗心亮边的小气泡（LogoParticle / FloatingParticles）
//  · 雾：软光片加法叠加再进 bloom（LightVolume → composite）
//  · 后期：UnrealBloom、RGB 错位、对比度、角落渐变光、胶片噪点、右上角磨砂（GlobalComposite.fs）
//  · 动：相机 wobble + 手指 moveXY 视差（他们参数表 wobbleStrength .1 / moveXY [.4,.2]）；
//        往下滑 = 相机推进（他们 camera.z = 40 − 15·scroll）+ 星尘上涌 + 雾转紫 + 大字像素格故障显形（DefaultText.glsl）
// 相机：fov 30，距离 15.75 → z=0 平面上 1 世界单位 = 100 css px（844 高的基准），几何直接从参考帧量出来填。
// ─────────────────────────────────────────────────────────────────────────────
var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
var renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(DPR);
renderer.outputEncoding = THREE.LinearEncoding;
document.body.insertBefore(renderer.domElement, document.getElementById('ui'));
var camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 15.75);
var CAM_Z = 15.75;

function px(x, y) { return new THREE.Vector3((x - 195) / 100, (422 - y) / 100, 0); }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function smooth(p) { return p * p * (3 - 2 * p); }
function seg(t, a, b) { return clamp01((t - a) / (b - a)); }

var GLSL_NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
vec3 hsv2rgb(vec3 c){vec4 K=vec4(1.0,2.0/3.0,1.0/3.0,3.0);vec3 p=abs(fract(c.xxx+K.xyz)*6.0-K.www);return c.z*mix(K.xxx,clamp(p-K.xxx,0.0,1.0),c.y);}
vec3 rgb2hsv(vec3 c){vec4 K=vec4(0.0,-1.0/3.0,2.0/3.0,-1.0);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);float e=1.0e-10;return vec3(abs(q.z+(q.w-q.y)/(6.0*d+e)),d/(q.x+e),q.x);}
`;

// ══ 背景层（渲到 RT，给环和管当折射源）════════════════════════════════════
var bgScene = new THREE.Scene();
bgScene.background = new THREE.Color(0x090d11);
var rtBG = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat });

function softTex() {
  var c = document.createElement('canvas'); c.width = c.height = 256; var g = c.getContext('2d');
  var grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.35, 'rgba(255,255,255,0.45)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
var soft = softTex();
function light(color, x, y, z, sx, sy, alpha) {
  var m = new THREE.SpriteMaterial({ map: soft, color: color, transparent: true, opacity: alpha, blending: THREE.AdditiveBlending, depthWrite: false });
  var s = new THREE.Sprite(m); s.position.set(x, y, z); s.scale.set(sx, sy, 1); bgScene.add(s);
  s.userData = { x: x, y: y, sx: sx, sy: sy, a: alpha, c0: new THREE.Color(color) };
  return s;
}
// 取色自参考帧：左上青雾、右下青绿雾、顶部蓝灰。往下滑时转成他们第二屏的紫 / 洋红（见 live-m-05）
var fogTL = light(0x24a0b8, -3.1, 5.1, -1.0, 5.2, 4.6, 1.0);  fogTL.userData.c1 = new THREE.Color(0x4f3a86);
var fogTL2 = light(0x1a6e84, -2.2, 4.0, -1.5, 7.0, 5.0, 0.55); fogTL2.userData.c1 = new THREE.Color(0x38265e);
var fogBR = light(0x26a8a0, 3.3, -5.2, -1.0, 5.0, 4.6, 1.0);   fogBR.userData.c1 = new THREE.Color(0x7a4a86);
var fogTop = light(0x1a3d4d, 0.5, 4.2, -3.0, 11.0, 3.6, 0.42); fogTop.userData.c1 = new THREE.Color(0x2e2545);
var fogCenter = light(0x0d2230, 0.0, -0.5, -3.0, 9.0, 9.0, 0.2); fogCenter.userData.c1 = new THREE.Color(0x1e1730);
var fogs = [fogTL, fogTL2, fogBR, fogTop, fogCenter];

// 星尘
var N = 760;
var pos = new Float32Array(N * 3), rnd = new Float32Array(N * 4), col = new Float32Array(N * 3);
(function seed() {
  var s = 11; function r() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }
  for (var i = 0; i < N; i++) {
    var u = r();
    var y = u < 0.88 ? -0.6 - 4.8 * Math.pow(u / 0.88, 0.6) : -0.6 + 2.8 * r();
    var e = r(); var x = (r() < 0.5 ? -1 : 1) * (e < 0.55 ? 1.0 + 2.4 * r() : 1.4 * r());
    var z = -3.0 + r() * 5.0;
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
    rnd[i * 4] = r(); rnd[i * 4 + 1] = r(); rnd[i * 4 + 2] = r(); rnd[i * 4 + 3] = r();
    var k = r(), c;
    if (k < 0.66) c = [0.72, 0.76, 0.42];
    else if (k < 0.84) c = [0.52, 0.62, 0.78];
    else if (k < 0.93) c = [0.74, 0.74, 0.76];
    else c = [0.05, 0.06, 0.07];
    col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
  }
})();
var dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
dustGeo.setAttribute('random', new THREE.BufferAttribute(rnd, 4));
dustGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
var dustMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 }, DPR: { value: DPR }, uSizeBias: { value: 1.0 }, uScroll: { value: 0 }, uPointer: { value: new THREE.Vector2(99, 99) } },
  transparent: true, depthWrite: false,
  vertexShader: `
    attribute vec4 random; attribute vec3 color;
    uniform float time, DPR, uSizeBias, uScroll; uniform vec2 uPointer;
    varying vec4 vRandom; varying vec3 vColor; varying float vScale;
    void main(){
      vec3 p = position;
      // 待机：慢慢往上飘 + 轻微摆动（他们 pos.y += sin(time+rand*20)*…）
      p.y += time * 0.06 * (0.3 + random.w);
      p.y += sin(time*0.35 + random.x*20.0) * 0.05 * (0.4 + random.w);
      p.x += cos(time*0.25 + random.y*20.0) * 0.03;
      // 往下滑：星尘上涌，少数飞得很快（他们 scrollMove 用 pow(random.y, …) 挑出一小撮）
      p.y += smoothstep(0.0, 0.9, uScroll) * mix(1.5, 9.0, pow(random.y, 6.0));
      p.y = mod(p.y + 5.4, 8.0) - 5.4;
      // 手指推开（他们是流体模拟，这里用一个软排斥）
      vec2 d = p.xy - uPointer; float rr = length(d);
      p.xy += (d / max(rr, 1e-3)) * smoothstep(1.3, 0.0, rr) * 0.45;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = length(mv.xyz);
      float sc = smoothstep(6.0, 22.0, dist);
      sc *= 1.0 + (0.5 + sin(time*5.0 + random.x*20.0)*0.5) * 0.35;
      sc *= mix(0.35, 1.6, random.z);
      sc *= mix(1.0, 2.0, pow(random.x, 40.0));
      vScale = sc;
      gl_PointSize = 0.055 * DPR * 2.0 * sc * (1000.0 / dist) * uSizeBias;
      gl_Position = projectionMatrix * mv;
      vRandom = random; vColor = color;
    }`,
  fragmentShader: `
    uniform float time; varying vec4 vRandom; varying vec3 vColor; varying float vScale;
    void main(){
      vec2 p = gl_PointCoord - 0.5; float r = length(p);
      if (r > 0.5 || vScale < 0.08) discard;
      float rim = smoothstep(0.0, 0.42, r);
      float lit = clamp(dot(normalize(p + 1e-4), normalize(vec2(-0.6, 0.8))), 0.0, 1.0);
      vec3 c = vColor * (0.62 + 0.45 * rim * (0.5 + 0.6 * lit));
      float sparkle = 0.55 + 0.45 * sin(time*2.0 + vRandom.y*20.0);
      c *= mix(0.7, 1.2, sparkle * vRandom.z);
      float a = smoothstep(0.5, 0.2, r) * 0.85;
      gl_FragColor = vec4(c, a);
    }`,
});
bgScene.add(new THREE.Points(dustGeo, dustMat));

// ══ 前景层：环 + Y + 管，折射 rtBG ═══════════════════════════════════════════
var fgScene = new THREE.Scene();
fgScene.background = rtBG.texture;

var glassMat = new THREE.ShaderMaterial({
  uniforms: { tRefraction: { value: rtBG.texture }, resolution: { value: new THREE.Vector2(1, 1) }, time: { value: 0 }, uScroll: { value: 0 } },
  vertexShader: `
    varying vec3 vNormal, vViewDir, vWorldPos;
    void main(){
      vNormal = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vViewDir = -mv.xyz;
      vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: GLSL_NOISE + `
    uniform sampler2D tRefraction; uniform vec2 resolution; uniform float time, uScroll;
    varying vec3 vNormal, vViewDir, vWorldPos;
    vec3 rainbow(float t){ t = clamp(t, 0.0, 0.3) / 0.3; return hsv2rgb(vec3(0.78 - t * 0.78, 1.0, 1.0)); }
    void main(){
      vec2 screenuv = gl_FragCoord.xy / resolution;
      vec3 N = normalize(vNormal); vec3 V = normalize(vViewDir);
      float n1 = snoise(vWorldPos * 3.5 + vec3(0.0, -time * 0.18, 0.0));
      float n2 = snoise(vWorldPos * 3.5 + vec3(5.2, -time * 0.18, 1.3));
      vec2 pn = vec2(n1, n2);
      vec3 Np = normalize(N + vec3(pn, 0.0) * 0.25);
      vec3 color = texture2D(tRefraction, screenuv - Np.xy * 0.06 - pn * 0.006).rgb * 0.3;
      float lam = max(dot(Np, normalize(vec3(-0.3, 0.9, 0.5))), 0.0);
      color += vec3(0.21, 0.215, 0.245) * (0.30 + 0.70 * lam);
      vec2 toC = normalize(vec2(0.02, -0.02) - vWorldPos.xy);
      float inner = 0.3 + 0.7 * clamp(dot(normalize(Np.xy + 1e-4), toC), 0.0, 1.0);
      float spk = snoise(vWorldPos * 28.0 + vec3(0.0, time * 0.05, 0.0)) * 0.6 + snoise(vWorldPos * 90.0) * 0.4;
      float f = 1.0 - pow(abs(dot(Np, V)), 1.5 + sin(time * 0.1) * 0.3);
      vec3 r = rainbow(clamp(f + spk * 0.25, 0.0, 1.0) * 0.3);
      vec3 rh = rgb2hsv(r); rh.x = fract(rh.x + 0.5); r = hsv2rgb(rh);
      color += r * f * 0.30 * inner;
      color += pow(f, 2.0) * 0.36 * inner;
      color += max(spk, 0.0) * 0.16 * (0.5 + 0.5 * inner);
      vec3 L = normalize(vec3(-0.35, 0.85, 0.55)); vec3 Hh = normalize(L + V);
      color += pow(max(dot(Np, Hh), 0.0), 70.0) * 0.5 * inner;
      vec3 L2 = normalize(vec3(0.7, -0.5, 0.6)); vec3 H2 = normalize(L2 + V);
      color += pow(max(dot(Np, H2), 0.0), 90.0) * vec3(0.9, 0.7, 1.0) * 0.25;
      // 往下滑：管和环染上他们第二屏那种粉紫铬（live-m-05）
      color += uScroll * vec3(0.30, 0.10, 0.34) * (0.4 + 0.6 * inner) * (0.5 + 0.5 * f);
      vec3 hs = rgb2hsv(color); hs.y *= 0.9; color = hsv2rgb(hs);
      color = pow(color * 1.35, vec3(1.35));
      gl_FragColor = vec4(color, 1.0);
    }`,
});

// 环：参考帧外径横 69 / 竖 78 css px → 主半径 .78，绕 Y 转 28° 就是竖长的椭圆；带宽约 10px → 管半径 .06
var ring = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.06, 48, 256), glassMat);
ring.position.copy(px(197, 424));
var RING_ROT_Y = 0.485;
ring.rotation.y = RING_ROT_Y; ring.rotation.z = -0.06;
var logo = new THREE.Group(); fgScene.add(logo); logo.add(ring);

// Y：老板说 a 换成 Y。三段胶囊拼的，跟环同一种铬，挂在环上一起转。占环内径六成左右（他们的 a 也差不多）
(function buildY() {
  var rad = 0.085, arm = 0.56, stem = 0.40;
  function bar(len, angle, cx, cy) {
    var g = new THREE.CapsuleGeometry(rad, len, 6, 24);
    var m = new THREE.Mesh(g, glassMat);
    m.position.set(cx, cy, 0); m.rotation.z = angle; ring.add(m);
  }
  var a = 0.55, j = -0.04;  // 字形比例：两臂离竖直 31.5° 且比杆长，交点略低于环心 —— 臂短杆长就成箭头了
  // rotation.z 为负 = 顶端往 +x 倒，所以往右倒的那根要放在右边，两臂才是从交点向外上方张开（之前反了，成了箭头）
  bar(arm, -a, Math.sin(a) * arm / 2, j + Math.cos(a) * arm / 2);
  bar(arm, a, -Math.sin(a) * arm / 2, j + Math.cos(a) * arm / 2);
  bar(stem, 0, 0, j - stem / 2);
})();

// 管：从环底左右两点出发，环下交叉，向两侧鼓出再从画面底部收回
var loopPts = [
  px(165, 492), px(205, 560), px(260, 645), px(300, 725), px(306, 780), px(280, 844), px(200, 905),
  px(115, 844), px(85, 780), px(92, 725), px(135, 645), px(205, 560), px(227, 492),
];
loopPts[1].z = 0.06; loopPts[11].z = -0.06;
loopPts[5].z = 0.25; loopPts[7].z = 0.25; loopPts[6].z = 0.35;
var curve = new THREE.CatmullRomCurve3(loopPts, false, 'centripetal', 0.5);
var tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 320, 0.052, 20, false), glassMat);
logo.add(tube);

// ══ 后期 ═══════════════════════════════════════════════════════════════════
var composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(fgScene, camera));
var bloom = new THREE.UnrealBloomPass(new THREE.Vector2(390, 844), 0.7, 0.7, 0.55);
composer.addPass(bloom);
var finalPass = new THREE.ShaderPass({
  uniforms: { tDiffuse: { value: null }, resolution: { value: new THREE.Vector2(1, 1) }, time: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: GLSL_NOISE + `
    uniform sampler2D tDiffuse; uniform vec2 resolution; uniform float time; varying vec2 vUv;
    float getNoise(vec2 uv, float t){ float x = uv.x * uv.y * t * 1000.0; x = mod(x, 13.0) * mod(x, 123.0); float dx = mod(x, 0.01); return clamp(0.1 + dx * 100.0, 0.0, 1.0); }
    vec3 overlay(vec3 b, vec3 s, float o){ vec3 r = mix(2.0*b*s, 1.0-2.0*(1.0-b)*(1.0-s), step(0.5, b)); return mix(b, r, o); }
    void main(){
      vec2 uv = vUv;
      vec2 sq = (uv - 0.5) * vec2(1.0, resolution.y / resolution.x) + 0.5;
      float frost = smoothstep(0.30, 0.0, length(uv - vec2(1.0, 1.0))) * 0.08;
      vec2 fn = vec2(snoise(vec3(uv * 55.0, 1.7)), snoise(vec3(uv * 55.0 + 9.1, 4.2)));
      uv += fn * frost * 0.5;
      vec2 off = vec2(cos(2.0944), sin(2.0944)) * 0.0011;
      vec3 c = vec3(texture2D(tDiffuse, uv + off).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - off).b);
      c = (c - 0.5) * 1.06 + 0.5;
      vec3 grad = hsv2rgb(vec3(fract(0.62 + snoise(vec3(sq * 0.65, time * 0.04)) * 0.065), 0.5, 1.0));
      float gN = 0.5 + snoise(vec3(sq * 0.7, time * 0.03 + 3.0)) * 0.5;
      float corner = 0.7 * 1.5 * smoothstep(0.55, 0.95, length(sq - 0.5));
      c += grad * (0.05 + pow(corner * gN, 2.0)) * 0.22;

    for (var j = 0; j < items.length; j++) pixelText('->  ' + items[j], mf, '#B38AFF', lx2, my + (j + 1) * 20 * u, 'left', mCell, mA, 0.05);
    // 输入药丸
    tctx.globalAlpha = mA; tctx.strokeStyle = 'rgba(140,205,195,0.7)'; tctx.lineWidth = 1.1 * u;
    var pw = W * 0.5, ph = 32 * u, pxx = lx2, py = H * 0.865;
    tctx.beginPath(); tctx.moveTo(pxx + ph / 2, py); tctx.arcTo(pxx + pw, py, pxx + pw, py + ph, ph / 2); tctx.arcTo(pxx + pw, py + ph, pxx, py + ph, ph / 2); tctx.arcTo(pxx, py + ph, pxx, py, ph / 2); tctx.arcTo(pxx, py, pxx + pw, py, ph / 2); tctx.closePath(); tctx.stroke();
    tctx.globalAlpha = 1;
    pixelText('问问云曦…', mf, 'rgba(180,200,210,0.85)', pxx + 18 * u, py + ph / 2, 'left', mCell, mA, 0.05);
  }
  // 详情文案（点开卡后）：他们是 标题 / 年份·客户·类型 / 简介 / 链接 / <- CLOSE
  if (det > 0.02 && detailCard) {
    var dd = detailCard.userData.data, dT = smooth(seg(det, 0.35, 1.0)), dCell = glitchCell(dT), dA = flicker(dT, t) * seg(det, 0.3, 0.6);
    var lx3 = W * 0.08, y0 = H * 0.535, mf2 = '500 ' + Math.round(10.5 * u) + 'px ' + mono;
    pixelText(dd.name + '  ·  ' + dd.crown, '800 ' + Math.round(18 * u) + 'px ' + sans, '#ffffff', lx3, y0, 'left', dCell, dA, 0.1);
    pixelText('神之冠冕  /  角色  /  ' + dd.trait, mf2, '#B38AFF', lx3, y0 + 26 * u, 'left', dCell, dA, 0.05);
    var sl = wrap(dd.story, 17);
    for (var q = 0; q < sl.length; q++) pixelText(sl[q], mf2, 'rgba(255,255,255,0.92)', lx3, y0 + (54 + q * 18) * u, 'left', dCell, dA, 0.1);
    var ql = wrap('「' + dd.quote + '」', 17), qy = y0 + (54 + sl.length * 18 + 14) * u;
    for (var q2 = 0; q2 < ql.length; q2++) pixelText(ql[q2], '500 ' + Math.round(10.5 * u) + 'px ' + sans, 'rgba(200,215,255,0.9)', lx3, qy + q2 * 18 * u, 'left', dCell, dA, 0.1);
    pixelText('->  看她的祈愿记录', mf2, '#B38AFF', lx3, H * 0.855, 'left', dCell, dA, 0);
    pixelText('<-  关闭', mf2, 'rgba(255,255,255,0.9)', lx3, H * 0.895, 'left', dCell, dA, 0);
  }
}

// ══ 交互：手指视差 / 往下滑 / 悬停 / 点卡 ═══════════════════════════════════
var NCARDS = CARDS.length, SCROLL_MAX = 1 + NCARDS + 0.4;
var ptr = { x: 0, y: 0, tx: 0, ty: 0, wx: 99, wy: 99, down: false, ly: 0, dx0: 0, dy0: 0, moved: 0, sx: 0.5, sy: 0.5 }, scroll = 0, scrollT = 0;
var detail = 0, detailT = 0, detailCard = null, detailFrom = 0, hoverIdx = -1;
// 他们的 workInOut = cubic-bezier(.29,.05,.06,.92)
function bez(t) { var x1 = 0.29, y1 = 0.05, x2 = 0.06, y2 = 0.92, lo = 0, hi = 1, s = t;
  for (var i = 0; i < 18; i++) { var mt = 1 - s, bx = 3 * mt * mt * s * x1 + 3 * mt * s * s * x2 + s * s * s; if (bx < t) lo = s; else hi = s; s = (lo + hi) / 2; }
  var m = 1 - s; return 3 * m * m * s * y1 + 3 * m * s * s * y2 + s * s * s; }
function hitCard(cx, cy) {
  if (!W || !H) return -1;
  ndc.set((cx / W) * 2 - 1, -(cy / H) * 2 + 1); raycaster.setFromCamera(ndc, camera);
  var hits = raycaster.intersectObjects(cards, false);
  return hits.length ? hits[0].object.userData.i : -1;
}
window.addEventListener('pointerdown', function (e) { ptr.down = true; ptr.ly = e.clientY; ptr.dx0 = e.clientX; ptr.dy0 = e.clientY; ptr.moved = 0; });
window.addEventListener('pointermove', function (e) {
  ptr.tx = (e.clientX / W - 0.5) * 2; ptr.ty = -(e.clientY / H - 0.5) * 2; ptr.sx = e.clientX / W; ptr.sy = e.clientY / H;
  var hw = 8.44 * (camera.position.z / CAM_Z);
  ptr.wx = ptr.tx * hw * (W / H) / 2; ptr.wy = ptr.ty * hw / 2;
  if (ptr.down) { ptr.moved += Math.abs(e.clientX - ptr.dx0) + Math.abs(e.clientY - ptr.dy0);
    if (detailT < 0.5) scrollT = Math.min(SCROLL_MAX, Math.max(0, scrollT - (e.clientY - ptr.ly) / 600)); ptr.ly = e.clientY; }
  hoverIdx = detailT > 0.5 ? -1 : hitCard(e.clientX, e.clientY);
});
function up(e) {
  var tap = ptr.down && ptr.moved < 10;
  ptr.down = false; ptr.wx = 99; ptr.wy = 99;
  if (!tap) return;
  if (detailT > 0.5) { detailT = 0; return; }                       // 详情里点哪儿都关
  var k = hitCard(e.clientX, e.clientY);
  if (k >= 0) { detailCard = cards[k]; detailT = 1; }
}
window.addEventListener('pointerup', up); window.addEventListener('pointercancel', function () { ptr.down = false; ptr.wx = 99; ptr.wy = 99; });
window.addEventListener('wheel', function (e) { if (detailT < 0.5) scrollT = Math.min(SCROLL_MAX, Math.max(0, scrollT + e.deltaY / 1600)); }, { passive: true });

function fit() {
  W = window.innerWidth; H = window.innerHeight;
  if (!W || !H) return;
  u = Math.min(W, H * 9 / 16) / 390;
  renderer.setSize(W, H); composer.setSize(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  rtBG.setSize(Math.round(W * DPR), Math.round(H * DPR));
  glassMat.uniforms.resolution.value.set(W * DPR, H * DPR);
  finalPass.uniforms.resolution.value.set(W * DPR, H * DPR);
  bloom.setSize(W, H);
  dustMat.uniforms.uSizeBias.value = H / 844; confMat.uniforms.uSizeBias.value = H / 844;
  txt.width = Math.round(W * DPR); txt.height = Math.round(H * DPR); txt.style.width = W + 'px'; txt.style.height = H + 'px';
}
window.addEventListener('resize', fit); fit();

var t0 = 0, paused = false, tmp = new THREE.Color(), lastT = 0;
function frame(now) {
  if (!t0) t0 = now;
  if (!paused) draw((now - t0) / 1000);
  requestAnimationFrame(frame);
}
function draw(t) {
  if (!W || !H) return;
  var dt = Math.min(0.05, Math.max(0.001, t - lastT)); lastT = t;
  ptr.x += (ptr.tx - ptr.x) * 0.08; ptr.y += (ptr.ty - ptr.y) * 0.08;
  scroll += (scrollT - scroll) * 0.07;
  // 详情开合：1500ms，他们的曲线
  detailFrom = clamp01(detailFrom + (detailT > 0.5 ? 1 : -1) * dt / 1.5);   // 1500ms 线性推进，再套他们的曲线
  var det = bez(detailFrom);
  var sc = smooth(Math.min(scroll, 1)), cs = Math.max(0, scroll - 1);
  // 相机
  camera.position.x = Math.sin(t * 0.31) * 0.10 + ptr.x * 0.4 * (1 - det);
  camera.position.y = Math.cos(t * 0.23) * 0.06 + ptr.y * 0.2 * (1 - det) + sc * 0.3;
  camera.position.z = CAM_Z - 6.4 * sc;
  camera.lookAt(0, sc * 0.3, 0);
  // 首屏 logo：进卡片区后整体升走
  logo.position.y = cs * 6.5 + det * 3.0;
  ring.rotation.y = RING_ROT_Y * (1 - sc) + 0.14 * sc + Math.sin(t * 0.4) * 0.07;
  ring.rotation.x = Math.sin(t * 0.27) * 0.05;
  ring.position.y = -0.02 + Math.sin(t * 0.5) * 0.03 - sc * 0.1;
  ring.position.x = 0.02 + ptr.x * 0.05;
  tube.rotation.z = Math.sin(t * 0.33) * 0.012; tube.position.x = Math.sin(t * 0.21) * 0.03;
  // 卡片区：整组随滚动上移，柱子跟着
  cardsGroup.position.y = cs * SPACING - det * 2.2;
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i], d = c.userData, k = i + 1, rel = cs - k;   // rel>0 已滑过，<0 还在下面
    var passed = clamp01(rel), isDetail = (detailCard === c) ? det : 0;
    var baseX = d.side * 0.18 * (1 - passed) + d.side * 0.35 * passed;
    var bx = baseX, by = -k * SPACING + passed * 0.6, bz = -passed * 1.6 - Math.max(0, -rel) * 0.3;
    var rotY = d.side * 0.16 - passed * d.side * 0.25, rotX = -0.07 - passed * 0.35, rotZ = d.side * 0.02;
    // 详情：飞到相机前上方，收平、放大（他们相机推进 + 卡成头图）
    var tx = 0.0, ty = -cardsGroup.position.y + 0.75, tz = 1.5, ts = 0.88;
    c.position.set(bx + (tx - bx) * isDetail, by + (ty - by) * isDetail, bz + (tz - bz) * isDetail);
    c.rotation.set(rotX * (1 - isDetail), rotY * (1 - isDetail), rotZ * (1 - isDetail));
    var s = (1 - 0.25 * passed) * (1 - isDetail) + ts * isDetail;
    if (detailCard && detailCard !== c) s *= (1 - det);        // 其它卡收掉
    c.scale.setScalar(Math.max(0.001, s));
    var hv = (hoverIdx === i && !detailCard) ? 1 : 0;
    d.hover += (hv - d.hover) * 0.08;
    var um = c.material.uniforms; um.time.value = t; um.uHover.value = d.hover; um.uOpen.value = isDetail;
    um.uMouse.value.set(ptr.sx, ptr.sy);
  }
  column.visible = det < 0.98; column.scale.setScalar(Math.max(0.001, 1 - det));
  // 雾：进卡片区停在紫；详情时染角色色（他们 UI 染项目色）
  for (var f = 0; f < fogs.length; f++) {
    var fg = fogs[f], dd = fg.userData, ph = f * 1.7;
    fg.position.x = dd.x + Math.sin(t * 0.17 + ph) * 0.25; fg.position.y = dd.y + Math.cos(t * 0.13 + ph) * 0.2;
    var b = 1 + Math.sin(t * 0.2 + ph) * 0.08; fg.scale.set(dd.sx * b, dd.sy * b, 1);
    fg.material.opacity = dd.a * (1 + 0.25 * sc);
    tmp.copy(dd.c0).lerp(dd.c1, sc); if (detailCard) tmp.lerp(detailCard.material.uniforms.uColor.value, det * 0.6); fg.material.color.copy(tmp);
  }
  dustMat.uniforms.time.value = t; dustMat.uniforms.uScroll.value = Math.min(scroll, 1); dustMat.uniforms.uPointer.value.set(ptr.wx, ptr.wy);
  confMat.uniforms.time.value = t;
  glassMat.uniforms.time.value = t; glassMat.uniforms.uScroll.value = sc;
  finalPass.uniforms.time.value = t;
  if (detailCard && det < 0.01 && detailT === 0) detailCard = null;
  renderer.setRenderTarget(rtBG); renderer.render(bgScene, camera); renderer.setRenderTarget(null);
  composer.render();
  drawText(t, scroll, cs, det, detailCard);
}
// 截图用：seek(秒, 滚动量, 悬停卡序号或-1, 打开卡序号或-1)
window.seek = function (s, sc2, hov, open) {
  paused = true; t0 = 1;
  if (sc2 != null) { scroll = scrollT = sc2; }
  if (hov != null) { hoverIdx = hov; for (var i = 0; i < cards.length; i++) cards[i].userData.hover = (i === hov) ? 1 : 0; ptr.sx = 0.55; ptr.sy = 0.45; }
  if (open != null) { if (open >= 0) { detailCard = cards[open]; detailT = 1; detailFrom = 1; } else { detailT = 0; detailFrom = 0; detailCard = null; } }
  lastT = s - 0.016; draw(s);
};
requestAnimationFrame(frame);
</script>
