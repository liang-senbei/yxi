<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin:0; font-family:'Space Grotesk', system-ui, sans-serif; }
    a { color:#8b4f24; } a:hover { color:#6d3a10; }
    * { box-sizing:border-box; }
  </style>
</helmet>

<!-- M3 浅色：同一套形状语言，明亮 -->
<div style="width:390px; height:844px; background:#fff8f5; color:#221a15; display:flex; flex-direction:column; overflow:hidden;">

  <div style="display:flex; align-items:center; gap:14px; padding:14px 18px 12px; flex-shrink:0;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#52443c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="flex-grow:1; min-width:0;">
      <div style="font-size:17px; font-weight:600; letter-spacing:-0.01em;">cc-Yxi</div>
      <div style="display:flex; align-items:center; gap:6px; margin-top:2px;">
        <div style="width:7px; height:7px; border-radius:4px; background:#1d6a58;"></div>
        <div style="font-size:12px; color:#7a6a5f;">干活中</div>
      </div>
    </div>
    <div style="display:flex; background:#f5e5dc; border-radius:100px; padding:4px; flex-shrink:0;">
      <div style="padding:9px 13px; font-size:12.5px; font-weight:500; color:#7a6a5f; border-radius:100px;">终端</div>
      <div style="padding:9px 13px; font-size:12.5px; font-weight:600; color:#ffffff; background:#8b4f24; border-radius:100px;">对话</div>
      <div style="padding:9px 13px; font-size:12.5px; font-weight:500; color:#7a6a5f; border-radius:100px;">文件</div>
    </div>
  </div>

  <div style="flex-grow:1; display:flex; flex-direction:column; gap:22px; padding:14px 18px; overflow:hidden;">

    <div style="display:flex; justify-content:flex-end;">
      <div style="max-width:82%; background:#ffdcc4; color:#331200; border-radius:26px 26px 8px 26px; padding:14px 18px; font-size:15px; line-height:1.55;">看一下部署脚本为什么在 ARM 上失败</div>
    </div>

    <div style="display:flex; align-items:center; gap:9px; padding:11px 16px; background:#fbebe2; border-radius:100px; align-self:flex-start;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a7568" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>
      <div style="font-size:13px; color:#8a7568;">思考了 8 秒</div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a7568" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div style="font-size:15px; line-height:1.7;">脚本里写死了 <span style="font-family:'JetBrains Mono', monospace; font-size:13.5px; background:#f5e5dc; border-radius:7px; padding:2px 7px;">x86_64</span> 的下载路径。先确认一下架构：</div>

    <div style="border-radius:28px; overflow:hidden; background:#fbebe2;">
      <div style="display:flex; align-items:center; gap:10px; padding:14px 18px 10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b4f24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
        <div style="font-size:12.5px; font-weight:600; color:#8b4f24; letter-spacing:0.03em; flex-grow:1;">Bash</div>
        <div style="font-size:11.5px; font-family:'JetBrains Mono', monospace; color:#1d6a58;">exit 0</div>
      </div>
      <div style="padding:0 18px 12px; font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.6; color:#3a2c23;">uname -m &amp;&amp; file $(which node)</div>
      <div style="margin:0 8px 8px; padding:12px 14px; background:#ffffff; border-radius:22px; font-family:'JetBrains Mono', monospace; font-size:12.5px; line-height:1.55; color:#6b5a4e;">aarch64<br>node: ELF 64-bit LSB, ARM aarch64</div>
    </div>

    <div style="border-radius:28px; overflow:hidden; background:#fbebe2;">
      <div style="display:flex; align-items:center; gap:10px; padding:14px 18px 10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d6a58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        <div style="font-size:12.5px; font-weight:600; color:#1d6a58; letter-spacing:0.03em; flex-grow:1;">Edit</div>
        <div style="font-family:'JetBrains Mono', monospace; font-size:11.5px; color:#8a7568;">deploy.sh</div>
      </div>
      <div style="margin:0 8px 8px; border-radius:22px; overflow:hidden; font-family:'JetBrains Mono', monospace; font-size:12.5px; line-height:1.9;">
        <div style="display:flex; background:#ffdad4; padding:3px 16px; gap:10px;"><span style="color:#8c1d18; width:10px;">−</span><span style="color:#8c1d18;">ARCH=x86_64</span></div>
        <div style="display:flex; background:#c9ecd2; padding:3px 16px; gap:10px;"><span style="color:#0f5132; width:10px;">+</span><span style="color:#0f5132;">ARCH=$(uname -m)</span></div>
      </div>
    </div>

  </div>

  <div style="flex-shrink:0; padding:8px 14px 20px; display:flex; align-items:center; gap:10px;">
    <div style="width:52px; height:52px; border-radius:26px; background:#f5e5dc; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#52443c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.2-9.19a4 4 0 015.65 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
    </div>
    <div style="flex-grow:1; height:52px; display:flex; align-items:center; background:#f5e5dc; border-radius:26px; padding:0 20px; font-size:15px; color:#8a7568;">给 cc-Yxi 发消息…</div>
    <div style="width:52px; height:52px; border-radius:26px; background:#8b4f24; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
