<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>钢琴块碎裂 · 20 款</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#0b0d12;color:#E8EDF5;font:14px/1.5 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  header{padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
  h1{margin:0;font-size:16px;font-weight:500;letter-spacing:.02em}
  .sub{color:#7E8798;font-size:12px;font-weight:300;margin-top:2px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;padding:8px 18px 4px;align-items:center}
  .bar button{padding:6px 12px;border-radius:100px;border:1px solid #ffffff1c;background:#ffffff08;color:#AEB7C6;font-size:12px;font-weight:300}
  .bar button.on{background:#E8EDF5;color:#0b0d12;border-color:#E8EDF5;font-weight:500}
  .bar .sp{flex:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:10px 18px calc(24px + env(safe-area-inset-bottom))}
  .cell{position:relative;background:#10141c;border:1px solid #ffffff10;border-radius:14px;overflow:hidden;aspect-ratio:3/4}
  .cell canvas{display:block;width:100%;height:100%;touch-action:manipulation}
  .cell .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px 9px;background:linear-gradient(transparent,#0b0d12e6 55%);pointer-events:none}
  .cell .n{font-size:13px;font-weight:500}
  .cell .d{font-size:11px;color:#8FA0B8;font-weight:300;line-height:1.4;margin-top:1px}
  .cell .idx{position:absolute;top:8px;left:10px;font-size:11px;color:#7E8798;font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .cell.fav{border-color:#FDBE5A88}
  .cell .star{position:absolute;top:6px;right:8px;width:28px;height:28px;border-radius:100px;border:0;background:transparent;color:#ffffff55;font-size:16px;line-height:28px;text-align:center}
  .cell.fav .star{color:#FDBE5A}
  .none{padding:40px 18px;color:#7E8798;text-align:center;font-weight:300}
</style>
</head>
<body>
<header>
  <h1>钢琴块碎裂 · 20 款</h1>
  <div class="sub">点一下方块就碎；再点再碎。右上角 ☆ 收藏，收藏完点「复制收藏」发我。</div>
</header>
<div class="bar">
  <span id="colors"></span>
  <span class="sp"></span>
  <button id="playall">全部播一遍</button>
  <button id="copy">复制收藏</button>
</div>
<div class="grid" id="grid"></div>
<div class="none" id="none" hidden>一个特效都没加载到 —— 子 agent 的文件还没并进来。</div>

<script>
/* ── glass.js：1 个 ── */
// design/shatter/glass.js —— 钢琴块碎裂特效 × 5：玻璃 / 水晶 / 冰
// 契约：draw(ctx, tile, t, rng)。t∈[0,1]，rng 每帧按 seed 重置。
// 每个特效里所有 rng() 都在「几何生成」段调用、与 t 无关，所以任意 t 单独画一帧也一致；闭包里不存状态。
(() => {
'use strict';
const TAU = Math.PI * 2, WH = [255, 255, 255], BK = [0, 0, 0];
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const outQ = v => 1 - (1 - v) * (1 - v);
const outC = v => 1 - (1 - v) ** 3;
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mix = (c, k, to) => [c[0] + (to[0] - c[0]) * k | 0, c[1] + (to[1] - c[1]) * k | 0, c[2] + (to[2] - c[2]) * k | 0];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${clamp01(a)})`;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function path(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
function centroid(pts) { let x = 0, y = 0; for (const p of pts) { x += p[0]; y += p[1]; } return [x / pts.length, y / pts.length]; }
// 冲击点到方块四角的最远距离
const farCorner = (px, py, x, y, w, h) => Math.max(dist(px, py, x, y), dist(px, py, x + w, y), dist(px, py, x, y + h), dist(px, py, x + w, y + h));
// 从 (px,py) 沿 (dx,dy) 射线打到矩形边界：[hx, hy, 周长参数 s（从左上角起顺时针）, 距离]
function hitRect(px, py, dx, dy, x, y, w, h) {
  const tx = dx > 0 ? (x + w - px) / dx : dx < 0 ? (x - px) / dx : Infinity;
  const ty = dy > 0 ? (y + h - py) / dy : dy < 0 ? (y - py) / dy : Infinity;
  const d = Math.min(tx, ty), hx = px + dx * d, hy = py + dy * d;
  const s = tx < ty ? (dx > 0 ? w + (hy - y) : 2 * w + h + (y + h - hy)) : (dy > 0 ? w + h + (x + w - hx) : hx - x);
  return [hx, hy, s, d];
}

// ① 碎玻璃：径向 + 环状裂纹先铺开，随后整块碎成不规则块，块面随翻转明暗变化（折射高光）
function glass(ctx, tile, t, rng) {
  const { x, y, w, h } = tile, base = hex(tile.color);
  const px = x + w * (.3 + .4 * rng()), py = y + h * (.3 + .4 * rng());
  const n = 9, F = Math.min(w, h) < 70 ? [.3, .62] : [.2, .45, .72], K = F.length, P = 2 * (w + h);
  const sp = [];
  for (let i = 0; i < n; i++) {
    const a = i * TAU / n + (rng() - .5) * .5, dx = Math.cos(a), dy = Math.sin(a);
    const [hx, hy, s, d] = hitRect(px, py, dx, dy, x, y, w, h);
    sp.push({ dx, dy, hx, hy, s, d, g: 1 + .3 * rng(), pts: F.map(f => { const r = d * f * (.85 + .3 * rng()); return [px + dx * r, py + dy * r]; }) });
  }
  const corner = s => s === 0 ? [x, y] : s === w ? [x + w, y] : s === w + h ? [x + w, y + h] : [x, y + h];
  const pieces = [{ pts: sp.map(s => s.pts[0]), ring: 0 }];
  for (let i = 0; i < n; i++) {
    const A = sp[i], B = sp[(i + 1) % n];
    for (let k = 1; k < K; k++) pieces.push({ pts: [A.pts[k - 1], B.pts[k - 1], B.pts[k], A.pts[k]], ring: k });
    let a = A.s, b = B.s; if (b <= a) b += P;   // 最外圈：沿周长把两条辐射线之间的角点补进来
    const cs = [];
    for (const c of [0, w, w + h, 2 * w + h]) { if (c > a && c < b) cs.push(c); if (c + P > a && c + P < b) cs.push(c + P); }
    cs.sort((u, v) => v - u);
    pieces.push({ pts: [A.pts[K - 1], B.pts[K - 1], [B.hx, B.hy], ...cs.map(c => corner(c % P)), [A.hx, A.hy]], ring: K });
  }
  for (const p of pieces) { p.v = .5 + .5 * rng(); p.rot = (rng() - .5) * 3; p.ph = rng() * TAU; p.dl = rng() * .04; }

  const tc = .12;
  ctx.lineJoin = ctx.lineCap = 'round'; ctx.lineWidth = 1;
  if (t < tc) {
    ctx.fillStyle = tile.color; ctx.fillRect(x, y, w, h);
    const g = outC(t / tc);
    ctx.strokeStyle = rgba(WH, .85); ctx.beginPath();
    for (const s of sp) { const r = s.d * Math.min(1, g * s.g); ctx.moveTo(px, py); ctx.lineTo(px + s.dx * r, py + s.dy * r); }
    ctx.stroke();
    for (let k = 0; k < K; k++) {
      const a = clamp01((g * 1.15 - F[k]) / .15); if (!a) continue;
      ctx.strokeStyle = rgba(WH, .7 * a); path(ctx, sp.map(s => s.pts[k])); ctx.stroke();
    }
    ctx.fillStyle = rgba(WH, .9 * (1 - t / tc)); ctx.beginPath(); ctx.arc(px, py, Math.min(w, h) * (.03 + .06 * g), 0, TAU); ctx.fill();
    return;
  }
  const G = .55 * h, S = .32 * Math.max(w, h), facet = clamp01((t - tc) / .1);
  for (const p of pieces) {
    const t0 = tc + p.ring * .045 + p.dl, tau = clamp01((t - t0) / (1 - t0));
    const [cx, cy] = centroid(p.pts), dd = dist(cx, cy, px, py) || 1, ux = (cx - px) / dd, uy = (cy - py) / dd;
    const fl = outC(tau) * S * p.v * (1.2 - .6 * p.ring / K), a = (1 - tau) ** 1.5, rot = p.rot * outQ(tau), sc = 1 - .15 * tau;
    ctx.save();
    ctx.translate(cx + ux * fl, cy + uy * fl + G * tau * tau); ctx.rotate(rot); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
    path(ctx, p.pts);
    const lit = Math.sin(p.ph + rot * 4) * facet;
    ctx.fillStyle = rgba(lit > 0 ? mix(base, .45 * lit * lit, WH) : mix(base, .22 * lit * lit, BK), .95 * a); ctx.fill();
    ctx.strokeStyle = rgba(WH, .45 * a); ctx.stroke();
    ctx.restore();
  }
}

// ② 冰裂：裂纹像冰面一样带霜慢慢蔓延、长出枝杈，蔓延到边后冰片一块块沉落
function ice(ctx, tile, t, rng) {
  const { x, y, w, h } = tile, base = hex(tile.color);
  const px = x + w * (.3 + .4 * rng()), py = y + h * (.3 + .4 * rng());
  const cols = Math.max(2, Math.round(w / 40)), rows = Math.max(2, Math.round(h / 40)), cw = w / cols, ch = h / rows, cell = Math.min(cw, ch);
  const N = [], HM = [], VM = [];   // 抖动网格节点 + 每条格边的中点（边界上的点只沿边界抖）
  for (let r = 0; r <= rows; r++) { N[r] = []; for (let c = 0; c <= cols; c++) {
    const bx = c === 0 || c === cols, by = r === 0 || r === rows;
    N[r][c] = [x + c * cw + (bx ? 0 : (rng() - .5) * .5 * cw), y + r * ch + (by ? 0 : (rng() - .5) * .5 * ch)];
  } }
  for (let r = 0; r <= rows; r++) { HM[r] = []; for (let c = 0; c < cols; c++) {
    const A = N[r][c], B = N[r][c + 1], bd = r === 0 || r === rows;
    HM[r][c] = [(A[0] + B[0]) / 2 + (rng() - .5) * .2 * cw, (A[1] + B[1]) / 2 + (bd ? 0 : (rng() - .5) * .35 * ch)];
  } }
  for (let r = 0; r < rows; r++) { VM[r] = []; for (let c = 0; c <= cols; c++) {
    const A = N[r][c], B = N[r + 1][c], bd = c === 0 || c === cols;
    VM[r][c] = [(A[0] + B[0]) / 2 + (bd ? 0 : (rng() - .5) * .35 * cw), (A[1] + B[1]) / 2 + (rng() - .5) * .2 * ch];
  } }
  const segs = [], br = [];
  const addEdge = (A, M, B, ang) => {
    segs.push([A, M], [M, B]);
    const a = ang + (rng() - .5) * 1.2, l = (.15 + .25 * rng()) * cell;
    br.push([M, [M[0] + Math.cos(a) * l, M[1] + Math.sin(a) * l]]);
  };
  for (let r = 1; r < rows; r++) for (let c = 0; c < cols; c++) addEdge(N[r][c], HM[r][c], N[r][c + 1], rng() < .5 ? -Math.PI / 2 : Math.PI / 2);
  for (let c = 1; c < cols; c++) for (let r = 0; r < rows; r++) addEdge(N[r][c], VM[r][c], N[r + 1][c], rng() < .5 ? 0 : Math.PI);
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const pts = [N[r][c], HM[r][c], N[r][c + 1], VM[r][c + 1], N[r + 1][c + 1], HM[r + 1][c], N[r + 1][c], VM[r][c]];
    const [cx, cy] = centroid(pts);
    cells.push({ pts, cx, cy, d: dist(cx, cy, px, py), dl: rng() * .06, rot: (rng() - .5) * .5, dr: rng() - .5 });
  }
  const dust = [];
  for (let i = 0; i < 20; i++) dust.push({ ox: x + rng() * w, oy: y + rng() * h, ts: .4 + rng() * .25, ph: rng() * TAU, r: .6 + rng() * 1.2 });

  const tA = .38, Dm = farCorner(px, py, x, y, w, h), R = outQ(Math.min(1, t / tA)) * Dm * 1.05;
  ctx.lineJoin = ctx.lineCap = 'round';
  const seg = (A, B) => {   // 从离冲击点近的一端向远端生长
    const da = dist(A[0], A[1], px, py), db = dist(B[0], B[1], px, py);
    const [nr, fr, dn, df] = da <= db ? [A, B, da, db] : [B, A, db, da];
    const k = clamp01((R - dn) / (df - dn + 1e-6)); if (!k) return;
    ctx.moveTo(nr[0], nr[1]); ctx.lineTo(nr[0] + (fr[0] - nr[0]) * k, nr[1] + (fr[1] - nr[1]) * k);
  };
  const bseg = (M, E) => {
    const k = clamp01((R - dist(M[0], M[1], px, py)) / (cell * .5)); if (!k) return;
    ctx.moveTo(M[0], M[1]); ctx.lineTo(M[0] + (E[0] - M[0]) * k, M[1] + (E[1] - M[1]) * k);
  };
  if (t < tA) {
    ctx.fillStyle = tile.color; ctx.fillRect(x, y, w, h);
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();   // 霜从冲击点晕开
    ctx.fillStyle = rgba(WH, .1); ctx.beginPath(); ctx.arc(px, py, R, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(WH, .08); ctx.beginPath(); ctx.arc(px, py, R * .55, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.beginPath();
    for (const [A, B] of segs) seg(A, B);
    for (const [M, E] of br) bseg(M, E);
    ctx.lineWidth = 4; ctx.strokeStyle = rgba(WH, .1); ctx.stroke();
    ctx.lineWidth = 1; ctx.strokeStyle = rgba(WH, .8); ctx.stroke();
    return;
  }
  const fb = clamp01(1 - (t - tA) / .15);   // 枝杈裂纹随崩落淡出
  if (fb) { ctx.beginPath(); for (const [M, E] of br) bseg(M, E); ctx.lineWidth = 1; ctx.strokeStyle = rgba(WH, .8 * fb); ctx.stroke(); }
  ctx.lineWidth = 1;
  for (const c of cells) { const t0 = tA + c.d / Dm * .18 + c.dl; c.tau = clamp01((t - t0) / (1 - t0)); }
  for (const c of [...cells.filter(c => !c.tau), ...cells.filter(c => c.tau)]) {   // 在落的画在前面
    const tau = c.tau, a = (1 - tau) ** 1.25;
    ctx.save();
    if (tau) { ctx.translate(c.cx + c.dr * .12 * w * tau, c.cy + .8 * h * tau * tau); ctx.rotate(c.rot * tau); ctx.translate(-c.cx, -c.cy); }
    path(ctx, c.pts);
    ctx.fillStyle = rgba(mix(base, .18 + .2 * tau, WH), .95 * a); ctx.fill();
    ctx.strokeStyle = rgba(WH, .6 * a); ctx.stroke();
    ctx.restore();
  }
  for (const d of dust) {
    const tp = clamp01((t - d.ts) / (1 - d.ts)); if (!tp) continue;
    ctx.fillStyle = rgba(WH, .8 * Math.sin(Math.PI * tp));
    ctx.beginPath(); ctx.arc(d.ox + Math.sin(tp * 5 + d.ph) * cell * .08, d.oy + .5 * h * tp * tp, d.r * cell / 40, 0, TAU); ctx.fill();
  }
}

// ③ 水晶棱柱：方块闪白后收缩消散，细长棱柱从中四散，棱面一亮一暗，伴随星点
function prism(ctx, tile, t, rng) {
  const { x, y, w, h } = tile, base = hex(tile.color), cx = x + w / 2, cy = y + h / 2, M = Math.max(w, h), m = Math.min(w, h);
  const n = Math.max(24, Math.min(60, Math.round(w * h / 500)));
  const sh = [];
  for (let i = 0; i < n; i++) {
    const ox = cx + (rng() - .5) * .8 * w, oy = cy + (rng() - .5) * .8 * h;
    const ang = Math.atan2(oy - cy, ox - cx) + (rng() - .5) * .8;
    const L = Math.max(6, (.1 + .2 * rng()) * m);
    sh.push({ ox, oy, ux: Math.cos(ang), uy: Math.sin(ang), v: (.35 + .65 * rng()) * .5 * M, L, Wd: L * (.22 + .16 * rng()), dl: .08 * rng(), spin: (rng() - .5) * 5, a0: ang + (rng() - .5) * .6, ph: rng() * TAU });
  }
  const sp = [];
  for (let i = 0; i < 36; i++) sp.push({ x: cx + (rng() - .5) * 1.15 * w, y: cy + (rng() - .5) * 1.15 * h, ts: .05 + .5 * rng(), s: (1.5 + 2.5 * rng()) * M / 160 });

  const tk = .3;
  if (t < tk) {   // 本体：闪白 → 缩小消散
    const k = t / tk, s = 1 - .2 * k * k;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
    ctx.fillStyle = rgba(mix(base, Math.max(0, 1 - t / .08) * .8, WH), (1 - k) ** 1.2); ctx.fillRect(x, y, w, h);
    ctx.restore();
  }
  const G = .35 * h;
  ctx.lineWidth = .8; ctx.lineJoin = 'round';
  for (const s of sh) {
    const tau = clamp01((t - s.dl) / (1 - s.dl)); if (!tau) continue;
    const a = (1 - tau) ** 1.3, f = outC(tau) * s.v, ang = s.a0 + s.spin * tau, sc = 1 - .3 * tau;
    const L = s.L, Wd = s.Wd, e = L * .22, g = Math.max(0, Math.sin(ang * 2 + s.ph)) ** 6;
    ctx.save(); ctx.translate(s.ox + s.ux * f, s.oy + s.uy * f + G * tau * tau); ctx.rotate(ang); ctx.scale(sc, sc);
    ctx.beginPath(); ctx.moveTo(-L / 2, 0); ctx.lineTo(-L / 2 + e, -Wd / 2); ctx.lineTo(L / 2 - e, -Wd / 2); ctx.lineTo(L / 2, 0); ctx.closePath();
    ctx.fillStyle = rgba(mix(base, .45 + .5 * g, WH), a); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-L / 2, 0); ctx.lineTo(L / 2, 0); ctx.lineTo(L / 2 - e, Wd / 2); ctx.lineTo(-L / 2 + e, Wd / 2); ctx.closePath();
    ctx.fillStyle = rgba(mix(base, .35, BK), a); ctx.fill();
    ctx.strokeStyle = rgba(WH, .7 * a); ctx.beginPath(); ctx.moveTo(-L / 2, 0); ctx.lineTo(L / 2, 0); ctx.stroke();
    ctx.restore();
  }
  for (const p of sp) {
    const k = clamp01((t - p.ts) / .22); if (!k || k === 1) continue;
    const a = Math.sin(Math.PI * k), s = p.s * (.6 + .4 * a), q = s * .28;
    ctx.fillStyle = rgba(WH, .9 * a);
    ctx.beginPath(); ctx.moveTo(p.x, p.y - s); ctx.lineTo(p.x + q, p.y - q); ctx.lineTo(p.x + s, p.y); ctx.lineTo(p.x + q, p.y + q);
    ctx.lineTo(p.x, p.y + s); ctx.lineTo(p.x - q, p.y + q); ctx.lineTo(p.x - s, p.y); ctx.lineTo(p.x - q, p.y - q); ctx.closePath(); ctx.fill();
  }
}

// ④ 薄玻璃：从点击点瞬间炸开，冲击波环扫过，上百片半透明小三角翻着飞，侧面对光时一闪
function thin(ctx, tile, t, rng) {
  const { x, y, w, h } = tile, base = hex(tile.color), M = Math.max(w, h);
  const px = x + w * (.25 + .5 * rng()), py = y + h * (.25 + .5 * rng());
  const cell = Math.max(12, Math.min(24, Math.min(w, h) / 7));
  const cols = Math.max(2, Math.round(w / cell)), rows = Math.max(2, Math.round(h / cell)), cw = w / cols, ch = h / rows;
  const N = [];
  for (let r = 0; r <= rows; r++) { N[r] = []; for (let c = 0; c <= cols; c++) {
    const bx = c === 0 || c === cols, by = r === 0 || r === rows;
    N[r][c] = [x + c * cw + (bx ? 0 : (rng() - .5) * .55 * cw), y + r * ch + (by ? 0 : (rng() - .5) * .55 * ch)];
  } }
  const tris = [], Dm = farCorner(px, py, x, y, w, h);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const a = N[r][c], b = N[r][c + 1], d = N[r + 1][c + 1], e = N[r + 1][c];
    for (const pts of (rng() < .5 ? [[a, b, d], [a, d, e]] : [[a, b, e], [b, d, e]])) {
      const [cx, cy] = centroid(pts);
      tris.push({ pts, cx, cy, dd: dist(cx, cy, px, py), ja: (rng() - .5) * 1.6, v: .08 + .92 * rng() ** 1.6, rot: (rng() - .5) * 4, w0: 3 + 5 * rng(), ph: rng() * TAU, dl: rng() * .03 });
    }
  }

  const G = .85 * h, S = .5 * M;
  ctx.lineWidth = .8; ctx.lineJoin = 'round';
  for (const q of tris) {
    const t0 = .03 + .1 * q.dd / Dm + q.dl, tau = clamp01((t - t0) / (1 - t0)), a = (1 - tau) ** 1.5;
    ctx.save();
    if (tau) {
      const dd = q.dd || 1, an = Math.atan2(q.cy - py, q.cx - px) + q.ja * (1 - q.dd / Dm), ux = Math.cos(an), uy = Math.sin(an), f = outC(tau) * S * q.v * (1.15 - .55 * q.dd / Dm), sc = 1 + .45 * tau * (1 - q.dd / Dm);
      let fl = Math.cos(q.ph + q.w0 * tau); if (Math.abs(fl) < .05) fl = fl < 0 ? -.05 : .05;   // 绕自身轴翻转，侧面时压成一条线
      ctx.translate(q.cx + ux * f, q.cy + uy * f + G * tau * tau); ctx.rotate(q.rot * tau); ctx.scale(sc, sc * fl); ctx.translate(-q.cx, -q.cy);
      const g = Math.max(0, Math.sin(q.ph * 1.7 + q.w0 * tau)) ** 12;
      path(ctx, q.pts);
      ctx.fillStyle = rgba(mix(base, g, WH), (.45 + .5 * g) * a); ctx.fill();
      ctx.strokeStyle = rgba(WH, .6 * a); ctx.stroke();
    } else {   // 还没脱离：按原色描边，拼起来就是完整方块
      path(ctx, q.pts); ctx.fillStyle = ctx.strokeStyle = tile.color; ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
  if (t < .3) {   // 冲击波环 + 点击闪光，限制在方块内
    const k = t / .3;
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.lineWidth = 1.5 - k; ctx.strokeStyle = rgba(WH, .5 * (1 - k) ** 2); ctx.beginPath(); ctx.arc(px, py, outC(k) * Dm * 1.1, 0, TAU); ctx.stroke();
    if (t < .1) { const r = Math.min(w, h) * (.05 + .1 * t / .1), g = ctx.createRadialGradient(px, py, 0, px, py, r); g.addColorStop(0, rgba(WH, .8 * (1 - t / .1))); g.addColorStop(1, rgba(WH, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

// ⑤ 冰凌：竖向锯齿裂缝从点击处向两侧蔓延，冰条从点击处起一根根弹起再坠落
function icicle(ctx, tile, t, rng) {
  const { x, y, w, h } = tile, base = hex(tile.color);
  const n = Math.max(4, Math.min(12, Math.round(w / 15))), m = Math.max(2, Math.min(6, Math.round(h / 45))), sw = w / n, sh = h / m;
  const ix = x + w * (.2 + .6 * rng());
  const lines = [];
  for (let j = 0; j <= n; j++) {
    const bd = j === 0 || j === n, pts = [];
    for (let k = 0; k <= m; k++) pts.push([x + j * sw + (bd ? 0 : (rng() - .5) * .6 * sw), y + k * sh + (bd || k === 0 || k === m ? 0 : (rng() - .5) * .6 * sh)]);
    lines.push(pts);
  }
  const strips = [];
  for (let j = 0; j < n; j++) {
    const cx = x + (j + .5) * sw, side = cx < ix ? -1 : 1;
    strips.push({ pts: [...lines[j], ...lines[j + 1].slice().reverse()], cx, cy: y + h / 2, side, dx: Math.abs(cx - ix), rot: side * (.1 + .25 * rng()), dl: rng() * .04, hx: cx - sw * .5 + (.35 + .3 * rng()) * sw });
  }

  const tc = .12, R = outQ(Math.min(1, t / tc)) * w;
  ctx.lineJoin = ctx.lineCap = 'round'; ctx.lineWidth = 1;
  if (t < tc) {
    ctx.fillStyle = tile.color; ctx.fillRect(x, y, w, h);
    for (let j = 1; j < n; j++) {
      const a = clamp01((R - Math.abs(x + j * sw - ix)) / (sw * 1.5)); if (!a) continue;
      const L = lines[j];
      ctx.strokeStyle = rgba(WH, .8 * a); ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]); for (let k = 1; k <= m; k++) ctx.lineTo(L[k][0], L[k][1]); ctx.stroke();
    }
    return;
  }
  const gr = ctx.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, rgba(mix(base, .4, WH), 1)); gr.addColorStop(1, rgba(mix(base, .08, BK), 1));
  for (const s of strips) {
    const t0 = tc + Math.min(1, s.dx / (w * .5)) * .3 + s.dl, tau = clamp01((t - t0) / (1 - t0));
    ctx.save();
    ctx.globalAlpha = (1 - tau) ** 1.6;
    if (tau) { ctx.translate(s.cx + s.side * .08 * w * tau, s.cy - .4 * h * tau + 1.05 * h * tau * tau); ctx.rotate(s.rot * tau); ctx.translate(-s.cx, -s.cy); }
    path(ctx, s.pts);
    ctx.fillStyle = gr; ctx.fill();
    ctx.strokeStyle = rgba(WH, tau ? .55 : .4); ctx.stroke();
    ctx.strokeStyle = rgba(WH, .22); ctx.beginPath(); ctx.moveTo(s.hx, y + h * .08); ctx.lineTo(s.hx, y + h * .7); ctx.stroke();   // 竖向高光
    ctx.restore();
  }
}

window.SHATTER = window.SHATTER || [];
window.SHATTER.push(
  { name: '碎玻璃', desc: '径向裂纹先铺开，再碎成不规则块，块面翻转时折射高光', draw: (ctx, tile, t, rng) => glass(ctx, tile, clamp01(t), rng) },
  { name: '冰裂', desc: '裂纹像冰面一样带霜慢慢蔓延，长出枝杈，蔓延到边后冰片一块块沉落', draw: (ctx, tile, t, rng) => ice(ctx, tile, clamp01(t), rng) },
  { name: '水晶棱柱', desc: '闪白后收缩消散，细长棱柱四散，棱面一亮一暗，伴随星点', draw: (ctx, tile, t, rng) => prism(ctx, tile, clamp01(t), rng) },
  { name: '薄玻璃', desc: '从点击点瞬间炸开，冲击波扫过，半透明小片翻着飞、侧面对光一闪', draw: (ctx, tile, t, rng) => thin(ctx, tile, clamp01(t), rng) },
  { name: '冰凌', desc: '竖向锯齿裂缝向两侧蔓延，冰条从点击处起一根根弹起坠落', draw: (ctx, tile, t, rng) => icicle(ctx, tile, clamp01(t), rng) },
);
})();

<script>
/* ── light.js：5 个 ── */
// 钢琴块碎裂特效 · 光 / 能量 / 数字化 · 5 个
// 契约：draw(ctx, tile, t, rng)，tile={x,y,w,h,color,seed}，t∈[0,1]，rng 每帧同序列，函数内不存状态。
(() => {
  const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  // k>0 向白混，k<0 向黑混
  const rgba = (c, a, k = 0) => {
    const f = k > 0 ? v => v + (255 - v) * k : v => v * (1 + k);
    return `rgba(${f(c[0]) | 0},${f(c[1]) | 0},${f(c[2]) | 0},${a < 0 ? 0 : a > 1 ? 1 : a})`;
  };
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const outQuad = x => 1 - (1 - x) * (1 - x);
  const outCubic = x => 1 - (1 - x) ** 3;
  const TAU = Math.PI * 2;
  // 起手一闪：0 → 峰值(0.06) → 0.22 熄
  const flash = t => t < 0.06 ? t / 0.06 : clamp01(1 - (t - 0.06) / 0.16);
  // 三层描线仿霓虹辉光（比 shadowBlur 便宜得多）
  const glowStroke = (ctx, c, a, lw) => {
    ctx.strokeStyle = rgba(c, a * 0.28); ctx.lineWidth = lw * 4; ctx.stroke();
    ctx.strokeStyle = rgba(c, a * 0.7, 0.35); ctx.lineWidth = lw * 1.4; ctx.stroke();
    ctx.strokeStyle = rgba(c, a, 0.95); ctx.lineWidth = lw * 0.6; ctx.stroke();
  };

  window.SHATTER = window.SHATTER || [];

  // 1 ─────────────────────────────────────────────── 溶解成光
  window.SHATTER.push({
    name: '溶解成光',
    desc: '溶解前沿自上而下扫过，方块化作光点缓缓上浮',
    draw(ctx, tile, t, rng) {
      const { x, y, w, h } = tile, c = hex(tile.color), s = Math.min(w, h) / 100;
      const N = 180, P = [];
      for (let i = 0; i < N; i++) P.push([rng(), rng(), rng(), rng(), rng(), rng()]);
      const F = tt => outQuad(clamp01(tt / 0.85)); // 前沿走过的高度比例
      const f = flash(t), top = y + F(t) * h;
      if (top < y + h) {
        ctx.fillStyle = rgba(c, 1 - t * t * 0.4, f * 0.6);
        ctx.fillRect(x, top, w, y + h - top);
        // 前沿亮边
        const gh = Math.min(22, h * 0.3, y + h - top);
        const g = ctx.createLinearGradient(0, top, 0, top + gh);
        g.addColorStop(0, rgba(c, 0.9 * (1 - t), 0.95));
        g.addColorStop(1, rgba(c, 0, 0.95));
        ctx.fillStyle = g;
        ctx.fillRect(x, top, w, gh);
      }
      ctx.globalCompositeOperation = 'lighter';
      for (const [u, v, sp, sz, wh, dr] of P) {
        const tb = u * 0.8; // 出生 = 前沿经过之时
        if (t < tb) continue;
        const age = (t - tb) / (1 - tb);
        const e = outCubic(age);
        const px = x + v * w + (dr - 0.5) * 14 * s * e;
        const py = y + F(tb) * h - (0.25 + sp * 0.75) * h * 0.45 * e;
        const a = (1 - age) ** 1.5;
        if (a < 0.02) continue;
        ctx.fillStyle = rgba(c, a, 0.15 + (0.3 + wh * 0.6) * (1 - age)); // 初生白热，渐冷回本色
        ctx.beginPath(); ctx.arc(px, py, (0.5 + sz * sz * 1.6) * s, 0, TAU); ctx.fill();
      }
    }
  });

  // 2 ─────────────────────────────────────────────── 像素熄灭
  window.SHATTER.push({
    name: '像素熄灭',
    desc: '方块像素化，格子按随机次序闪白后一个个熄灭',
    draw(ctx, tile, t, rng) {
      const { x, y, w, h } = tile, c = hex(tile.color);
      const cell = Math.max(8, Math.min(w, h) / 8);
      const cols = Math.max(3, Math.round(w / cell)), rows = Math.max(2, Math.round(h / cell));
      const cw = w / cols, ch = h / rows;
      const gap = Math.max(1, Math.min(cw, ch) * 0.14 * clamp01(t / 0.12)); // 间隙张开 = 像素化显形
      const f = flash(t);
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const r1 = rng(), r2 = rng();
        // 熄灭时刻：随机为主，略带由中心向外
        const d = Math.hypot((i + 0.5) / cols - 0.5, (j + 0.5) / rows - 0.5) * 1.4;
        const td = 0.1 + 0.68 * clamp01(0.75 * r1 + 0.25 * d);
        const age = (t - td) / 0.12;
        if (age >= 1) continue;
        let a = 1, k = f * 0.55, sc = 1;
        if (age > 0) {          // 闪白 → 缩小消失
          k = 1 - age * 0.4; a = 1 - age * age; sc = 1 - age * 0.6;
        } else if (age > -0.5) { // 临熄前先提亮预警
          k = Math.max(k, 0.5 * r2 * (age + 0.5) * 2);
        }
        const sw = (cw - gap) * sc, sh = (ch - gap) * sc;
        ctx.fillStyle = rgba(c, a, k);
        ctx.fillRect(x + i * cw + (cw - sw) / 2, y + j * ch + (ch - sh) / 2, sw, sh);
      }
    }
  });

  // 3 ─────────────────────────────────────────────── 扫描消散
  window.SHATTER.push({
    name: '扫描消散',
    desc: '一道扫描线自上而下掠过，扫过的行撕成光带向两侧散去',
    draw(ctx, tile, t, rng) {
      const { x, y, w, h } = tile, c = hex(tile.color), s = Math.min(w, h) / 100;
      const rowH = Math.max(3, h / 36), rows = Math.ceil(h / rowH);
      const R = [];
      for (let j = 0; j < rows; j++) R.push([rng(), rng(), rng()]);
      const N = 70, P = [];
      for (let i = 0; i < N; i++) P.push([rng(), rng(), rng(), rng()]);
      const F = tt => outQuad(clamp01(tt / 0.8)); // 扫描线进度
      const f = flash(t), ly = y + F(t) * h;
      // 下方完整本体
      if (ly < y + h) {
        ctx.fillStyle = rgba(c, 1, f * 0.6);
        ctx.fillRect(x, ly, w, y + h - ly);
      }
      // 上方各行：被扫过后横向撕开、变淡
      for (let j = 0; j < rows; j++) {
        const [r1, r2, r3] = R[j];
        const q = Math.min((j + 0.5) / rows, 0.999);
        const tp = 0.8 * (1 - Math.sqrt(1 - q)); // F(tp) = q
        if (t < tp) continue;
        const age = clamp01((t - tp) / Math.min(0.42, 1 - tp));
        if (age >= 1) continue;
        const e = outCubic(age), ry = y + j * rowH, rh = Math.max(1, rowH - 1);
        const split = w * (0.2 + r1 * 0.6), slide = e * w * (0.15 + r2 * 0.25), k = 1 - e * (0.5 + r3 * 0.3);
        ctx.fillStyle = rgba(c, (1 - age) ** 1.6, 0.35 + (1 - age) * 0.5);
        const lw = split * k, rw = (w - split) * k; // 两半各自缩短，裂口从撕开点张大
        ctx.fillRect(x + split - lw - slide, ry, lw, rh);
        ctx.fillRect(x + split + slide, ry, rw, rh);
      }
      // 扫描线 + 上沿光晕
      const la = 1 - t ** 3;
      const gh = Math.min(16, h * 0.25, ly - y);
      const g = ctx.createLinearGradient(0, ly - gh, 0, ly);
      g.addColorStop(0, rgba(c, 0, 0.8));
      g.addColorStop(1, rgba(c, 0.55 * la, 0.8));
      ctx.fillStyle = g;
      ctx.fillRect(x, ly - gh, w, gh);
      ctx.fillStyle = rgba(c, la, 1);
      ctx.fillRect(x, ly - 1, w, 2);
      // 扫过时溅起的小光粒
      ctx.globalCompositeOperation = 'lighter';
      for (const [u, v, sp, sz] of P) {
        const tb = u * 0.75;
        if (t < tb) continue;
        const age = (t - tb) / (1 - tb), e = outCubic(age);
        const a = (1 - age) ** 2;
        if (a < 0.02) continue;
        const px = x + v * w, py = y + F(tb) * h - (0.1 + sp * 0.3) * h * e;
        const r = (0.4 + sz * sz * 0.9) * s;
        ctx.fillStyle = rgba(c, a, 0.7);
        ctx.fillRect(px - r, py - r, r * 2, r * 2);
      }
    }
  });

  // 4 ─────────────────────────────────────────────── 霓虹裂开
  window.SHATTER.push({
    name: '霓虹裂开',
    desc: '本体暗下只剩霓虹描边，裂纹自点击处炸开，描边断成数截散逸熄灭',
    draw(ctx, tile, t, rng) {
      const { x, y, w, h } = tile, c = hex(tile.color), s = Math.min(w, h) / 100;
      const cx = x + w * (0.3 + rng() * 0.4), cy = y + h * (0.3 + rng() * 0.4);
      // 裂纹：6 条射线，各 3 折，末点落在边框上
      const NC = 6, cracks = [];
      for (let i = 0; i < NC; i++) {
        const th = ((i + 0.2 + rng() * 0.6) / NC) * TAU, dx = Math.cos(th), dy = Math.sin(th);
        // 射线到矩形边的距离
        const D = Math.min(dx > 0 ? (x + w - cx) / dx : dx < 0 ? (x - cx) / dx : 1e9,
                           dy > 0 ? (y + h - cy) / dy : dy < 0 ? (y - cy) / dy : 1e9);
        const pts = [[cx, cy]];
        for (let k = 1; k <= 3; k++) {
          const l = D * k / 3, jt = k < 3 ? (rng() - 0.5) * 0.18 * Math.min(w, h) : 0;
          pts.push([cx + dx * l - dy * jt, cy + dy * l + dx * jt]);
        }
        cracks.push(pts);
      }
      // 描边分段：沿周长的切点
      const NS = 10, per = 2 * (w + h), cuts = [];
      for (let i = 0; i < NS; i++) cuts.push(((i + rng() * 0.8) / NS) * per);
      const segs = [];
      for (let i = 0; i < NS; i++) segs.push([rng(), rng(), rng()]);

      const f = flash(t);
      // 本体：闪白后迅速暗下
      const ba = 1 - outQuad(clamp01(t / 0.35));
      if (ba > 0) { ctx.fillStyle = rgba(c, ba, f * 0.7); ctx.fillRect(x, y, w, h); }

      // 裂纹：0~0.3 长出，0.45 后熄
      const grow = outCubic(clamp01(t / 0.3)), ca = 1 - outQuad(clamp01((t - 0.45) / 0.45));
      if (ca > 0) {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        for (const pts of cracks) {
          const n = (pts.length - 1) * grow, full = Math.floor(n), fr = n - full;
          ctx.moveTo(pts[0][0], pts[0][1]);
          for (let k = 1; k <= full; k++) ctx.lineTo(pts[k][0], pts[k][1]);
          if (full < pts.length - 1) {
            const a = pts[full], b = pts[full + 1];
            ctx.lineTo(a[0] + (b[0] - a[0]) * fr, a[1] + (b[1] - a[1]) * fr);
          }
        }
        glowStroke(ctx, c, ca, (1.2 + f * 1.2) * s);
      }

      // 描边：0.3 前整圈，之后断成数截漂散熄灭
      const perim = d => { // 周长参数 → 点（顺时针，从左上角起）
        d = ((d % per) + per) % per;
        return d < w ? [x + d, y] : d < w + h ? [x + w, y + d - w]
             : d < 2 * w + h ? [x + w - (d - w - h), y + h] : [x, y + h - (d - 2 * w - h)];
      };
      const e = outQuad(clamp01((t - 0.3) / 0.7)), oa = 1 - e;
      if (oa <= 0) return;
      ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
      if (e === 0) {
        ctx.beginPath(); ctx.rect(x, y, w, h);
        glowStroke(ctx, c, 1, (1.5 + f * 1.5) * s);
        return;
      }
      const corners = [w, w + h, 2 * w + h];
      for (let i = 0; i < NS; i++) {
        const [dr, rt, sp] = segs[i];
        const d0 = cuts[i], d1 = i + 1 < NS ? cuts[i + 1] : cuts[0] + per;
        const pts = [perim(d0)];
        for (const cn of corners) { if (cn > d0 && cn < d1) pts.push(perim(cn)); if (cn + per > d0 && cn + per < d1) pts.push(perim(cn + per)); }
        pts.push(perim(d1));
        // 外法线（用中点相对中心的方向近似）+ 随机
        const m = perim((d0 + d1) / 2);
        let nx = m[0] - (x + w / 2), ny = m[1] - (y + h / 2);
        const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
        const dist = e * (6 + sp * 16) * s;
        ctx.save();
        ctx.translate(m[0] + (nx + (dr - 0.5) * 0.6) * dist, m[1] + (ny + (dr - 0.5) * 0.6) * dist);
        ctx.rotate((rt - 0.5) * 0.35 * e);
        ctx.translate(-m[0], -m[1]);
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
        glowStroke(ctx, c, oa * oa, 1.5 * s);
        ctx.restore();
      }
    }
  });

  // 5 ─────────────────────────────────────────────── 冲击光尘
  window.SHATTER.push({
    name: '冲击光尘',
    desc: '一圈冲击波从点击处荡开，波前扫过之处方块震成光尘四散',
    draw(ctx, tile, t, rng) {
      const { x, y, w, h } = tile, c = hex(tile.color), s = Math.min(w, h) / 100;
      const cx = x + w * (0.35 + rng() * 0.3), cy = y + h * (0.35 + rng() * 0.3);
      const R = Math.hypot(Math.max(cx - x, x + w - cx), Math.max(cy - y, y + h - cy)); // 到最远角
      const N = 230, P = [];
      for (let i = 0; i < N; i++) P.push([rng(), rng(), rng(), rng(), rng()]);
      const F = tt => outQuad(clamp01(tt / 0.7)); // 波进度
      const f = flash(t), pr = F(t), r = pr * R;
      // 震：起手抖一下
      const sh = f * 2.2 * s;
      ctx.translate(Math.sin(t * 190) * sh, Math.cos(t * 140) * sh * 0.6);

      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      // 本体：波内已成尘，只剩波外
      if (pr < 1) {
        ctx.beginPath(); ctx.rect(x, y, w, h); ctx.arc(cx, cy, r, 0, TAU, true);
        ctx.fillStyle = rgba(c, 1, f * 0.7);
        ctx.fill('evenodd');
      }
      // 波前：内侧拖一圈渐隐余晖 + 亮边
      const ra = (1 - pr) ** 0.5;
      if (ra > 0.01 && r > 0.5) {
        const gw = Math.min(r, (10 + f * 6) * s);
        const g = ctx.createRadialGradient(cx, cy, r - gw, cx, cy, r);
        g.addColorStop(0, rgba(c, 0, 0.5));
        g.addColorStop(1, rgba(c, 0.55 * ra, 0.5));
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
        ctx.fillStyle = g; ctx.fill();
        glowStroke(ctx, c, ra, (2 + f * 2) * s);
      }
      ctx.restore();

      // 光尘：波扫到即离体，径向飞散
      ctx.globalCompositeOperation = 'lighter';
      for (const [u, v, sp, sz, wh] of P) {
        const px = x + u * w, py = y + v * h;
        const d = Math.hypot(px - cx, py - cy) || 1;
        const tb = 0.7 * (1 - Math.sqrt(1 - Math.min(d / R, 0.999))); // F(tb) = d/R
        if (t < tb) continue;
        const age = (t - tb) / (1 - tb), e = outCubic(age);
        const a = (1 - age) ** 1.5;
        if (a < 0.02) continue;
        const dist = e * (0.08 + sp * 0.2) * Math.min(w, h) * (0.5 + 0.5 * d / R);
        const qx = px + (px - cx) / d * dist, qy = py + (py - cy) / d * dist;
        const r2 = (0.45 + sz * sz * 1.1) * s * (1 - age * 0.5);
        ctx.fillStyle = rgba(c, a, wh > 0.7 ? 0.9 : 0.3);
        ctx.fillRect(qx - r2, qy - r2, r2 * 2, r2 * 2);
      }
    }
  });
})();

    draw(ctx, tile, t, rng) {

      const ox = cx, oy = y + h * 0.35, unit = Math.min(w, h) / 120;

      for (let i = 0; i < 68; i++) {

        const t1 = (-vy + Math.sqrt(vy * vy + 2 * g * (floor - oy))) / g;   // 落回地面时刻

          ctx.globalAlpha = dropA;

        } else if (t - t1 < 0.2 && !small) {
          // 落地摊成一小片，很快没入地面
          ctx.setTransform(M); ctx.globalAlpha = dropA * (1 - (t - t1) / 0.2);
          ctx.beginPath(); ctx.ellipse(ox + vx * t1, floor - r * 0.3, r * 1.8, r * 0.45, 0, 0, TAU); ctx.fill();
        }
      }
      ctx.setTransform(M);
    }
  });

  // 5 积木塌落 ————————————————————————————————————————————————
  window.SHATTER.push({
    name: '积木塌落',
    desc: '一格格小方块从底层开始失去支撑，塌下来滚开、在地上滑一段停住',
    draw(ctx, tile, t, rng) {
      const { x, y, w, h, color } = tile;
      const s = clamp(Math.min(w, h) / 4, 10, 26);
      const cols = clamp(Math.round(w / s), 2, 8), rows = clamp(Math.round(h / s), 2, 12);
      const bw = w / cols, bh = h / rows, g = 18 * h;
      const light = shade(color, 0.35), dark = shade(color, -0.35);
      const fade = 1 - smooth(0.45, 1, t), M = ctx.getTransform();
      ctx.globalAlpha = fade;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const x0 = x + (c + 0.5) * bw, y0 = y + (r + 0.5) * bh;
        const side = (c + 0.5) / cols - 0.5;                            // -0.5..0.5，左负右正
        const bottom = r === rows - 1;
        const d = (rows - 1 - r) * 0.18 / rows + rng() * 0.06;          // 底层先塌、逐层往上
        const p = { x0, y0, floor: y + h - bh / 2 - (bottom ? 0 : rng() * bh * 0.8),   // 上层的落在别的块上，堆起来
          vx: (bottom ? Math.sign(side || 1) * (0.5 + 0.7 * rng()) : side * (1.2 + 1.5 * rng())) * w,
          vy: -(bottom ? 0.4 + 0.8 * rng() : 0.1 + 0.4 * rng()) * h, spin: 0 };
        p.spin = p.vx / w * 4 + (rng() - 0.5) * 3;
        const tau = t - d;
        const [px, py, ang] = tau > 0 ? rigid(p, g, 0.25, tau) : [x0, y0, 0];
        ctx.setTransform(M); ctx.translate(px, py); ctx.rotate(ang);
        ctx.fillStyle = color; ctx.fillRect(-bw / 2 + 0.5, -bh / 2 + 0.5, bw - 1, bh - 1);
        ctx.fillStyle = light; ctx.fillRect(-bw / 2 + 0.5, -bh / 2 + 0.5, bw - 1, bh * 0.2);               // 顶面受光
        ctx.fillStyle = dark; ctx.fillRect(-bw / 2 + 0.5, bh / 2 - 0.5 - bh * 0.14, bw - 1, bh * 0.14);   // 底面背光
      }
      ctx.setTransform(M);
    }
  });
})();

// 钢琴块碎裂特效 · 风格化 / 二次元音游味 · 5 款
// 契约：draw(ctx, tile, t, rng)  tile={x,y,w,h,color,seed}  t 0..1  rng 每帧按 seed 重置

  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a < 0 ? 0 : a > 1 ? 1 : a})`;
  const W = [255, 255, 255], K = [0, 0, 0], TAU = Math.PI * 2;
  const clamp = u => u < 0 ? 0 : u > 1 ? 1 : u;
  const outExpo = u => u <= 0 ? 0 : u >= 1 ? 1 : 1 - 2 ** (-10 * u);
  const outCubic = u => 1 - (1 - clamp(u)) ** 3;
  const inQuad = u => clamp(u) ** 2;
  const smooth = (a, b, v) => { const u = clamp((v - a) / (b - a)); return u * u * (3 - 2 * u); };

  // 四角星芒：相邻两尖之间用二次曲线，控制点拉向对侧 → 臂细如针
  const star4 = (ctx, cx, cy, lx, ly, rot, k = 0.25) => {
    const co = Math.cos(rot), si = Math.sin(rot);
    const P = (px, py) => [cx + px * co - py * si, cy + px * si + py * co];
    const T = [[0, -ly], [lx, 0], [0, ly], [-lx, 0]];
    let [ax, ay] = T[3];
    ctx.beginPath();
    ctx.moveTo(...P(ax, ay));
    for (const [bx, by] of T) {
      const [qx, qy] = P(-k * (ax + bx), -k * (ay + by));
      ctx.quadraticCurveTo(qx, qy, ...P(bx, by));
      ax = bx; ay = by;
    }
    ctx.fill();
  };

  // 樱花瓣：以原点为中心、尖端朝 -y、尖端带缺口
  const petal = (ctx, L) => {
    const wd = L * 0.62;
    ctx.beginPath();

    ctx.quadraticCurveTo(wd * 0.45, -L * 1.15, wd, -L * 0.45);
    ctx.quadraticCurveTo(wd * 0.95, L * 0.35, 0, L);
    ctx.quadraticCurveTo(-wd * 0.95, L * 0.35, -wd, -L * 0.45);
    ctx.quadraticCurveTo(-wd * 0.45, -L * 1.15, 0, -L * 0.7);
    ctx.fill();
  };

  window.SHATTER = window.SHATTER || [];
  window.SHATTER.push({
    name: '方粒四散',
    desc: 'Phigros 式：小方块四散缩小，两层方框撑开淡出',
    draw(ctx, tile, t, rng) {
      const { x, y, w, h } = tile, c = hex(tile.color);
      const cx = x + w / 2, cy = y + h / 2, m = Math.min(w, h), S = Math.sqrt(w * h);
      const lit = mix(c, W, 0.5);
      // 本体：白闪一下、微放大，0.04 内消失
      if (t < 0.04) {
        const u = t / 0.04, s = 1 + 0.06 * u;
        ctx.fillStyle = rgba(mix(c, W, 0.6), 1 - u);
        ctx.fillRect(cx - w * s / 2, cy - h * s / 2, w * s, h * s);
      }
      // 两层方框撑开：外层随方块长宽比，内层正方
      ctx.lineWidth = 1.5;
      for (let k = 0; k < 2; k++) {
        const u = clamp((t - k * 0.06) / (1 - k * 0.06)), e = outExpo(u);
        const fw = k ? m * (0.4 + 0.45 * e) : w * (0.5 + 0.65 * e), fh = k ? fw : h * (0.5 + 0.65 * e);
        ctx.strokeStyle = rgba(k ? c : lit, 0.9 * (1 - smooth(0.05, 0.6, u)));
        ctx.strokeRect(cx - fw / 2, cy - fh / 2, fw, fh);
      }
      // 方粒：沿贴着方块的椭圆随机方向冲出、边转边缩
      const e = outExpo(t), a = 1 - smooth(0.35, 1, t), rx = w / 2 + m * 0.4, ry = h / 2 + m * 0.4;
      for (let i = 0; i < 32; i++) {
        const ang = rng() * TAU, d = (0.3 + 0.7 * rng()) * e, s0 = S * (0.03 + 0.04 * rng());
        const rot = rng() * TAU + (rng() - 0.5) * 6 * t, tint = rng();
        const s = s0 * (1 - 0.75 * t) / 2;
        const px = cx + Math.cos(ang) * rx * d, py = cy + Math.sin(ang) * ry * d;
        const co = Math.cos(rot) * s, si = Math.sin(rot) * s;
        ctx.fillStyle = rgba(tint < 0.3 ? W : tint < 0.7 ? lit : c, a);
        ctx.beginPath();
        ctx.moveTo(px + co - si, py + si + co);
        ctx.lineTo(px - co - si, py - si + co);
        ctx.lineTo(px - co + si, py - si - co);
        ctx.lineTo(px + co + si, py + si - co);
        ctx.fill();
      }
    }
  });

  window.SHATTER.push({
    name: '樱瓣飘落',
    desc: '方块散成花瓣，旋着飘开、随风落下',
    draw(ctx, tile, t, rng) {
      const { x, y, w, h } = tile, c = hex(tile.color);
      const cx = x + w / 2, cy = y + h / 2, L = Math.sqrt(w * h) * 0.1, drop = Math.max(h, w * 0.6);
      // 本体：本色淡出（0.12 内）
      if (t < 0.12) {
        const u = t / 0.12;
        ctx.fillStyle = rgba(c, (1 - u) ** 1.3);
        ctx.fillRect(x, y, w, h);
      }
      for (let i = 0; i < 30; i++) {
        const px0 = x + w * rng(), py0 = y + h * rng();
        const ang = Math.atan2(py0 - cy, (px0 - cx) * 1.6) + (rng() - 0.5);
        const burst = w * (0.03 + 0.32 * rng()), spin = (rng() - 0.5) * 9, rot0 = rng() * TAU;
        const sway = rng() * TAU, fall = drop * (0.45 + 0.55 * rng()), tint = rng(), delay = rng() * 0.08;
        const tt = clamp((t - delay) / (1 - delay)), e = outExpo(tt);
        const px = px0 + Math.cos(ang) * burst * e + Math.sin(tt * 4 + sway) * w * 0.06 * tt;
        const py = py0 + Math.sin(ang) * burst * e * 0.5 + fall * tt * tt;
        ctx.fillStyle = rgba(mix(c, W, 0.1 + 0.55 * tint), smooth(0, 0.05, tt) * (1 - smooth(0.5, 1, tt)));
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(rot0 + spin * tt);
        petal(ctx, L * (0.7 + 0.6 * tint) * (1 - 0.3 * tt));
        ctx.restore();
      }
    }
  });

  window.SHATTER.push({
    name: '星芒聚散',
    desc: '方块收成一点，星芒炸开再收拢成一粒光',
    draw(ctx, tile, t, rng) {
      const { x, y, w, h } = tile, c = hex(tile.color);
      const cx = x + w / 2, cy = y + h / 2, m = Math.min(w, h), S = Math.sqrt(w * h);
      const lx = w * 0.25 + m * 0.15, ly = h * 0.4 + m * 0.2, ring = Math.min(lx, ly) * 1.6;
      const lit = mix(c, W, 0.6), fade = 1 - smooth(0.85, 1, t);
      ctx.lineWidth = 1;
      // 本体：0.12 内被吸成一点（ease-out，先快后慢）、微发白
      if (t < 0.12) {
        const u = t / 0.12, s = 1 - outCubic(u);
        ctx.fillStyle = rgba(mix(c, W, u * 0.5), 1);
        ctx.fillRect(cx - w * s / 2, cy - h * s / 2, w * s, h * s);
      }
      // 星芒：0~0.4 撑开，0.4~1 收拢
      const g = t < 0.4 ? outExpo(t / 0.4) : 1 - inQuad((t - 0.4) / 0.6);
      ctx.fillStyle = rgba(W, 0.95 * fade);
      star4(ctx, cx, cy, lx * g, ly * g, 0, 0.3);
      ctx.fillStyle = rgba(c, 0.8 * fade);
      star4(ctx, cx, cy, ring * 0.45 * g, ring * 0.45 * g, Math.PI / 4);
      // 光点：先冲出再回收
      for (let i = 0; i < 12; i++) {
        const ang = rng() * TAU, d = ring * (0.5 + 0.7 * rng()), r = S * (0.01 + 0.015 * rng());
        ctx.fillStyle = rgba(rng() < 0.5 ? W : lit, 0.9 * fade);
        ctx.beginPath();
        ctx.arc(cx + Math.cos(ang) * d * g, cy + Math.sin(ang) * d * g, r * (0.5 + 0.5 * g) + 0.3, 0, TAU);
        ctx.fill();
      }
      // 细环：0~0.5 扩散淡出
      if (t < 0.5) {
        const u = t / 0.5;
        ctx.strokeStyle = rgba(lit, 0.7 * (1 - u));
        ctx.beginPath();
        ctx.arc(cx, cy, ring * outExpo(u), 0, TAU);
        ctx.stroke();
      }
      // 核心光点：0.25 后浮现，0.6 最亮，1 消失
      const core = S * 0.04 * smooth(0.25, 0.55, t) * (1 - smooth(0.6, 1, t));
      if (core > 0.2) {
        ctx.fillStyle = rgba(W, 1);
        ctx.beginPath();
        ctx.arc(cx, cy, core, 0, TAU);
        ctx.fill();
      }
    }
  });

  window.SHATTER.push({
    name: '速度线',
    desc: '漫画集中线炸开，方块被压成一道细线闪没',
    draw(ctx, tile, t, rng) {
      const { x, y, w, h } = tile, c = hex(tile.color);
      const cx = x + w / 2, cy = y + h / 2, S = Math.sqrt(w * h);
      const lit = mix(c, W, 0.5);
      // 本体：0~0.3 竖向压扁、横向微胀；0.3~0.55 横向收拢淡出
      if (t < 0.55) {
        const u1 = smooth(0, 0.3, t), u2 = inQuad((t - 0.3) / 0.25);
        const bw = w * (1 + 0.2 * u1) * (1 - u2), bh = Math.max(h * (1 - 0.96 * u1), 2);
        ctx.fillStyle = rgba(mix(c, W, 0.2 + 0.8 * u1), 1 - u2);
        ctx.fillRect(cx - bw / 2, cy - bh / 2, bw, bh);
        if (t < 0.08) {
          ctx.fillStyle = rgba(W, 0.8 * (1 - t / 0.08));
          ctx.fillRect(cx - bw / 2, cy - bh / 2, bw, bh);
        }
      }
      // 集中线：从方块边缘外射出，尖端朝外；0.12 抽满，之后从根部退去
      const recede = smooth(0.25, 0.75, t), a = 0.9 * (1 - smooth(0.4, 0.8, t));
      for (let i = 0; i < 36; i++) {
        const ang = rng() * TAU, len = S * (0.15 + 0.32 * rng()), wd = 1 + 2 * rng();
        const gap = S * (0.04 + 0.12 * rng()), delay = rng() * 0.06, tint = rng();
        const dx = Math.cos(ang), dy = Math.sin(ang);
        const edge = Math.min(Math.abs(dx) > 1e-6 ? w / 2 / Math.abs(dx) : 1e9, Math.abs(dy) > 1e-6 ? h / 2 / Math.abs(dy) : 1e9);
        const r0 = edge + gap + len * recede, r1 = edge + gap + len * outExpo((t - delay) / 0.12);
        if (r1 <= r0) continue;
        const nx = -dy * wd / 2, ny = dx * wd / 2;
        ctx.fillStyle = rgba(tint < 0.4 ? W : lit, a);
        ctx.beginPath();
        ctx.moveTo(cx + dx * r0 + nx, cy + dy * r0 + ny);
        ctx.lineTo(cx + dx * r0 - nx, cy + dy * r0 - ny);
        ctx.lineTo(cx + dx * r1, cy + dy * r1);
        ctx.fill();
      }
    }
  });

  window.SHATTER.push({
    name: '切片错位',
    desc: '方块拆成横向细条，抖动错位后左右滑出',
    draw(ctx, tile, t, rng) {
      const { x, y, w, h } = tile, c = hex(tile.color);
      const n = Math.max(6, Math.min(16, Math.round(h / 12))), sh = h / n;
      const dark = mix(c, K, 0.35), lit = mix(c, W, 0.55);
      const frame = Math.floor(t * 36), fade = 1 - smooth(0.6, 1, t);
      for (let i = 0; i < n; i++) {
        const dir = rng() < 0.5 ? -1 : 1, delay = rng() * 0.25, dist = w * (0.35 + 0.55 * rng());
        const shade = rng(), jit = Math.floor(rng() * 97);
        const u = clamp((t - delay) / 0.45), e = outCubic(u);
        // 滑出前：按帧量化的左右抖动
        const jitter = u > 0 ? 0 : (((frame * 7 + i * 13 + jit) % 5) - 2) * w * 0.02;
        const hh = sh * (1 - 0.5 * e), oy = y + i * sh + (sh - hh) / 2;
        const ox = x + jitter + dir * dist * e, a = (1 - 0.85 * e) * fade;
        // 残影：拖在身后，速度越快越长
        const trail = dir * w * 0.12 * (1 - u) ** 2 * (u > 0 ? 1 : 0);
        if (trail) {
          ctx.fillStyle = rgba(lit, 0.5 * a);
          ctx.fillRect(ox - trail, oy, w, hh);
        }
        ctx.fillStyle = rgba(shade < 0.25 ? dark : c, a);
        ctx.fillRect(ox, oy, w, hh);
      }
      // 扫描线闪烁（0.2 内）
      if (t < 0.2) {
        ctx.fillStyle = rgba(W, 0.6 * (1 - t / 0.2));
        for (let k = 0; k < 2; k++) {
          const row = (frame * 31 + k * 17) % n;
          ctx.fillRect(x - w * 0.05, y + row * sh, w * 1.1, 1);
        }
      }
    }
  });
})();

</script>

<script>
"use strict";
// ── 宿主：把 window.SHATTER 里注册的特效各放进一个格子。契约见各模块头部注释 ──
const COLORS = {tick:'#FFC08A', slide:'#8AD4F5', trace:'#F5A8C8', swipe:'#9EE6A8'};
const LIFE = 600;                       // 一次碎裂播 0.6 秒（跟 App 的爆点同量级）
let color = COLORS.slide;
const list = (window.SHATTER || []).slice(0, 40);
const grid = document.getElementById('grid');
if (!list.length) document.getElementById('none').hidden = false;

// 确定性随机：mulberry32，按 seed 每帧重开
function rngOf(seed){ let a = (seed*4294967296)>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let favs = new Set(); try{ favs = new Set(JSON.parse(localStorage.getItem('shatter-favs')||'[]')); }catch(e){}
const cells = list.map((fx, i) => {
  const cell = document.createElement('div'); cell.className = 'cell' + (favs.has(fx.name)?' fav':'');
  cell.innerHTML = `<canvas></canvas><span class="idx">${String(i+1).padStart(2,'0')}</span><button class="star">★</button>
    <div class="cap"><div class="n">${fx.name}</div><div class="d">${fx.desc||''}</div></div>`;
  grid.appendChild(cell);
  const cv = cell.querySelector('canvas'), ctx = cv.getContext('2d');
  const st = {fx, cv, ctx, at:-1, seed:Math.random(), cell};
  cv.addEventListener('pointerdown', () => { st.at = performance.now(); st.seed = Math.random(); });
  cell.querySelector('.star').addEventListener('click', e => { e.stopPropagation();
    if (favs.has(fx.name)) favs.delete(fx.name); else favs.add(fx.name);
    cell.classList.toggle('fav', favs.has(fx.name));
    try{ localStorage.setItem('shatter-favs', JSON.stringify([...favs])); }catch(err){} });
  return st;
});

function sizeAll(){
  const dpr = Math.min(devicePixelRatio||1, 2.5);
  for (const c of cells){ const w = c.cv.clientWidth, h = c.cv.clientHeight;
    if (c.cv.width !== Math.round(w*dpr)){ c.cv.width = Math.round(w*dpr); c.cv.height = Math.round(h*dpr); }
    c.ctx.setTransform(dpr,0,0,dpr,0,0); }
}
addEventListener('resize', sizeAll); sizeAll();

function tileRect(c){
  const W = c.cv.clientWidth, H = c.cv.clientHeight;
  const w = Math.round(W*0.42), h = Math.round(H*0.42);
  return {x: Math.round((W-w)/2), y: Math.round(H*0.22), w, h, color, seed:c.seed};
}
function drawTile(ctx, r){
  // 完整的块：跟 App 里 slide 长按体一个语言 —— 半透明色身 + 白细边 + 顶部高光
  ctx.fillStyle = r.color + 'cc'; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.2; ctx.strokeRect(r.x+.5, r.y+.5, r.w-1, r.h-1);
  const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h*0.5);
  g.addColorStop(0,'rgba(255,255,255,.35)'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(r.x, r.y, r.w, r.h*0.5);
}
function frame(now){
  for (const c of cells){
    const {ctx, cv} = c, W = cv.clientWidth, H = cv.clientHeight;
    ctx.clearRect(0,0,W,H);
    const r = tileRect(c);
    const t = c.at < 0 ? -1 : (now - c.at)/LIFE;
    if (t < 0 || t > 1.05){ drawTile(ctx, r); continue; }
    ctx.save();
    try { c.fx.draw(ctx, r, Math.min(1, t), rngOf(c.seed)); }
    catch (e) { ctx.restore(); ctx.save(); ctx.fillStyle='#E5484D'; ctx.font='11px system-ui'; ctx.fillText('出错：'+(e.message||e).slice(0,40), 8, 16); }
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 颜色切换：四种音块的颜色
const colorsBox = document.getElementById('colors');
Object.entries(COLORS).forEach(([k,v]) => {
  const b = document.createElement('button'); b.textContent = k; b.style.borderColor = v + '88'; b.classList.toggle('on', v===color);
  b.onclick = () => { color = v; [...colorsBox.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
  colorsBox.appendChild(b);
});
document.getElementById('playall').onclick = () => cells.forEach((c,i) => setTimeout(() => { c.at = performance.now(); c.seed = Math.random(); }, i*90));
document.getElementById('copy').onclick = async () => {
  const txt = '碎裂收藏：' + ([...favs].length ? [...favs].join('、') : '（还没收藏）');
  try{ await navigator.clipboard.writeText(txt); document.getElementById('copy').textContent = '复制好了'; }
  catch(e){ alert(txt); }
};
</script>
</body>
