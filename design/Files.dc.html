<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin:0; font-family:'Space Grotesk', system-ui, sans-serif; }
    a { color:#e08b57; } a:hover { color:#f0a473; }
    * { box-sizing:border-box; }
    .f { display:flex; align-items:center; gap:11px; height:52px; padding:0 13px; border-radius:10px; }
    .fn { font-size:14px; font-weight:500; flex-grow:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .fm { font-size:11px; color:#6d665f; font-family:'JetBrains Mono', monospace; flex-shrink:0; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#1a1917; color:#ece8e3; display:flex; flex-direction:column; overflow:hidden;">

  <div style="display:flex; align-items:center; gap:12px; padding:10px 14px; background:#232120; border-bottom:1px solid #39352f; flex-shrink:0;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9b938a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="flex-grow:1; min-width:0;">
      <div style="font-size:15px; font-weight:600; letter-spacing:-0.01em;">cc-Yxi</div>
    </div>
    <div style="display:flex; background:#1a1917; border:1px solid #39352f; border-radius:9px; padding:2px;">
      <div style="padding:11px 11px; font-size:12px; font-weight:500; color:#9b938a; border-radius:7px;">终端</div>
      <div style="padding:11px 11px; font-size:12px; font-weight:500; color:#9b938a; border-radius:7px;">对话</div>
      <div style="padding:11px 11px; font-size:12px; font-weight:600; color:#1a1917; background:#e08b57; border-radius:7px;">文件</div>
    </div>
  </div>

  <!-- breadcrumb -->
  <div style="display:flex; align-items:center; gap:6px; padding:11px 14px; background:#1e1c1a; border-bottom:1px solid #2f2b27; flex-shrink:0; font-family:'JetBrains Mono', monospace; font-size:11.5px; overflow:hidden;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6d665f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    <span style="color:#6d665f;">root / src / workspace /</span>
    <span style="color:#e08b57; font-weight:500;">Yxi</span>
  </div>

  <div style="flex-grow:1; padding:8px 10px; display:flex; flex-direction:column; gap:2px; overflow:hidden;">

    <div class="f" style="background:#232120; border:1px solid #39352f;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9b938a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      <div class="fn">design</div>
      <div class="fm">9 项</div>
    </div>

    <div class="f" style="background:#232120; border:1px solid #39352f;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9b938a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      <div class="fn">server</div>
      <div class="fm">5 项</div>
    </div>

    <div style="height:6px;"></div>

    <div class="f" style="background:#2b2826; border:1px solid #4a443d;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#e08b57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>
      <div class="fn">PRD.md</div>
      <div class="fm">48 KB</div>
    </div>

    <div class="f">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#e08b57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>
      <div class="fn">PLAN.md</div>
      <div class="fm">16 KB</div>
    </div>

    <div class="f">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#e08b57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>
      <div class="fn">handover.md</div>
      <div class="fm">6 KB</div>
    </div>

    <div class="f">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#d5a244" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M6 3v12a3 3 0 003 3h1M18 21V9a3 3 0 00-3-3h-1"/><path d="M9 6L6 3 3 6M15 18l3 3 3-3"/></svg>
      <div class="fn">canvas.json</div>
      <div class="fm">3 KB</div>
    </div>

    <div class="f">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#35b1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <div class="fn">arch.png</div>
      <div class="fm">142 KB</div>
    </div>

    <div class="f">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6d665f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
      <div class="fn" style="color:#c9c2ba;">yxi-agent</div>
      <div class="fm">11 KB</div>
    </div>

    <div class="f">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6d665f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
      <div class="fn" style="color:#9b938a;">app-debug.apk</div>
      <div class="fm">18 MB</div>
    </div>

  </div>

  <!-- SFTP hint -->
  <div style="flex-shrink:0; padding:11px 14px 15px; border-top:1px solid #2f2b27; background:#1e1c1a; display:flex; align-items:center; gap:9px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#35b1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <div style="font-size:11px; color:#6d665f; font-family:'JetBrains Mono', monospace; flex-grow:1;">SFTP · 只读 · 不需要 yxi-agent</div>
  </div>

</div>
</x-dc>
</body>
</html>
