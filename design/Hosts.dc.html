<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin:0; font-family:'Space Grotesk', system-ui, sans-serif; }
    a { color:#ffb787; } a:hover { color:#ffd0ad; }
    * { box-sizing:border-box; }
    .row { display:flex; align-items:center; gap:12px; padding:13px 13px; border-radius:22px; background:#1e1b17; }
    .dot { width:8px; height:8px; border-radius:4px; flex-shrink:0; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#16130f; color:#ebe1d9; display:flex; flex-direction:column; overflow:hidden;">

  <div style="padding:16px 16px 13px; background:#1e1b17; border-bottom:1px solid #2d2925; flex-shrink:0; display:flex; align-items:center; gap:10px;">
    <div style="font-size:21px; font-weight:700; letter-spacing:-0.02em; flex-grow:1;">主机</div>
    <div style="width:34px; height:34px; border-radius:16px; display:flex; align-items:center; justify-content:center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffb787" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  </div>

  <div style="flex-grow:1; display:flex; flex-direction:column; gap:9px; padding:14px 14px; overflow:hidden;">

    <div class="row" style="border-color:#383430;">
      <div class="dot" style="background:#8fd8c6;"></div>
      <div style="flex-grow:1; min-width:0;">
        <div style="font-size:15px; font-weight:600; letter-spacing:-0.01em;">ser8651</div>
        <div style="font-size:11.5px; color:#8a7d72; font-family:'JetBrains Mono', monospace; margin-top:2px;">root@216.36.·.· · 14 会话</div>
      </div>
      <div style="display:flex; align-items:center; gap:5px; height:24px; padding:0 9px; border-radius:6px; background:#1f3b2c;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#9ce0a8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <div style="font-size:11px; font-weight:600; color:#9ce0a8; font-family:'JetBrains Mono', monospace;">agent</div>
      </div>
    </div>

    <div class="row">
      <div class="dot" style="background:#8fd8c6;"></div>
      <div style="flex-grow:1; min-width:0;">
        <div style="font-size:15px; font-weight:600; letter-spacing:-0.01em;">station</div>
        <div style="font-size:11.5px; color:#8a7d72; font-family:'JetBrains Mono', monospace; margin-top:2px;">root@38.244.·.· · 仅终端</div>
      </div>
      <div style="font-size:11px; color:#8a7d72; font-family:'JetBrains Mono', monospace; border-radius:6px; padding:4px 9px;">装 agent</div>
    </div>

    <div class="row">
      <div class="dot" style="background:#383430;"></div>
      <div style="flex-grow:1; min-width:0;">
        <div style="font-size:15px; font-weight:600; letter-spacing:-0.01em; color:#a89b8f;">inst2</div>
        <div style="font-size:11.5px; color:#8a7d72; font-family:'JetBrains Mono', monospace; margin-top:2px;">root@192.220.·.· · 未连接</div>
      </div>
    </div>

    <div class="row">
      <div class="dot" style="background:#383430;"></div>
      <div style="flex-grow:1; min-width:0;">
        <div style="font-size:15px; font-weight:600; letter-spacing:-0.01em; color:#a89b8f;">han</div>
        <div style="font-size:11.5px; color:#8a7d72; font-family:'JetBrains Mono', monospace; margin-top:2px;">14157@100.80.·.·<span style="color:#ffc46b;">:2222</span></div>
      </div>
    </div>

    <!-- add host -->
    <div style="margin-top:8px; border:1px dashed #383430; border-radius:28px; padding:16px 14px; display:flex; flex-direction:column; gap:12px;">
      <div style="font-size:12px; font-weight:600; color:#a89b8f; letter-spacing:0.04em;">加新主机</div>
      <div style="display:flex; gap:8px;">
        <div style="flex-grow:1; height:44px; border-radius:18px; background:#16130f; display:flex; align-items:center; padding:0 12px; font-size:13.5px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">主机名 / IP</div>
        <div style="width:82px; height:44px; border-radius:18px; background:#16130f; display:flex; align-items:center; padding:0 12px; font-size:13.5px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">22</div>
      </div>
      <div style="height:44px; border-radius:18px; background:#16130f; display:flex; align-items:center; padding:0 12px; font-size:13.5px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">用户名</div>
      <div style="display:flex; background:#16130f; border-radius:18px; padding:3px;">
        <div style="flex-grow:1; height:42px; border-radius:14px; background:#ffb787; color:#4d2600; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center;">密钥</div>
        <div style="flex-grow:1; height:42px; border-radius:14px; font-size:13px; font-weight:500; color:#a89b8f; display:flex; align-items:center; justify-content:center;">密码</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px; padding:10px 12px; background:#1f3b2c; border-radius:18px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ce0a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <div style="font-size:11.5px; line-height:1.45; color:#9ce0a8; flex-grow:1;">密码连上后可一键装公钥，之后免密</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
