<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin:0; font-family:'Space Grotesk', system-ui, sans-serif; }
    a { color:#e08b57; } a:hover { color:#f0a473; }
    * { box-sizing:border-box; }
    .row { display:flex; align-items:center; gap:12px; padding:13px 13px; border:1px solid #39352f; border-radius:12px; background:#232120; }
    .dot { width:8px; height:8px; border-radius:4px; flex-shrink:0; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#1a1917; color:#ece8e3; display:flex; flex-direction:column; overflow:hidden;">

  <div style="padding:16px 16px 13px; background:#232120; border-bottom:1px solid #39352f; flex-shrink:0; display:flex; align-items:center; gap:10px;">
    <div style="font-size:21px; font-weight:700; letter-spacing:-0.02em; flex-grow:1;">主机</div>
    <div style="width:34px; height:34px; border-radius:9px; border:1px solid #4a443d; display:flex; align-items:center; justify-content:center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e08b57" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  </div>

  <div style="flex-grow:1; display:flex; flex-direction:column; gap:9px; padding:14px 14px; overflow:hidden;">

    <div class="row" style="border-color:#4a443d;">
      <div class="dot" style="background:#35b1a1;"></div>
      <div style="flex-grow:1; min-width:0;">
        <div style="font-size:15px; font-weight:600; letter-spacing:-0.01em;">ser8651</div>
        <div style="font-size:11.5px; color:#6d665f; font-family:'JetBrains Mono', monospace; margin-top:2px;">root@216.36.·.· · 14 会话</div>
      </div>
      <div style="display:flex; align-items:center; gap:5px; height:24px; padding:0 9px; border-radius:6px; background:#22322a; border:1px solid #2f4a3a;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8fc47a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <div style="font-size:11px; font-weight:600; color:#8fc47a; font-family:'JetBrains Mono', monospace;">agent</div>
      </div>
    </div>

    <div class="row">
      <div class="dot" style="background:#35b1a1;"></div>
      <div style="flex-grow:1; min-width:0;">
        <div style="font-size:15px; font-weight:600; letter-spacing:-0.01em;">station</div>
        <div style="font-size:11.5px; color:#6d665f; font-family:'JetBrains Mono', monospace; margin-top:2px;">root@38.244.·.· · 仅终端</div>
      </div>
      <div style="font-size:11px; color:#6d665f; font-family:'JetBrains Mono', monospace; border:1px solid #39352f; border-radius:6px; padding:4px 9px;">装 agent</div>
    </div>

    <div class="row">
      <div class="dot" style="background:#4a443d;"></div>
      <div style="flex-grow:1; min-width:0;">
        <div style="font-size:15px; font-weight:600; letter-spacing:-0.01em; color:#9b938a;">inst2</div>
        <div style="font-size:11.5px; color:#6d665f; font-family:'JetBrains Mono', monospace; margin-top:2px;">root@192.220.·.· · 未连接</div>
      </div>
    </div>

    <div class="row">
      <div class="dot" style="background:#4a443d;"></div>
      <div style="flex-grow:1; min-width:0;">
        <div style="font-size:15px; font-weight:600; letter-spacing:-0.01em; color:#9b938a;">han</div>
        <div style="font-size:11.5px; color:#6d665f; font-family:'JetBrains Mono', monospace; margin-top:2px;">14157@100.80.·.·<span style="color:#d5a244;">:2222</span></div>
      </div>
    </div>

    <!-- add host -->
    <div style="margin-top:8px; border:1px dashed #4a443d; border-radius:14px; padding:16px 14px; display:flex; flex-direction:column; gap:12px;">
      <div style="font-size:12px; font-weight:600; color:#9b938a; letter-spacing:0.04em;">加新主机</div>
      <div style="display:flex; gap:8px;">
        <div style="flex-grow:1; height:44px; border:1px solid #39352f; border-radius:10px; background:#1a1917; display:flex; align-items:center; padding:0 12px; font-size:13.5px; color:#6d665f; font-family:'JetBrains Mono', monospace;">主机名 / IP</div>
        <div style="width:82px; height:44px; border:1px solid #39352f; border-radius:10px; background:#1a1917; display:flex; align-items:center; padding:0 12px; font-size:13.5px; color:#6d665f; font-family:'JetBrains Mono', monospace;">22</div>
      </div>
      <div style="height:44px; border:1px solid #39352f; border-radius:10px; background:#1a1917; display:flex; align-items:center; padding:0 12px; font-size:13.5px; color:#6d665f; font-family:'JetBrains Mono', monospace;">用户名</div>
      <div style="display:flex; background:#1a1917; border:1px solid #39352f; border-radius:10px; padding:3px;">
        <div style="flex-grow:1; height:42px; border-radius:8px; background:#e08b57; color:#1a1917; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center;">密钥</div>
        <div style="flex-grow:1; height:42px; border-radius:8px; font-size:13px; font-weight:500; color:#9b938a; display:flex; align-items:center; justify-content:center;">密码</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px; padding:10px 12px; background:#22322a; border:1px solid #2f4a3a; border-radius:10px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8fc47a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <div style="font-size:11.5px; line-height:1.45; color:#8fc47a; flex-grow:1;">密码连上后可一键装公钥，之后免密</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
