var BLUE = [158, 200, 240], DARK = [17, 17, 17];   // #9EC8F0 -> #111
var SP = 9;            // 点阵间距 (CSS px)
var STEPS = 32;        // 颜色渐变阶数（雪碧图格数）
var COVER = 0.22;      // 格点算“在字上”的最低覆盖率
var TOTAL = 2200, HOLD = 2000;

var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var img = new Image(), IW, IH, alpha;
var W, H, dpr, N, px, py, ins, del, strip, S, K, lx, ly, lw, lh, t0, held;

function ss(u) { u = u < 0 ? 0 : u > 1 ? 1 : u; return u * u * (3 - 2 * u); }

function setup() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingQuality = 'high';

  // logo 显示矩形：宽 58%，水平居中，中心在 45% 屏高
  lw = W * 0.58; lh = lw * IH / IW; lx = (W - lw) / 2; ly = H * 0.45 - lh / 2;

  // 等距点阵，整体居中
  var nx = Math.floor(W / SP) + 1, ny = Math.floor(H / SP) + 1;
  var ox = (W - (nx - 1) * SP) / 2, oy = (H - (ny - 1) * SP) / 2;
  N = nx * ny;
  px = new Float32Array(N); py = new Float32Array(N);
  ins = new Uint8Array(N); del = new Float32Array(N);
  var i = 0, j, k;
  for (j = 0; j < ny; j++) for (k = 0; k < nx; k++, i++) { px[i] = ox + k * SP; py[i] = oy + j * SP; }

  // 每个格点对应一个 SP×SP 的格子；数 logo 不透明像素落进各格子的数量 => 覆盖率
  var cov = new Uint16Array(N), sx = lw / IW, sy = lh / IH, u, v;
  for (v = 0; v < IH; v++) for (u = 0; u < IW; u++) {
    if (alpha[(v * IW + u) * 4 + 3] <= 128) continue;
    k = Math.round((lx + (u + 0.5) * sx - ox) / SP); j = Math.round((ly + (v + 0.5) * sy - oy) / SP);
    if (k >= 0 && k < nx && j >= 0 && j < ny) cov[j * nx + k]++;
  }
  var need = COVER * (SP / sx) * (SP / sy);
  for (i = 0; i < N; i++) if (cov[i] >= need) { ins[i] = 1; del[i] = (px[i] - lx) / lw; }

  // 圆点雪碧图：一条 STEPS+1 格的色带，格 0 = 淡蓝，格 STEPS = 近黑
  S = Math.ceil(4.8 * dpr) + 2; K = S / (S - 2);
  strip = document.createElement('canvas'); strip.width = S * (STEPS + 1); strip.height = S;
  var sc = strip.getContext('2d'), s, f;
  for (s = 0; s <= STEPS; s++) {
    f = s / STEPS;
    sc.fillStyle = 'rgb(' + Math.round(BLUE[0] + (DARK[0] - BLUE[0]) * f) + ',' +
      Math.round(BLUE[1] + (DARK[1] - BLUE[1]) * f) + ',' + Math.round(BLUE[2] + (DARK[2] - BLUE[2]) * f) + ')';
    sc.beginPath(); sc.arc(s * S + S / 2, S / 2, S / 2 - 1, 0, Math.PI * 2); sc.fill();
  }
  restart();
}

function restart() { t0 = performance.now(); held = false; }

function draw(t) {
  if (t < 0) t = 0;
  ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  var fade = t < 250 ? t / 250 : 1;            // 开头点阵淡入
  var pB = ss((t - 900) / 700);                // 字外的波平息
  var pC = ss((t - 1600) / 400);               // 字外淡出 + logo 淡入
  var pD = ss((t - 2000) / 200);               // 字内点在 logo 下面收掉
  var wt = t * 0.004, i, x, y, s, p, r, a, cell, d;
  for (i = 0; i < N; i++) {
    x = px[i]; y = py[i];
    s = 0.5 + 0.5 * Math.sin(x * 0.03 + (H - y) * 0.02 - wt);   // 左下 -> 右上 行进波
    if (ins[i]) {
      p = ss((t - 900 - del[i] * 300) / 400);  // 自左向右依次变黑变大
      r = (0.8 + 1.4 * s) * (1 - p) + 2.4 * p;
      a = ((0.25 + 0.55 * s) * (1 - p) + p) * fade * (1 - pD);
      cell = Math.round(p * STEPS);
    } else {
      r = (0.8 + 1.4 * s) * (1 - pB) + 0.8 * pB;
      a = ((0.25 + 0.55 * s) * (1 - pB) + 0.12 * pB) * fade * (1 - pC);
      cell = 0;
    }
    if (a < 0.004) continue;
    d = r * K;
    ctx.globalAlpha = a;
    ctx.drawImage(strip, cell * S, 0, S, S, x - d, y - d, d * 2, d * 2);
  }
  if (pC > 0) { ctx.globalAlpha = pC; ctx.drawImage(img, lx, ly, lw, lh); }
}

function loop(now) {
  var t = now - t0;
  if (t < TOTAL) draw(t);
  else {
    if (!held) { draw(TOTAL); held = true; }
    if (t >= TOTAL + HOLD) restart();
  }
  requestAnimationFrame(loop);
}

img.onload = function () {
  IW = img.naturalWidth; IH = img.naturalHeight;
  var oc = document.createElement('canvas'); oc.width = IW; oc.height = IH;
  var octx = oc.getContext('2d'); octx.drawImage(img, 0, 0);
  alpha = octx.getImageData(0, 0, IW, IH).data;   // 同文档 data: 图，不会污染画布
  setup();
  window.addEventListener('resize', setup);
  window.addEventListener('pointerdown', restart);
  requestAnimationFrame(loop);
};
img.src = LOGO;
})();
