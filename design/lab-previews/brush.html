<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开屏方案：笔触书写</title>
<style>
/* 笔触书写：毛笔从左往右把「Yunxi」写出来，前沿像墨在渗，字底下一团淡蓝水光跟着笔尖走，写完 1.03→1.0 落定。
   时序与 Kotlin 版（SplashBrush.kt）一致：0~1100 揭开 / 1100~1500 落定 / 1500~1900 停住；再停 2 秒重播。
   一轮 = 3900ms，关键帧百分比 = 毫秒 / 3900：1100 → 28.2051%，1500 → 38.4615%。 */
@property --x { syntax: '<percentage>'; inherits: false; initial-value: 0%; }   /* 注册成数值，蒙版才能被动画插值 */
html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #FFFFFF; }
/* 舞台只占上面 90% 高再垂直居中 → 字的中心正好落在 45% 高度处 */
#stage { position: absolute; left: 0; top: 0; width: 100%; height: 90%; display: flex; align-items: center; justify-content: center; }
#word  { position: relative; width: 58%; animation: settle 3900ms infinite; }
#word img {
  display: block; width: 100%; height: auto; position: relative;
  /* 揭开 + 柔前沿一步做完：横向 alpha 蒙版，左边不透明、前沿处透明，柔边宽 = 字宽的一成；
     --x 从 0% 走到 110%，多走一成让柔边完全出画，末笔不发虚 */
  -webkit-mask-image: linear-gradient(to right, #000 calc(var(--x) - 10%), transparent var(--x));
          mask-image: linear-gradient(to right, #000 calc(var(--x) - 10%), transparent var(--x));
  animation: reveal 3900ms infinite;
}
/* 光晕：直径 = 字宽的九成（半径 0.45w），径向渐变到边缘透明；DOM 里排在 img 前面 → 垫在字底下 */
#glow {
  position: absolute; top: 50%; left: 25%; width: 90%; aspect-ratio: 1; border-radius: 50%;
  transform: translate(-50%, -50%); opacity: 0;
  background: radial-gradient(circle closest-side, rgba(158,200,240,1), rgba(158,200,240,0));
  animation: glowMove 3900ms infinite, glowFade 3900ms infinite;
}
#hint { position: absolute; left: 0; right: 0; bottom: 12px; margin: 0; text-align: center; font: 12px system-ui, sans-serif; color: #9E9E9E; }

@keyframes reveal {
  0%             { --x: 0%;   animation-timing-function: cubic-bezier(.4, 0, .2, 1); }   /* FastOutSlowIn */
  28.2051%, 100% { --x: 110%; }
}
@keyframes settle {
  0%, 28.2051%   { transform: scale(1.03); animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
  38.4615%, 100% { transform: scale(1); }
}
@keyframes glowMove {   /* 团心跟着笔尖从 25% 走到 75%：轻轻移动，不是从头扫到尾 */
  0%             { left: 25%; animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
  28.2051%, 100% { left: 75%; }
}
@keyframes glowFade {   /* 起笔 300ms 内从 0 淡入到 0.35（别第一帧凭空冒一团光），落定时退到 0.15 */
  0%             { opacity: 0; }
  7.7%, 28.2051% { opacity: .35; animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
  38.4615%, 100% { opacity: .15; }
}
</style>
</head>
