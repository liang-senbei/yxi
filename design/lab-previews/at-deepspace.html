var IW=564,IH=349;          // logo 像素尺寸

var TAU=Math.PI*2,HPI=Math.PI/2;
var W=0,H=0,D=1;            // CSS 尺寸 / dpr
var LX=0,LY=0,LW=0,LH=0;    // logo 显示矩形
var RX=0,RY=0,RR=0;         // 环圆心 / 半径

// ---- 离屏画布：元素只建一次；尺寸相关的在 fit() 里重画
function mk(){return document.createElement('canvas')}
var cWhite=mk(),cRed=mk(),cBlue=mk(),cBloom=mk(),cRing=mk(),cLeak=mk(),cNoise=mk();
var sFar=mk(),sNear=mk(),sGold=mk(),sLime=mk();

function glow(c,size,rgb,stops){
  c.width=c.height=size;var x=c.getContext('2d'),h=size/2,g=x.createRadialGradient(h,h,0,h,h,h);
  for(var i=0;i<stops.length;i++)g.addColorStop(stops[i][0],'rgba('+rgb+','+stops[i][1]+')');
  x.fillStyle=g;x.fillRect(0,0,size,size);
}
glow(sFar,64,'120,170,255',[[0,.9],[.55,.8],[.85,.25],[1,0]]);   // 远：边缘略实的光斑
glow(sNear,128,'90,140,255',[[0,.55],[.35,.3],[.7,.08],[1,0]]);   // 近：糊成一团
glow(sGold,16,'255,214,120',[[0,1],[.3,.7],[1,0]]);
glow(sLime,16,'180,255,150',[[0,1],[.3,.7],[1,0]]);

// 胶片颗粒：128×128 噪声图平铺，每帧只换偏移
var NS=128;cNoise.width=cNoise.height=NS;
(function(){var x=cNoise.getContext('2d'),id=x.createImageData(NS,NS),d=id.data;
  for(var i=0;i<d.length;i+=4){var v=(Math.random()*255)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}
  x.putImageData(id,0,0)})();
var noisePat=ctx.createPattern(cNoise,'repeat');

function tint(c,col){        // 黑色笔画 → 指定颜色（source-in）
  var w=Math.ceil(LW*D),h=Math.ceil(LH*D);c.width=w;c.height=h;
  var x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,w,h);
}
function buildBloom(){
  var w=Math.ceil(LW*2.2),h=Math.ceil(LH*3.2);cBloom.width=w;cBloom.height=h;
  var x=cBloom.getContext('2d');x.translate(w/2,h/2);x.scale(1,h/w);
  var g=x.createRadialGradient(0,0,0,0,0,w/2);
  g.addColorStop(0,'rgba(70,120,255,.38)');g.addColorStop(.35,'rgba(60,100,240,.14)');g.addColorStop(1,'rgba(40,70,200,0)');
  x.fillStyle=g;x.fillRect(-w/2,-w/2,w,w);
}
function buildRing(){
  var S=Math.ceil((RR+14)*2*D);cRing.width=cRing.height=S;
  var x=cRing.getContext('2d'),g;x.translate(S/2,S/2);x.scale(D,D);
  if(x.createConicGradient){
    g=x.createConicGradient(0,0,0);
    var cols=['#FF5C7A','#FFB347','#F3F07A','#5CFFB0','#5CC8FF','#7A7AFF','#D07AFF','#FF5C7A'];
    for(var i=0;i<cols.length;i++)g.addColorStop(i/(cols.length-1),cols[i]);
  }else g='#BFD4FF';
  x.strokeStyle=g;
  var lw=[9,4,1.5],la=[.08,.22,1];  // 三道叠出发光边
  for(var j=0;j<3;j++){x.lineWidth=lw[j];x.globalAlpha=la[j];x.beginPath();x.arc(0,0,RR,0,TAU);x.stroke()}
}
function buildLeak(){        // 棱镜漏光：一条竖向长条，横向彩虹渐变，画时斜过来
  var w=Math.ceil(LW*.4),h=Math.ceil(Math.sqrt(W*W+H*H)*1.2);cLeak.width=w;cLeak.height=h;
  var x=cLeak.getContext('2d'),g=x.createLinearGradient(0,0,w,0);
  var st=[[0,'255,120,150',0],[.15,'255,120,150',1],[.32,'255,210,110',1],[.5,'150,255,190',1],[.68,'120,190,255',1],[.85,'200,140,255',1],[1,'200,140,255',0]];
  for(var i=0;i<st.length;i++)g.addColorStop(st[i][0],'rgba('+st[i][1]+','+st[i][2]+')');
  x.fillStyle=g;x.fillRect(0,0,w,h);
}

// ---- 粒子：前 NB 个是左侧冷色光斑，其余是右侧暖色星点
var NB=60,N=310;
var bx=new Float32Array(N),by=new Float32Array(N),vx=new Float32Array(N),vy=new Float32Array(N),
    dx=new Float32Array(N),dy=new Float32Array(N),sz=new Float32Array(N),dp=new Float32Array(N),
    ph=new Float32Array(N),am=new Float32Array(N),al=new Float32Array(N),kind=new Uint8Array(N);
function seed(){
  var m=Math.min(W,H);
  for(var i=0;i<N;i++){
    var z=Math.random();dp[i]=z;ph[i]=Math.random()*TAU;dx[i]=dy[i]=0;by[i]=Math.random()*H;
    if(i<NB){
      bx[i]=W*Math.pow(Math.random(),1.5)*.62;
      sz[i]=m*(.015+.1*z*z);al[i]=.14+.36*z;kind[i]=z>.55?1:0;
      vx[i]=-(1.5+3*z);vy[i]=-(2.5+6*z);am[i]=m*(.006+.02*z);
    }else{
      bx[i]=W*(1-.6*Math.pow(Math.random(),1.4));
      sz[i]=.7+2.2*z;al[i]=.35+.6*z;kind[i]=Math.random()<.6?2:3;
      if(Math.random()<.08){sz[i]*=2;al[i]=1}
      vx[i]=1+3*z;vy[i]=-(1.5+4*z);am[i]=m*(.004+.012*z);
    }
  }
}

var pressed=false,hov=false,px=0,py=0;
function step(dt){           // dt 秒；漂移 + 手指推开 + 回位
  var dec=Math.pow(.95,dt*60),sx=W+80,sy=H+80,act=pressed||hov;
  for(var i=0;i<N;i++){
    var x=bx[i]+vx[i]*dt,y=by[i]+vy[i]*dt;
    if(x<-40)x+=sx;else if(x>W+40)x-=sx;
    if(y<-40)y+=sy;else if(y>H+40)y-=sy;
    bx[i]=x;by[i]=y;
    if(act){
      var ox=x+dx[i]-px,oy=y+dy[i]-py,d2=ox*ox+oy*oy;
      if(d2<14400&&d2>1){var d=Math.sqrt(d2),f=(120-d)/120*(.5+dp[i])*500*dt/d;dx[i]+=ox*f;dy[i]+=oy*f}
    }
    dx[i]*=dec;dy[i]*=dec;
  }
}
function drawParticles(t){
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<N;i++){
    var k=kind[i],s=sz[i],a=al[i],sp,z=dp[i];
    var x=bx[i]+dx[i]+Math.sin(t*.0004*(.6+z)+ph[i])*am[i],y=by[i]+dy[i];
    if(k<2){sp=k?sNear:sFar;a*=.85+.15*Math.sin(t*.0009+ph[i]*3)}
    else{sp=k===2?sGold:sLime;a*=.55+.45*Math.sin(t*.003*(.5+z)+ph[i])}
    ctx.globalAlpha=a;ctx.drawImage(sp,x-s,y-s,s+s,s+s);
  }
}

function ss(x){return x<=0?0:x>=1?1:x*x*(3-2*x)}
function drawBloom(t){
  var p=ss((t-400)/1200);if(p<=0)return;
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=p*(.82+.18*Math.sin(t*.0011));
  ctx.drawImage(cBloom,LX+LW/2-cBloom.width/2,LY+LH/2-cBloom.height/2);
}
function drawRing(t){
  var q=ss((t-1200)/1200);if(q<=0)return;
  ctx.save();ctx.translate(RX,RY);
  if(q<1){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,RR+30,-HPI,-HPI+TAU*q);ctx.closePath();ctx.clip()}
  ctx.rotate(t*.00022);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.9;
  var S=cRing.width/D;ctx.drawImage(cRing,-S/2,-S/2,S,S);ctx.restore();
}
function drawLogo(t){        // 红蓝错位副本先出现，慢慢合成白字
  var p=ss((t-400)/1200);if(p<=0)return;
  var s=1+.05*(1-p),w=LW*s,h=LH*s,x=LX+(LW-w)/2,y=LY+(LH-h)/2,off=4*(1-p);
  var ca=Math.min(1,p*3)*(1-p)*.8,wa=p*p;
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=ca;
  ctx.drawImage(cRed,x-off,y-off*.35,w,h);ctx.drawImage(cBlue,x+off,y+off*.35,w,h);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=wa;ctx.drawImage(cWhite,x,y,w,h);
}
function drawLeak(u,a){      // u 扫过进度 0..1；screen 提亮底色，multiply 给白字染上棱镜色
  var cx=LX-LW*.5+u*LW*2,cy=LY+LH/2,hw=cLeak.width/2,hh=cLeak.height/2;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-.6);
  ctx.globalCompositeOperation='screen';ctx.globalAlpha=a*.12;ctx.drawImage(cLeak,-hw,-hh);
  ctx.globalCompositeOperation='multiply';ctx.globalAlpha=a*.35;ctx.drawImage(cLeak,-hw,-hh);
  ctx.restore();
}
function leaks(t){
  var u=(t-1200)/1500;
  if(u>=0&&u<=1){drawLeak(u,Math.sin(u*Math.PI));return}
  if(t>4000){u=((t-4000)%9000)/2200;if(u<=1)drawLeak(u,.45*Math.sin(u*Math.PI))}
}
function drawGrain(){
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.04;
  var ox=(Math.random()*NS)|0,oy=(Math.random()*NS)|0;
  ctx.setTransform(1,0,0,1,-ox,-oy);ctx.fillStyle=noisePat;ctx.fillRect(ox,oy,cv.width,cv.height);
  ctx.setTransform(D,0,0,D,0,0);
}

function fit(){
  var w=window.innerWidth,h=window.innerHeight,d=Math.min(2,window.devicePixelRatio||1);
  if(!w||!h){W=H=0;return}          // WebView 首帧可能是 0，等 resize / 下一帧再试
  if(w===W&&h===H&&d===D)return;
  W=w;H=h;D=d;cv.width=Math.round(w*d);cv.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);
  LW=W*.62;LH=LW*IH/IW;LX=(W-LW)/2;LY=H*.46-LH/2;
  RX=LX+LW*YX;RY=LY+LH*YY;RR=LW*.55;
  bgGrad=ctx.createRadialGradient(W*.45,H*.4,0,W*.5,H*.5,Math.max(W,H)*.8);
  bgGrad.addColorStop(0,'#0C1226');bgGrad.addColorStop(.6,'#070A16');bgGrad.addColorStop(1,'#05070D');
  tint(cWhite,'#F2EFE9');tint(cRed,'#FF2E4C');tint(cBlue,'#2E7CFF');
  buildBloom();buildRing();buildLeak();seed();
}

var t0=0,last=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!W){fit();if(!W)return}
  if(!t0){t0=now;last=now}
  var t=now-t0,dt=Math.min(.05,(now-last)/1000);last=now;
  step(dt);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
  drawParticles(t);drawBloom(t);drawRing(t);drawLogo(t);leaks(t);
  if(t<600){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1-t/600;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H)}
  drawGrain();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

cv.addEventListener('pointerdown',function(e){pressed=true;px=e.clientX;py=e.clientY});
cv.addEventListener('pointermove',function(e){px=e.clientX;py=e.clientY;if(e.pointerType==='mouse')hov=true});
cv.addEventListener('pointerleave',function(){hov=false});
window.addEventListener('pointerup',function(){pressed=false});
window.addEventListener('pointercancel',function(){pressed=false});

img.onload=function(){fit();window.addEventListener('resize',fit);requestAnimationFrame(loop)};
img.src=LOGO;
})();
</script>
</body>
</html>
