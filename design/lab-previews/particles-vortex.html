var IMG_W=564,IMG_H=349;
/* timeline (ms): fly 0-1500 (+0-300 delay), crossfade 1800-2200, end 2300, hold 2000 */
var FLY=1500,DELAY=300,FADE_IN=1800,FADE_OUT=2200,END=2300,HOLD=2000;
var K=4,EK=Math.exp(-K),TAU=Math.PI*2;

var img=new Image();

/* cubic-bezier(0.4,0,0.2,1) -> 257-entry LUT */
var EASE=new Float32Array(257);
(function(){
  function bx(t){var u=1-t;return 3*u*u*t*0.4+3*u*t*t*0.2+t*t*t;}
  function by(t){var u=1-t;return 3*u*t*t+t*t*t;}
  for(var j=1;j<256;j++){
    var x=j/256,lo=0,hi=1,t=0.5;
    for(var it=0;it<24;it++){t=(lo+hi)/2;if(bx(t)<x)lo=t;else hi=t;}
    EASE[j]=by(t);
  }
  EASE[0]=0;EASE[256]=1;
})();
function ease(p){
  if(p<=0)return 0;
  if(p>=1)return 1;
  var f=p*256,j=f|0;
  return EASE[j]+(EASE[j+1]-EASE[j])*(f-j);

/* hue 210->180->120->60->30->330, cached strings */
var HUES=[210,180,120,60,30,-30],NH=96,COLS=[];
for(var h=0;h<NH;h++){
  var s=h/(NH-1)*5,si=Math.min(4,s|0),hue=(HUES[si]+(HUES[si+1]-HUES[si])*(s-si)+360)%360;
  COLS.push('hsl('+hue.toFixed(1)+',62%,62%)');
}
var INK='#111',PINK=COLS[NH-1];
/* log spiral radius factor: 1 at s=0, exactly 0 at s=1 */
function spiral(s){return (Math.exp(-K*s)-EK)/(1-EK);}

function sample(){
  var oc=document.createElement('canvas');oc.width=IMG_W;oc.height=IMG_H;
  var g=oc.getContext('2d');g.drawImage(img,0,0,IMG_W,IMG_H);
  var d=g.getImageData(0,0,IMG_W,IMG_H).data,pts=[],x,y,i;
  for(y=2;y<IMG_H;y+=5)for(x=2;x<IMG_W;x+=5)if(d[(y*IMG_W+x)*4+3]>128)pts.push(x,y);
  var cand=pts.length/2,keep=Math.min(1,Math.min(900,Math.max(600,cand*0.5))/cand),tmp=[];
  for(i=0;i<cand;i++)if(Math.random()<keep)tmp.push((pts[2*i]+Math.random()*4-2)/IMG_W,(pts[2*i+1]+Math.random()*4-2)/IMG_H);
  N=tmp.length/2;
  uv=new Float32Array(tmp);
  par=new Float32Array(N*4);   /* theta0, dtheta, t0, t1 */
  tgt=new Float32Array(N*2);
  ring=new Float32Array(N*8);  /* 4 slots x (x,y) */
  prog=new Float32Array(N);
  for(i=0;i<N;i++){
    var dl=Math.random()*DELAY;
    par[4*i]=Math.random()*TAU;
    par[4*i+1]=TAU*(1.2+Math.random()*0.6);
    par[4*i+2]=dl;
    par[4*i+3]=FLY+dl*0.6;
  }
}

function layout(){
  W=window.innerWidth;H=window.innerHeight;
  var dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  diag=Math.sqrt(W*W+H*H);R0=0.7*diag;
  lw=W*0.58;lh=lw*IMG_H/IMG_W;lx=(W-lw)/2;cx=W/2;cy=H*0.45;ly=cy-lh/2;
  dotR=Math.min(4,Math.max(1.1,lw*0.0065));
  for(var i=0;i<N;i++){tgt[2*i]=lx+uv[2*i]*lw;tgt[2*i+1]=ly+uv[2*i+1]*lh;}
  glow=ctx.createRadialGradient(0,0,0,0,0,1);
  glow.addColorStop(0,'rgba(120,170,255,0.10)');
  glow.addColorStop(1,'rgba(120,170,255,0)');
}

function reset(now,from){
  start=now;replayFrom=from;finalDrawn=false;head=0;
  for(var i=0;i<N;i++){
    var x=tgt[2*i]+R0*Math.cos(par[4*i]),y=tgt[2*i+1]+R0*Math.sin(par[4*i]);
    for(var s=0;s<4;s++){ring[8*i+2*s]=x;ring[8*i+2*s+1]=y;}
  }

function dot(x,y,r){ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,TAU);}

function frame(){
  requestAnimationFrame(frame);
  var now=performance.now(),t=now-start;
  if(t>=END+HOLD){reset(now,lastLogoA);t=0;}
  if(t>=END&&finalDrawn)return;
  var u=t<=FADE_IN?0:t>=FADE_OUT?1:(t-FADE_IN)/(FADE_OUT-FADE_IN);

  var la=1-u,logoA=u;
  if(t<200)logoA=Math.max(logoA,replayFrom*(1-t/200));

    ctx.beginPath();
    for(i=0;i<N;i++){

      if(a<0)continue;
      if(a<300)fading=true;
      r=a<150?dotR*(1+0.5*Math.sin(a/150*Math.PI)):dotR;
      dot(tgt[2*i],tgt[2*i+1],r);
    }
    ctx.fillStyle=INK;ctx.globalAlpha=la;ctx.fill();
    /* pink -> ink over 300ms after landing, batched into 8 alpha buckets */
    if(fading){
      for(k=0;k<8;k++){
        var any=false;
        ctx.beginPath();
        for(i=0;i<N;i++){
          a=t-par[4*i+3];
          if(a<0||a>=300||Math.min(7,((1-a/300)*8)|0)!==k)continue;
          r=a<150?dotR*(1+0.5*Math.sin(a/150*Math.PI)):dotR;
          dot(tgt[2*i],tgt[2*i+1],r);any=true;
        }
        if(any){ctx.fillStyle=PINK;ctx.globalAlpha=la*(k+0.5)/8;ctx.fill();}
      }
    }
  }
  if(logoA>0){ctx.globalAlpha=logoA;ctx.drawImage(img,lx,ly,lw,lh);}
  ctx.globalAlpha=1;
  lastLogoA=logoA;
  if(t>=END)finalDrawn=true;
}

img.onload=function(){
  sample();layout();reset(performance.now(),0);
  requestAnimationFrame(frame);
};
img.onerror=function(){document.getElementById('hint').textContent='logo 加载失败';};
img.src=LOGO;
window.addEventListener('resize',function(){
  if(!N||(window.innerWidth===W&&window.innerHeight===H))return;
  layout();reset(performance.now(),0);
});
window.addEventListener('pointerdown',function(){if(N)reset(performance.now(),lastLogoA);});
})();
</script>
