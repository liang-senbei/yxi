const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'), octx = off.getContext('2d');
const img = new Image();
let dpr = 1, W = 0, H = 0, w = 0, h = 0, wash = null, t0 = 0;

// 欠阻尼弹簧的解析解（零初速）：返回剩余位移比例，1 = 还在起点，0 = 落定。t 单位秒
const Z = 0.55, W0 = Math.sqrt(400), WD = W0 * Math.sqrt(1 - Z * Z);
const spr = t => t <= 0 ? 1 : Math.exp(-Z * W0 * t) * (Math.cos(WD * t) + Z * W0 / WD * Math.sin(WD * t));
// Compose 的 FastOutSlowIn = cubic-bezier(0.4, 0, 0.2, 1)，二分求 s 再取 y
function bez(x) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  let lo = 0, hi = 1, s = 0;
  for (let i = 0; i < 12; i++) { s = (lo + hi) / 2; (3 * (1 - s) * (1 - s) * s * .4 + 3 * (1 - s) * s * s * .2 + s * s * s) < x ? lo = s : hi = s; }
  return 3 * s * s - 2 * s * s * s;
}
const tw = (ms, start, dur) => bez((ms - start) / dur);
const lin = (ms, start, dur) => Math.min(Math.max((ms - start) / dur, 0), 1);

// 光带：从竖直往右下倒 20°，沿法线从左下角外扫到右上角外（法线指右上，y 朝下所以 NY 取负）
const NX = Math.cos(Math.PI / 9), NY = -Math.sin(Math.PI / 9);
function sheen(s) {
  const half = w * .125, lo = h * NY - half, hi = w * NX + half, p = lo + (hi - lo) * s;
  const g = octx.createLinearGradient(NX * (p - half), NY * (p - half), NX * (p + half), NY * (p + half));
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  return g;
}

function resize() {
  dpr = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  w = W * .58; h = w * 349 / 564;                       // 字宽 = 屏宽 58%，按原图比例定高
  off.width = Math.ceil(w * dpr); off.height = Math.ceil(h * dpr);
  wash = ctx.createLinearGradient(0, 0, 0, H);           // 顶部粉彩蓝 0.10 → 底部 0
  wash.addColorStop(0, 'rgba(158,200,240,.10)'); wash.addColorStop(1, 'rgba(158,200,240,0)');
}

function draw(ms) {
  const t = ms / 1000, cx = W / 2, cy = H * .45;         // 中心在 45% 高度处
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = wash; ctx.fillRect(0, 0, W, H);
  // 墨晕：比字大 6%、同一弹簧晚 60ms、alpha 0.18；先淡入到 400，650 起 300ms 淡出
  const hs = 1.06 * (1 + .22 * spr(t - .06));
  const ha = ms < 650 ? .18 * tw(ms, 60, 340) : .18 * (1 - tw(ms, 650, 300));
  if (ha > 0) { ctx.globalAlpha = ha; ctx.drawImage(img, cx - w * hs / 2, cy - h * hs / 2, w * hs, h * hs); }
  // 字 + 高光：离屏先画字，再 source-atop 画光带 —— 光只落在笔画上，字保留
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.globalCompositeOperation = 'source-over'; octx.clearRect(0, 0, w, h);
  octx.drawImage(img, 0, 0, w, h);
  const s = lin(ms, 800, 500);
  if (s > 0 && s < 1) { octx.globalCompositeOperation = 'source-atop'; octx.fillStyle = sheen(s); octx.fillRect(0, 0, w, h); }
  const is = 1 + .22 * spr(t);
  ctx.globalAlpha = tw(ms, 0, 400);
  ctx.drawImage(off, cx - w * is / 2, cy - h * is / 2, w * is, h * is);
}

function frame(now) {
  const ms = now - t0;
  draw(ms);
  if (ms >= 1900 + 2000) t0 = now;                       // 播完停 2 秒自动重播
  requestAnimationFrame(frame);
}
img.onload = () => { resize(); t0 = performance.now(); requestAnimationFrame(frame); };
img.src = LOGO;
addEventListener('resize', resize);
cv.addEventListener('pointerdown', () => { t0 = performance.now(); });
</script>
