<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粒子聚合</title>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #FFFFFF; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: manipulation; }
  #hint { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center;
          font: 12px system-ui, sans-serif; color: #9E9E9E; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">点一下重播</div>
<script>
(function () {
  // 开屏方案「粒子聚合」网页预览版。编排、时序、参数跟 Kotlin 版 SplashParticles.kt 一模一样：
  //  · 0～1400ms：几百个点从屏幕外一圈随机起点飞到字上采样的终点，各自延迟 0～350ms，FastOutSlowIn 缓动
  //  · 1400～1800ms：粒子层 1→0、真图 0→1 交叉淡入，位置完全重合
  //  · 1800～2200ms：停住；再停 2 秒自动重播；点一下立刻重播
  var FLY = 1400, CROSS = 400, HOLD = 400, TOTAL = FLY + CROSS + HOLD;
  var MAX_DELAY = 350, GRID = 6, LOOP_GAP = 2000, TAU = Math.PI * 2;
  var BLUE = [11, 87, 208], INK = [0, 0, 0];   // 前 40% 品牌蓝，880→1400ms 渐变到黑

  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 0, H = 0, f = null, start = 0;

  // 画布按设备像素比铺满，坐标系仍用 CSS 像素（半径 1.2～2.6 就是 Kotlin 版的 dp）
  function fit() {
    var dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fit();
  window.addEventListener('resize', fit);

  // 固定种子的随机数（mulberry32）：每次重播粒子分布一样，方便对着调
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // FastOutSlowInEasing = cubic-bezier(0.4, 0, 0.2, 1)。Compose 是每次二分求解，这里一次性打成 512 格查表
  var N = 512, EASE = new Float32Array(N + 1);
  (function () {
    for (var i = 0; i <= N; i++) {
      var x = i / N, lo = 0, hi = 1, t, u;
      for (var k = 0; k < 24; k++) {
        t = (lo + hi) / 2; u = 1 - t;
        if (3 * u * u * t * 0.4 + 3 * u * t * t * 0.2 + t * t * t < x) lo = t; else hi = t;
      }
      t = (lo + hi) / 2; u = 1 - t;
      EASE[i] = 3 * u * t * t * 1 + t * t * t;   // y1 = 0，那一项没了
    }
  })();
  function ease(p) {
    var q = p * N, i = q | 0;
    if (i >= N) return 1;
    return EASE[i] + (EASE[i + 1] - EASE[i]) * (q - i);
  }
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  // 采样：把图画到离屏 canvas 读 alpha。每 GRID 像素看一个点，alpha 过半才算墨上，再随机丢一半、抖 ±2px
  function sample(img) {
    var w = img.naturalWidth, h = img.naturalHeight;
    var off = document.createElement('canvas'); off.width = w; off.height = h;
    var oc = off.getContext('2d'); oc.drawImage(img, 0, 0);
    var a = oc.getImageData(0, 0, w, h).data;
    var rnd = rng(20260902);
    var cap = ((w / GRID | 0) + 1) * ((h / GRID | 0) + 1);
    var ix = new Float32Array(cap), iy = new Float32Array(cap);   // 终点：图内像素坐标
    var cs = new Float32Array(cap), sn = new Float32Array(cap);   // 起点方向 cos / sin
    var lag = new Float32Array(cap), r = new Float32Array(cap);   // 起飞延迟（占飞行段比例）、半径
    var n = 0;
    for (var y = 0; y < h; y += GRID) {
      for (var x = 0; x < w; x += GRID) {
        if (a[(y * w + x) * 4 + 3] < 128 || rnd() < 0.5) continue;
        ix[n] = x + rnd() * 4 - 2; iy[n] = y + rnd() * 4 - 2;
        var ang = rnd() * TAU; cs[n] = Math.cos(ang); sn[n] = Math.sin(ang);
        lag[n] = rnd() * MAX_DELAY / FLY;
        r[n] = 1.2 + rnd() * 1.4;
        n++;
      }
    }
    return { n: n, w: w, h: h, ix: ix, iy: iy, cs: cs, sn: sn, lag: lag, r: r };
  }

  var img = new Image();
  img.onload = function () {
    f = sample(img);
    start = performance.now();
    requestAnimationFrame(frame);
  };
  img.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAjQAAAFdCAYAAAAUmPcMAAATSklEQVR42u3d647bOLYGUFOo939lzq80JpW62JZE7stawAHOdHdik9wkP1G2/HhAL1MXANQzdAFNQ4zaBxBoIExAGS+EGPUPUNShC0gcZj7/7/lCmPnz37kFBVCAK1QyhxnzAYDH4+GEBj4HJic2AAm5IiVDyDA3ALBoI8SYHwC1ueUE8YMVAAINCDUAAg2sF+1Wj1ADINBACUINgEADQg0AAg0INQAINKQT+SvTQg2AQAMlQoNQAyDQgNAFgEADQg0AAg1CglADINAA/4YawQZAoIH/goH3D8BLPi5eyMeTC7pfMUYYAOAyzwaL+em/n4tfH4Gm6twCYEOgsQEgzKhngLCL7vxlMZ4b3xvCjFADwFuBxsaAQKN2AVIutjPhe0aYUa8A/PW17SwLr+d9CDMA8G2gybgZ2hABgH8CTcbjccEmbyAFgFsCTfYN0iaJ4AYg0Dwej/wfYhRsbPIACDRlNhubpnEBoGGgqXiyYfMEgEaBpvLGL9QYCwAaBJoOm4yN1BhoO0DxQNNpU7GxAEDRQDMeHs/O/WGyM/MLYEGgsbmCmgMoE2g6XUXaYPQ1AIWM5puQWwHCjDoDKOCwACPMAFA10HQJNTZdACgeaP6EGqc1CIrvM38AAgQamy/6EwCBBhpzOgMg0CzlVEE/AtAg0LjSRJgBIH2g6RBqbMhcyUUAQNBA04FQo9+EGYAGgcZCjTBjjgCkDzQ2aBBmAML50AUIf4IMQNeFeOoXYcbcASAKt5xAmAFIzy0n3tH1dEaQAQjKCQ3CjDAD0DbQWNwRZgBIH2joqePpjDADkIDP0CDMCDIA6TmhAWEGoHWgsej30el0Rl0DNAs0CDPCDAAlAo0NAGEGgO18KBhBBoD03HLiJ36zC4A2gabipuBXpIUZAJoFGhBmACgRaGwQtVQ+nVGrAAINwowwA4BAA8IMAKEDTbUNo+MHg30YGoD2gQZhJiqnMwACjY0DYQaAXoGGnKqezggzAAINjx6fKfG5GQAEGlfFBKUOAQQamvjtdCZrKBBmAAQaXtz0K7crY9uFGQCBxqZCauoOQKChkYq3moQZAIGGkwGgWluytVeYAWju4+ZNxleCASDnBW+qi8UP49e6WCtwOgNwz94wM627bjn1DgPCDADv7Icz2r54d6Cx4QhkagsgdjApsbc4oRFmhBkAdgejFIFmFBs0ACBYsHFC06PAKnE6AyDYCDSkDgfCDECeNXVpsPG17fop2cQDINJedMt6PjY2yOaqzwUagN57xWVruxOangWa7SnOwgxAj73q7fV+bH7jWY1kBaKvAaiyZ3y5L/hQcL3BF2YAaLfWHjoNEwyA7HuDE5paPPgPgJYXugKN8JCuaAGw7kYINDYrAUt9AFh/L31vTmiEGQBIT6DB1QEA6dfhQ4el51YTAO3XYyc0wgQApA81Ao1AZeIAkH5tPnQUJgwA2fcJJzTnzWave2VBCjMALjov2e8EGiHKewYgvd2BxhV6j2DgdAaA0oFGyKhvfNE/wgyA/e3MRXHIQGNzqxuchBkAlnBCI8x4zwBEXcOfvgiOEmiGgW/B6QwAz+4XL+0ZH/pMWBJmAHhh3xkR96dIt5xseMIMALHX8rFgfR/L/pDNe1mfZv2K9hRmAMpcSI+Tf75loKkQakbjfhBmAHqHmTP72Kk9w2do7ikGGzkA2Y0L//y88QAgbKAZD98Yylr4TmcAhJkVf1+KQINAB0CNILPMoUMFkgvGyukMAAINacOQH50EQKARTFKHmWcDDgC0DjQ2x9hjM4wXAFH4UPC9XvkKtw8CA9TcB1z8LRD9ltNoWvAA1Fzb5//9H80CQ4efQ5hqCKDlBao19CJuOQls7048VxcA5x9Z4enyza6uK3/7Z6oVgPYXo9bYk3xte2/hZwsz7v0CINBIrinDDOfG+   function frame(now) {
    var ms = now - start;
    if (ms >= TOTAL + LOOP_GAP) { start = now; ms = 0; }
    ctx.clearRect(0, 0, W, H);
    // 字的显示矩形：宽 = 屏宽 58%，水平居中，中心在 45% 高。粒子终点和真图都用它，所以重合
    var scale = W * 0.58 / f.w, dw = f.w * scale, dh = f.h * scale;
    var left = (W - dw) / 2, top = H * 0.45 - dh / 2;
    var xf = clamp((ms - FLY) / CROSS);   // 交叉淡入进度

    if (xf < 1) {
      var cx = W / 2, cy = H / 2, ring = 0.6 * Math.hypot(W, H);   // 起点圆：屏幕外接圆再大 20%
      var fly = clamp(ms / FLY);
      var k = clamp((ms - 0.4 * TOTAL) / (FLY - 0.4 * TOTAL));
      ctx.fillStyle = 'rgb(' + Math.round(BLUE[0] + (INK[0] - BLUE[0]) * k) + ',' +
        Math.round(BLUE[1] + (INK[1] - BLUE[1]) * k) + ',' + Math.round(BLUE[2] + (INK[2] - BLUE[2]) * k) + ')';
      for (var i = 0; i < f.n; i++) {
        var d = f.lag[i];
        if (fly <= d) continue;   // 还没起飞的在屏外，不用画
        var p = ease((fly - d) / (1 - d));
        var sx = cx + f.cs[i] * ring, sy = cy + f.sn[i] * ring;
        var tx = left + f.ix[i] * scale, ty = top + f.iy[i] * scale;
        ctx.globalAlpha = (0.5 + 0.5 * p) * (1 - xf);   // 飞行中 0.5→1，淡出段再乘 1→0
        ctx.beginPath();
        ctx.arc(sx + (tx - sx) * p, sy + (ty - sy) * p, f.r[i], 0, TAU);
        ctx.fill();
      }
    }
    if (xf > 0) { ctx.globalAlpha = xf; ctx.drawImage(img, left, top, dw, dh); }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  document.addEventListener('click', function () { start = performance.now(); });
