var yC=[oc(),oc(),oc()], wmC=[oc(),oc(),oc()], grainPat=null;

function setup(c,w,h,d){ c.width=Math.ceil(w*d); c.height=Math.ceil(h*d); var x=c.getContext('2d'); x.setTransform(d,0,0,d,0,0); return x; }
function grad(x,cx,cy,r,stops){ var g=x.createConicGradient?x.createConicGradient(0,cx,cy):x.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  for(var i=0;i<stops.length;i++)g.addColorStop(stops[i][0],stops[i][1]); return g; }
function ring(x,c,r,lw,a,stops){ x.globalAlpha=a; x.lineWidth=lw; x.strokeStyle=grad(x,c,c,r,stops); x.beginPath(); x.arc(c,c,r,0,6.2832); x.stroke(); }
function blob(x,cx,cy,rx,ry,p){ x.save(); x.translate(cx,cy); x.scale(rx,ry); var g=x.createRadialGradient(0,0,0,0,0,1);
  g.addColorStop(0,p+'1)'); g.addColorStop(.3,p+'.5)'); g.addColorStop(1,p+'0)'); x.fillStyle=g; x.fillRect(-1,-1,2,2); x.restore(); }
function disc(c,s,stops){ var x=setup(c,s,s,DPR), g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  for(var i=0;i<stops.length;i++)g.addColorStop(stops[i][0],stops[i][1]); x.fillStyle=g; x.fillRect(0,0,s,s); }

function bake(){
  var i,x,c;
  for(i=0;i<3;i++){                      // 彩虹色差环：宽晕 + 中晕 + 饱和边 + 浅色亮芯，叠加合成
    RS[i]=(R[i]+16)*2; x=setup(ringC[i],RS[i],RS[i],DPR); c=RS[i]/2; x.globalCompositeOperation='lighter';
    ring(x,c,R[i],14,0.09,RAINBOW); ring(x,c,R[i],5,0.22,RAINBOW); ring(x,c,R[i],LW[i]+1.2,0.45,RAINBOW); ring(x,c,R[i],LW[i],0.95,PALE);
  }
  LKL=YH*0.8; LKT=Math.max(8,YH*0.18);   // 棱镜漏光：红 / 蓝错位 + 白芯
  x=setup(leakC,LKL,LKT,DPR); x.globalCompositeOperation='lighter';
  blob(x,LKL*.42,LKT/2,LKL*.4,LKT*.5,'rgba(255,96,120,'); blob(x,LKL*.58,LKT/2,LKL*.4,LKT*.5,'rgba(96,160,255,'); blob(x,LKL/2,LKT/2,LKL*.38,LKT*.42,'rgba(255,255,255,');
  GS=YH*2.6;                              // Y 背后的深蓝柔光
  disc(glowC,GS,[[0,'rgba(38,78,205,.62)'],[.35,'rgba(24,46,140,.30)'],[1,'rgba(10,20,60,0)']]);
  disc(bokehC,64,[[0,'rgba(120,170,255,.7)'],[.6,'rgba(110,160,255,.5)'],[.92,'rgba(140,190,255,.28)'],[1,'rgba(140,190,255,0)']]);   // 冷蓝镜头光斑
  disc(starC,32,[[0,'rgba(255,240,200,1)'],[.18,'rgba(255,212,130,.8)'],[.5,'rgba(255,190,90,.15)'],[1,'rgba(255,190,90,0)']]);         // 暖金星点
  disc(greenC,32,[[0,'rgba(230,255,225,1)'],[.18,'rgba(150,240,170,.8)'],[.5,'rgba(110,220,150,.15)'],[1,'rgba(110,220,150,0)']]);     // 青绿星点
}
function bakeGrain(){ var n=128, x=setup(grainC,n,n,1), im=x.createImageData(n,n), d=im.data, i, v;
  for(i=0;i<d.length;i+=4){ v=(Math.random()*255)|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  x.putImageData(im,0,0); grainPat=ctx.createPattern(grainC,'repeat'); }
function tint(c,img,color){ var x=setup(c,img.width,img.height,1); x.drawImage(img,0,0); x.globalCompositeOperation='source-in'; x.fillStyle=color; x.fillRect(0,0,img.width,img.height); }
function bakeLogo(){ var cols=['#F2EFE9','rgb(255,72,96)','rgb(72,140,255)'];   // 白 / 红副本 / 蓝副本
  for(var i=0;i<3;i++){ tint(yC[i],imgs[0],cols[i]); tint(wmC[i],imgs[1],cols[i]); } }

function fit(){
  var d=Math.min(2,window.devicePixelRatio||1), w=window.innerWidth, h=window.innerHeight;   // DPR 封顶 2：手机上 2D canvas 叠加合成够用了
  if(!w||!h) return false;                       // WebView 首帧可能是 0，等下一帧
  if(w===W&&h===H&&d===DPR) return true;
  W=w; H=h; DPR=d; U=Math.min(W,H);
  cv.width=Math.round(W*d); cv.height=Math.round(H*d); ctx.setTransform(d,0,0,d,0,0);
  YH=Math.min(H*0.28,W*0.30); YW=YH*218/349; WW=YH*564/349; CX=W/2; CY=H*0.44;   // 竖屏全屏时按宽度收一收，保证整字放得下
  R[0]=YH*0.75; R[1]=YH*0.95; R[2]=YH*1.2;
  bg=ctx.createRadialGradient(CX,CY*0.9,0,CX,CY*0.9,Math.max(W,H)*0.8);
  bg.addColorStop(0,'#0C1224'); bg.addColorStop(.5,'#090E1C'); bg.addColorStop(1,'#05070D');
  bake(); return true;
}
window.addEventListener('resize',fit);

// ---------- 粒子：x,y,z,size,type,phase,bx,by,vx,vy（坐标归一化到 0..1，尺寸按 U 的比例） ----------
var N=280, S=10, P=new Float32Array(N*S);
(function(){ for(var i=0;i<N;i++){ var o=i*S, cold=i<N*0.32, z=Math.random();
  P[o]=cold?Math.pow(Math.random(),1.8)*0.8:1-Math.pow(Math.random(),1.8)*0.8;   // 冷蓝 bokeh 偏左，暖星偏右
  P[o+1]=Math.random(); P[o+2]=z;
  P[o+3]=cold?0.008+z*z*0.045:0.003+z*0.009;
  P[o+4]=cold?0:(Math.random()<0.6?1:2);
  P[o+5]=Math.random()*6.2832;
  P[o+6]=(Math.random()-0.5)*0.000006*(0.4+z); P[o+7]=-(0.000003+Math.random()*0.000006)*(0.4+z);
  P[o+8]=0; P[o+9]=0; } })();

var ptrX=0,ptrY=0,ptrOn=false,ptrV=0,ptrT=0,ptrGlow=0,lastAng=0, spin=0, ang=[0,0,0];
function step(t,dt){
  var damp=Math.exp(-dt*0.004), on=ptrOn, pr=U*0.22, pr2=pr*pr, i,o,dx,dy,d2,d,f;
  for(i=0;i<N;i++){ o=i*S;
    P[o]+=(P[o+6]+P[o+8])*dt+Math.sin(t*0.0004+P[o+5])*0.000006*dt;
    P[o+1]+=(P[o+7]+P[o+9])*dt;
    P[o+8]*=damp; P[o+9]*=damp;
    if(P[o]<-0.08)P[o]+=1.16; else if(P[o]>1.08)P[o]-=1.16;
    if(P[o+1]<-0.08)P[o+1]+=1.16; else if(P[o+1]>1.08)P[o+1]-=1.16;
    if(on){ dx=P[o]*W-ptrX; dy=P[o+1]*H-ptrY; d2=dx*dx+dy*dy;
      if(d2<pr2){ d=Math.sqrt(d2)+0.5; f=1-d/pr; f=f*f*(0.0006+ptrV*0.002)*(0.4+P[o+2])*dt;   // 近的（z 大）被推得更远：视差
        P[o+8]+=dx/d*f/W; P[o+9]+=dy/d*f/H; } }
  }
}
function particles(t,near,fade){ var i,o,z,ty,x,y,r,a;
  for(i=0;i<N;i++){ o=i*S; z=P[o+2]; if(near?z<0.78:z>=0.78)continue;
    ty=P[o+4]; x=P[o]*W; y=P[o+1]*H; r=P[o+3]*U;
    a=ty?(0.4+0.6*z)*(0.55+0.45*Math.sin(t*0.0025+P[o+5]*5)):(0.08+0.36*z)*(0.85+0.15*Math.sin(t*0.0006+P[o+5]));
    ctx.globalAlpha=a*fade; ctx.drawImage(ty===0?bokehC:ty===1?starC:greenC,x-r,y-r,r*2,r*2); } }

function rings(t,dt){ var i,p,k,a;
  for(i=0;i<3;i++){ ang[i]+=(WV[i]+spin)*dt;
    p=Math.min(1,(t-i*200)/1000); if(p<=0)continue;                           // 登场：各错开 200ms 从半径 0 展开
    k=ease(p)*(1+0.012*Math.sin(t*0.0009+i*2.1)); a=Math.min(1,p*3)*(0.86+0.14*Math.sin(t*0.0011+i));
    if(k<0.01)continue;
    ctx.save(); ctx.translate(CX,CY); if(i===2)ctx.scale(1,TILT); ctx.rotate(ang[i]); ctx.scale(k,k);
    ctx.globalAlpha=a; ctx.drawImage(ringC[i],-RS[i]/2,-RS[i]/2,RS[i],RS[i]); ctx.restore(); } }

var LK=[[0,1.1,0.00013,0],[1,3.9,-0.00010,2.1],[2,5.5,0.00008,4.2]];   // 漏光：所在环 / 起始角 / 巡游速度 / 呼吸相位
function leaks(t){ var j,l,i,p,a;
  for(j=0;j<3;j++){ l=LK[j]; i=l[0]; p=Math.min(1,(t-i*200)/1000); if(p<0.3)continue;
    a=Math.min(1,(t-1100)/700); if(a<=0)continue; a*=0.35*(0.75+0.25*Math.sin(t*0.0017+l[3]));
    ctx.save(); ctx.translate(CX,CY); if(i===2)ctx.scale(1,TILT); ctx.rotate(ang[i]+l[1]+l[2]*t); ctx.translate(R[i]*ease(p),0); ctx.rotate(1.5708);
    ctx.globalAlpha=a; ctx.drawImage(leakC,-LKL/2,-LKT/2,LKL,LKT); ctx.restore(); } }

function glyph(c,x,y,w,h,a){          // 红 / 蓝副本各偏 1.5px 垫在下面，白字盖上
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.35*a; ctx.drawImage(c[1],x-1.5,y,w,h); ctx.drawImage(c[2],x+1.5,y,w,h);
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=a; ctx.drawImage(c[0],x,y,w,h); }
function logo(t){
  var yA=t<1000?ease(t/1000):t<1400?1:Math.max(0,1-(t-1400)/400), ys=0.9+0.1*ease(Math.min(1,t/1000));
  var wA=t<1400?0:Math.min(1,(t-1400)/200)*0.92, wc=t<1400?0:ease(Math.min(1,(t-1400)/800));
  var left=CX-YW/2, top=CY-YH/2, x0=WW*0.236, cw=x0+(WW-x0)*wc, e;   // 整字里 u 从 133/564 处起笔，clip 从那里往右推
  if(yA>0){ ctx.save(); ctx.translate(CX,CY); ctx.scale(ys,ys); ctx.translate(-CX,-CY); glyph(yC,left,top,YW,YH,yA); ctx.restore(); }
  if(wA>0){ ctx.save(); ctx.beginPath(); ctx.rect(left-4,top-4,cw+4,YH+8); ctx.clip(); glyph(wmC,left,top,WW,YH,wA); ctx.restore();
    if(wc<1){ e=Math.sin(3.1416*(t-1400)/800);                                  // 扫出整字的那道竖光
      ctx.save(); ctx.translate(left+cw,CY); ctx.rotate(1.5708); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.55*e;
      ctx.drawImage(leakC,-YH*0.7,-LKT*0.45,YH*1.4,LKT*0.9); ctx.restore(); } }
}
function finger(dt){ ptrGlow+=((ptrOn?1:0)-ptrGlow)*Math.min(1,dt*0.008); if(ptrGlow<0.01)return;
  var r=U*0.09; ctx.globalAlpha=0.22*ptrGlow; ctx.drawImage(bokehC,ptrX-r,ptrY-r,r*2,r*2); }
function grain(){ var gx=(Math.random()*128)|0, gy=(Math.random()*128)|0;
  ctx.save(); ctx.setTransform(1,0,0,1,-gx,-gy); ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=0.04;
  ctx.fillStyle=grainPat; ctx.fillRect(gx,gy,cv.width,cv.height); ctx.restore(); }

var t0=0,last=0;
function frame(){
  var now=performance.now();
  if(!fit()){ requestAnimationFrame(frame); return; }
  if(!t0){ t0=now; last=now; }
  var t=now-t0, dt=Math.min(50,now-last); last=now;
  ptrV*=Math.exp(-dt*0.008); spin*=Math.exp(-dt*0.0025);
  step(t,dt);
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1; ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  var fade=Math.min(1,t/1600);
  ctx.globalCompositeOperation='lighter';
  particles(t,false,fade);                                  // 远景粒子
  ctx.globalAlpha=ease(Math.min(1,t/1200))*(0.9+0.1*Math.sin(t*0.0008)); ctx.drawImage(glowC,CX-GS/2,CY-GS/2,GS,GS);
  rings(t,dt);
  logo(t);
  ctx.globalCompositeOperation='lighter';
  leaks(t);
  particles(t,true,fade);                                   // 近景粒子，从字前面飘过
  finger(dt);
  grain();
  requestAnimationFrame(frame);
}

// ---------- 触摸：推开粒子，环跟着手指绕行方向加一点转速 ----------
function move(e){ var x=e.clientX, y=e.clientY, now=performance.now(), a=Math.atan2(y-CY,x-CX), dt,dx,dy,dA;
  if(ptrOn){ dt=Math.max(1,now-ptrT); dx=x-ptrX; dy=y-ptrY; ptrV=Math.min(3,Math.sqrt(dx*dx+dy*dy)/dt);
    dA=a-lastAng; if(dA>3.1416)dA-=6.2832; else if(dA<-3.1416)dA+=6.2832;
    spin=Math.max(-0.0015,Math.min(0.0015,spin+dA*0.006)); }
  ptrX=x; ptrY=y; ptrT=now; lastAng=a; ptrOn=true; }
function up(){ ptrOn=false; }
cv.addEventListener('pointerdown',move); cv.addEventListener('pointermove',move);
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up); cv.addEventListener('pointerleave',up);

var imgs=[new Image(),new Image()], nload=0;
imgs[0].onload=imgs[1].onload=function(){ if(++nload<2)return; bakeLogo(); bakeGrain(); requestAnimationFrame(frame); };
imgs[0].src=Y_SRC; imgs[1].src=WM_SRC;
</script>
</body>
</html>
