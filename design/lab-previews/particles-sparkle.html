var TAU=Math.PI*2, HPI=Math.PI/2, QPI=Math.PI/4;

// ---- 时间线 (ms)
var T_GLINT=1300, T_FADE0=1700, T_FADE1=2100, T_END=2200, T_HOLD=2000;
var POP=220, FADE=400;                                // 弹出时长 / 褪成墨色时长

// glint：笔画尖端，图像坐标 / 屏幕坐标 / 起始时刻
var G=0, gImg=new Float32Array(8), gPos=new Float32Array(8), gT=new Float32Array(4);

// ---- 调色板：16 个 x 分桶 × 9 级褪色（火花渐变 → 墨黑），draw 里只查表不拼字符串
var STOPS=[[0x42,0x85,0xF4],[0x9B,0x72,0xCB],[0xD9,0x65,0x70]], INK=0x11, pal=[];
for(var b=0;b<16;b++){
  var fx=(b+0.5)/16, seg=fx<0.5?0:1, u=(fx-seg*0.5)*2, c0=STOPS[seg], c1=STOPS[seg+1];
  for(var s=0;s<9;s++){
    var k=s/8, ch=[0,0,0];
    for(var j=0;j<3;j++) ch[j]=Math.round((c0[j]+(c1[j]-c0[j])*u)*(1-k)+INK*k);

  }
}

// ---- 采样：离屏 canvas 读 alpha，每 5px 取一点，随机丢掉一半多一点（落在 600~900），抖 ±2px
function sample(image){
  var oc=document.createElement('canvas'); oc.width=IW; oc.height=IH;
  var o=oc.getContext('2d'); o.drawImage(image,0,0);
  var d=o.getImageData(0,0,IW,IH).data;
  var xs=[], ys=[], ex=[], ey=[], ev=[], cs=[], sn=[], k, x, y;
  for(k=0;k<8;k++){ ex.push(0); ey.push(0); ev.push(-1e9); cs.push(Math.cos(k*QPI)); sn.push(Math.sin(k*QPI)); }
  for(y=0;y<IH;y+=5) for(x=0;x<IW;x+=5){
    if(d[(y*IW+x)*4+3]<=128) continue;
    for(k=0;k<8;k++){ var v=x*cs[k]+y*sn[k]; if(v>ev[k]){ ev[k]=v; ex[k]=x; ey[k]=y; } }   // 8 个方向的最远点
    if(Math.random()>=0.42) continue;
    xs.push(x+Math.random()*4-2); ys.push(y+Math.random()*4-2);
  }
  N=xs.length;
  img=new Float32Array(N*2); pos=new Float32Array(N*2);
  t0=new Float32Array(N); rad=new Float32Array(N); rot=new Float32Array(N);
  kind=new Uint8Array(N); col=new Uint8Array(N);
  for(var i=0;i<N;i++){
    img[i*2]=xs[i]; img[i*2+1]=ys[i];
    kind[i]=Math.random()<0.08?1:0;                    // 8% 四角星
    rad[i]=(0.75+Math.random()*0.4)*(kind[i]?2.5:1);
    rot[i]=Math.random()*TAU;
    col[i]=Math.min(15,(xs[i]/IW*16)|0);
  }
  shuffleTimes();
  // glint 落点 = 8 个方向的最远点里互相隔 ≥110px 的前 4 个（就是笔画尖端），按 x 排序、从左到右错开
  var sel=[];
  for(k=0;k<8&&sel.length<4;k++){
    var ok=true;
    for(j=0;j<sel.length;j++){ var dx=ex[k]-sel[j][0], dy=ey[k]-sel[j][1]; if(dx*dx+dy*dy<110*110){ ok=false; break; } }
    if(ok) sel.push([ex[k],ey[k]]);
  }
  sel.sort(function(a,b){ return a[0]-b[0]; });
  G=sel.length;
  for(k=0;k<G;k++){ gImg[k*2]=sel[k][0]; gImg[k*2+1]=sel[k][1]; gT[k]=T_GLINT+k*80; }
}
function shuffleTimes(){                               // 出现时刻 0~1200ms，左边先亮
  for(var i=0;i<N;i++) t0[i]=(img[i*2]/IW)*700+Math.random()*500;
}

// ---- 布局：logo 宽 = 屏宽 58%，水平居中，中心在 45% 屏高
var W=0,H=0, rx=0,ry=0,rw=0,rh=0, unit=1, glow=null;
function layout(){
  W=window.innerWidth; H=window.innerHeight;
  var dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  rw=W*0.58; rh=rw*IH/IW; rx=(W-rw)/2; ry=H*0.45-rh/2;
  unit=rw/IW*4.2;                                      // 普通点半径 ≈ 1.1~1.6px（预览尺寸下）
  for(var i=0;i<N;i++){ pos[i*2]=rx+img[i*2]/IW*rw; pos[i*2+1]=ry+img[i*2+1]/IH*rh; }
  for(i=0;i<G;i++){ gPos[i*2]=rx+gImg[i*2]/IW*rw; gPos[i*2+1]=ry+gImg[i*2+1]/IH*rh; }
  glow=ctx.createRadialGradient(W/2,H*1.02,0,W/2,H*1.02,Math.max(W,H)*0.6);
  glow.addColorStop(0,'rgba(66,133,244,0.12)'); glow.addColorStop(1,'rgba(66,133,244,0)');
}

// ---- 四角星 ✦：四个尖角，腰部内收（控制点略过圆心，腰 ≈ 0.31r）
function star(x,y,r,a){
  ctx.moveTo(x+r*Math.cos(a), y+r*Math.sin(a));
  for(var i=1;i<=4;i++){
    var am=a+(i-0.5)*HPI, ai=a+i*HPI;
    ctx.quadraticCurveTo(x-r*0.08*Math.cos(am), y-r*0.08*Math.sin(am), x+r*Math.cos(ai), y+r*Math.sin(ai));
  }
}

// ---- 逐帧
var start=0, logo=new Image();
function frame(now){
  if(W!==window.innerWidth||H!==window.innerHeight) layout();
  var t=now-start;
  if(t>T_END+T_HOLD){ restart(now); t=0; }
  var i, x, y, r, age;

  ctx.globalAlpha=1; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=Math.min(1,t/500); ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);

  var f=t<T_FADE0?0:t>=T_FADE1?1:(t-T_FADE0)/(T_FADE1-T_FADE0); f=f*f*(3-2*f);
  var layer=1-f;
  if(layer>0){
    // 已定型的点：一条 path 一次 fill
    ctx.beginPath();
    for(i=0;i<N;i++){
      age=t-t0[i]; if(age<FADE) continue;
      x=pos[i*2]; y=pos[i*2+1]; r=rad[i]*unit;
      if(kind[i]) star(x,y,r,rot[i]+QPI); else { ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,TAU); }
    }
    ctx.globalAlpha=layer; ctx.fillStyle='#111'; ctx.fill();
    // 正在闪现的点：半径 0 → 1.6 → 1（back-out 形状，220ms），alpha 100ms 内到 1，400ms 内褪成墨色
    for(i=0;i<N;i++){
      age=t-t0[i]; if(age<0||age>=FADE) continue;
      var p=age<POP?age/POP:1, sc=p<1?p*(8.7+p*(-14.4+6.7*p)):1;
      x=pos[i*2]; y=pos[i*2+1]; r=rad[i]*unit*sc;
      ctx.globalAlpha=layer*(age<100?age/100:1);
      ctx.fillStyle=pal[col[i]*9+(age<100?0:((age-100)/(FADE-100)*8)|0)];
      ctx.beginPath();
      if(kind[i]) star(x,y,r,rot[i]+QPI*(1-(1-p)*(1-p))); else ctx.arc(x,y,r,0,TAU);
      ctx.fill();
    }
    // glint：笔画尖端的白色 ✦，半径 8/10px，alpha 0→0.9→0，350ms，下面垫一颗淡蓝光晕
    for(i=0;i<G;i++){
      var q=(t-gT[i])/350; if(q<=0||q>=1) continue;
      var a=Math.sin(q*Math.PI)*0.9, R=(8+(i&1)*2)*(0.55+0.45*(1-(1-q)*(1-q))), ang=q*0.5;
      x=gPos[i*2]; y=gPos[i*2+1];
      ctx.globalAlpha=layer*a*0.35; ctx.fillStyle='#8ab4f8'; ctx.beginPath(); star(x,y,R*1.7,ang); ctx.fill();
      ctx.globalAlpha=layer*a; ctx.fillStyle='#fff'; ctx.beginPath(); star(x,y,R,ang); ctx.fill();
    }
  }
  if(f>0){ ctx.globalAlpha=f; ctx.drawImage(logo,rx,ry,rw,rh); }
  requestAnimationFrame(frame);
}
function restart(now){ start=now; shuffleTimes(); }
cv.addEventListener('pointerdown', function(){ restart(performance.now()); }, {passive:true});

logo.onload=function(){
  sample(logo);
  layout();
  start=performance.now();
  requestAnimationFrame(frame);
};
logo.src=LOGO;
})();
window.addEventListener('resize', layout);
</script>
