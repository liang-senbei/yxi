// 开屏方案「Y 落下，字展开」网页预览版 —— 编排、时序、曲线跟 SplashDrop.kt 一一对应，改哪边都照着另一边改。
// 时间线（ms）：0～450 重力落下 + 转正 + alpha 0.3→1；450 触地→弹簧回弹 + 涟漪；700～1150 字向右展开、Y 同步淡出；
// 1250～1900 呼吸 1→1.02→1；2000 播完，停 2 秒重播；点一下立刻重播。
const TOTAL = 2000, HOLD = 2000, FALL_MS = 450, FALL = .45, GLOW_A = .18;
const BLUE = a => `rgba(158,200,240,${a})`;   // 粉彩蓝 #9EC8F0

// 三次贝塞尔缓动（同 Compose 的 CubicBezierEasing）：牛顿法解 x(u)=t 再取 y(u)
const bez = (x1, y1, x2, y2) => {
  const ax = 1 - 3 * x2 + 3 * x1, bx = 3 * x2 - 6 * x1, cx = 3 * x1;
  const ay = 1 - 3 * y2 + 3 * y1, by = 3 * y2 - 6 * y1, cy = 3 * y1;
  return t => {
    if (t <= 0) return 0; if (t >= 1) return 1;
    let u = t;
    for (let i = 0; i < 8; i++) {
      const d = (3 * ax * u + 2 * bx) * u + cx; if (Math.abs(d) < 1e-6) break;
      u -= (((ax * u + bx) * u + cx) * u - t) / d;
    }
    return ((ay * u + by) * u + cy) * u;
  };
};
const FOSI = bez(.4, 0, .2, 1);    // FastOutSlowInEasing
const LOSI = bez(0, 0, .2, 1);     // LinearOutSlowInEasing
const GRAV = bez(.11, 0, .5, 0);   // 重力：ease-in-quad，末端斜率 2

// 触地后的弹簧 = Compose spring(dampingRatio .5, StiffnessMedium 1500)，质量 1，从位移 0、落地速度 V 起跑
const W0 = Math.sqrt(1500), Z = .5, WD = W0 * Math.sqrt(1 - Z * Z);
const V = 2 * FALL / (FALL_MS / 1000);          // 末端斜率 2 × 平均速度，单位：屏高/秒
function dropAt(t) {                            // Y 的纵向位移，屏高倍数；负 = 在上方，正 = 下沉
  if (t < FALL_MS) return -FALL * (1 - GRAV(t / FALL_MS));
  const s = (t - FALL_MS) / 1000;
  return V / WD * Math.exp(-Z * W0 * s) * Math.sin(WD * s);
}

let W = 0, H = 0, dpr = 1, t0 = 0;

function fit() {
  dpr = devicePixelRatio || 1; W = c.clientWidth; H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
}

function draw(t) {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 版面：整字宽 58% 屏宽，居中，中心在 45% 屏高；Y 同高同左缘，宽占 218/564
  const wmW = .58 * W, wmH = wmW * 349 / 564, yW = wmW * 218 / 564, left = (W - wmW) / 2, top = .45 * H - wmH / 2;
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, W, H);
  // 底光：屏底中点为圆心、半径一屏宽，1200ms 淡入到 0.18
  const rg = g.createRadialGradient(W / 2, H, 0, W / 2, H, W);
  rg.addColorStop(0, BLUE(GLOW_A * FOSI(t / 1200))); rg.addColorStop(1, BLUE(0));
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  // 涟漪：触地起，圆心在 Y 底边中点，半径 0→整字宽 60%，alpha .35→0，500ms
  const rp = LOSI((t - FALL_MS) / 500);
  if (rp > 0 && rp < 1) {
    g.beginPath(); g.arc(left + yW / 2, top + wmH, rp * wmW * .6, 0, 2 * Math.PI);
    g.strokeStyle = BLUE(.35 * (1 - rp)); g.lineWidth = 2; g.stroke();
  }
  // 呼吸：以整字中心为轴
  const b = t < 1250 ? 1 : t < 1550 ? 1 + .02 * FOSI((t - 1250) / 300) : 1.02 - .02 * FOSI((t - 1550) / 350);
  g.save(); g.translate(W / 2, .45 * H); g.scale(b, b); g.translate(-W / 2, -.45 * H);
  // 字：700ms 起右边界从 Y 右缘推到整字右缘；rv == 0 时不画，免得 Y 还在天上就露出字里那个 Y
  const rv = FOSI((t - 700) / 450);
  if (rv > 0) {
    g.save(); g.beginPath(); g.rect(left, top, yW + rv * (wmW - yW), wmH); g.clip();
    g.drawImage(wm, left, top, wmW, wmH); g.restore();
  }
  // Y：位移 + 绕自身中心转正（-12°→0，450ms）；alpha 0.3→1（350ms），展开一开始就同步淡出
  const yA = (.3 + .7 * FOSI(t / 350)) * (1 - rv);
  if (yA > 0) {
    g.save(); g.globalAlpha = yA;
    g.translate(left + yW / 2, top + dropAt(t) * H + wmH / 2);
    g.rotate(-12 * (1 - FOSI(t / FALL_MS)) * Math.PI / 180);
    g.drawImage(yy, -yW / 2, -wmH / 2, yW, wmH); g.restore();
  }
  g.restore();
}

function frame(now) {
  if (!t0) t0 = now;
  let t = now - t0;
  if (t >= TOTAL + HOLD) { t0 = now; t = 0; }   // 播完停 HOLD 再重播
  draw(Math.min(t, TOTAL));                        // 停住的那 2 秒定在终帧
  requestAnimationFrame(frame);
}

addEventListener('resize', fit);
addEventListener('pointerdown', () => { t0 = 0; });   // 点一下：下一帧从头来
Promise.all([wm.decode(), yy.decode()]).then(() => { fit(); requestAnimationFrame(frame); });
</script>
