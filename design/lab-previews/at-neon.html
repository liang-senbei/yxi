function build(){

  N=xs.length;pad=step*3+8;gx=logoX-pad;gy=logoY-pad;gw=logoW+2*pad;gh=logoH+2*pad;refY=logoY+logoH-pad*.4;
  var idx=[];for(var k=0;k<N;k++)idx.push(k);idx.sort(function(a,b){return xs[a]-xs[b]||ys[a]-ys[b];});

  /* glow layer */
  gctx.clearRect(0,0,gw,gh);gctx.globalCompositeOperation='lighter';
  var R=step*2.6,mx=pmx-gx,my=pmy-gy,k,x,y,r,v,d,e,bo,tg,dx,dy,dd,a;
  for(k=0;k<N;k++){d=t-T0[k];if(d<0)continue;
    e=d<60?.6:d<100?.08:d<160?.6:d<200?.08:d<300?.6+.004*(d-200):1;
    bo=BO[k];tg=0;
    if(pOn){dx=PX[k]-mx;dy=PY[k]-my;dd=dx*dx+dy*dy;if(dd<10000)tg=1-Math.sqrt(dd)*.01;}
    bo+=(tg-bo)*(tg>bo?.25:.04);BO[k]=bo;
    v=e*g*(1+bo);if(fOn&&k>=flkS&&k<f1)v*=ff;
    r=R*(1+.3*bo);x=PX[k];y=PY[k];
    gctx.globalAlpha=v>1?1:v;gctx.drawImage(SPR,x-r,y-r,r*2,r*2);
    if(v>1){gctx.globalAlpha=v>2?1:v-1;gctx.drawImage(SPR,x-r,y-r,r*2,r*2);}
    if(d<220){a=(1-d/220)*(.55+.45*Math.sin(now*.06+RN[k]*40));r*=1.5;gctx.globalAlpha=a;gctx.drawImage(HOT,x-r,y-r,r*2,r*2);}
  }

  /* compose */
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(BG,0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  var i,o;
  for(i=0;i<PN;i++){o=i*9;x=P[o]+=P[o+4]*dt;y=P[o+1]+=P[o+5]*dt;
    if(x<-20){x+=W+40;P[o]=x;}else if(x>W+20){x-=W+40;P[o]=x;}
    if(y<-20){y+=H+40;P[o+1]=y;}else if(y>H+20){y-=H+40;P[o+1]=y;}
    r=P[o+2];ctx.globalAlpha=P[o+3]*(.72+.28*Math.sin(now*.001*P[o+7]+P[o+6]));ctx.drawImage(PSP[P[o+8]|0],x-r,y-r,r*2,r*2);}
  var lit=Math.min(1,(t-100)/1400);
  if(lit>0){ctx.globalAlpha=Math.min(1,lit*g*(1+.15*Math.sin(now*.0007)));ctx.drawImage(AMB,W/2-logoW*.85,H*.44-logoH*1.2,logoW*1.7,logoH*2.4);}
  /* floor reflection: flipped, squashed to 40%, faded by mask */
  rfx.setTransform(1,0,0,1,0,0);rfx.globalCompositeOperation='source-over';rfx.clearRect(0,0,rf.width,rf.height);
  rfx.setTransform(1,0,0,-1,0,rf.height);rfx.drawImage(gcv,0,0,rf.width,rf.height);
  rfx.setTransform(1,0,0,1,0,0);rfx.globalCompositeOperation='destination-in';rfx.fillStyle=refGrad;rfx.fillRect(0,0,rf.width,rf.height);
  ctx.globalAlpha=.15;ctx.drawImage(rf,gx,refY,gw,gh*.4);
  /* glow + cheap two-scale bloom */
  ctx.globalAlpha=1;ctx.drawImage(gcv,gx,gy,gw,gh);
  b1x.clearRect(0,0,b1.width,b1.height);b1x.drawImage(gcv,0,0,b1.width,b1.height);
  b2x.clearRect(0,0,b2.width,b2.height);b2x.drawImage(b1,0,0,b2.width,b2.height);
  ctx.globalAlpha=.35;ctx.drawImage(b1,gx,gy,gw,gh);
  ctx.globalAlpha=.5;ctx.drawImage(b2,gx-gw*.06,gy-gh*.06,gw*1.12,gh*1.12);
  /* film grain, device pixels, random offset */
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=.04;ctx.fillStyle=grain;
  var ox=Math.random()*128|0,oy=Math.random()*128|0;ctx.translate(-ox,-oy);ctx.fillRect(0,0,cv.width+128,cv.height+128);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function resize(){var w=innerWidth,h=innerHeight;if(!w||!h)return;W=w;H=h;dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
  makeBG();initParticles();if(A)build();}
addEventListener('resize',resize);

function pset(e){pOn=true;pmx=e.clientX;pmy=e.clientY;}
function poff(){pOn=false;}
cv.addEventListener('pointerdown',pset);cv.addEventListener('pointermove',pset);
cv.addEventListener('pointerup',poff);cv.addEventListener('pointercancel',poff);cv.addEventListener('pointerleave',poff);

var img=new Image();
img.onload=function(){IW=img.naturalWidth||IW;IH=img.naturalHeight||IH;var m=mk(IW,IH),x=m.getContext('2d');x.drawImage(img,0,0);
  A=x.getImageData(0,0,IW,IH).data;for(var i=3;i<A.length;i+=4)if(A[i]>128)opaque++;
  if(W&&H)build();};
img.src=LOGO;
resize();
requestAnimationFrame(frame);
})();
</script>
