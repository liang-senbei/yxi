var T_FLY=1600,T_INK=2100,T_END=2500,T_LOOP=4500;
var ST=9,NC=16,SS=64,TAU=6.2831853;
var cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,lx=0,ly=0,lw=0,lh=0,sc=1,bg=null,iw=564,ih=349;
var N=0,P=null,pos=null,apr=null;
var t0=0,holdDrawn=false,started=false;

/* cubic-bezier(0.4,0,0.2,1): Newton on x(u), then y(u) */
function ease(t){
  if(t<=0)return 0;if(t>=1)return 1;
  var u=t,v,x,dx,i;
  for(i=0;i<5;i++){
    v=1-u;
    x=1.2*v*v*u+0.6*v*u*u+u*u*u-t;
    dx=1.2*v*v-1.2*v*u+2.4*u*u;
    u-=x/dx;
  }
  v=1-u;return 3*v*u*u+u*u*u;
}

/* Gemini spark gradient: blue -> purple -> pink */
var G=[[66,133,244],[155,114,203],[217,101,112]];
function col(u){
  var s=u<0.5?0:1,f=(u-s*0.5)*2,a=G[s],b=G[s+1];
  return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];
}

/* sprite sheet: NC colored glows + 1 white glow, drawn once */
var sheet=document.createElement('canvas');sheet.width=SS*(NC+1);sheet.height=SS;
(function(){
  var g=sheet.getContext('2d'),i,c,r,gg,b,cx,grd;
  for(i=0;i<=NC;i++){
    c=i<NC?col(i/(NC-1)):[255,255,255];r=c[0]|0;gg=c[1]|0;b=c[2]|0;cx=i*SS+SS/2;
    grd=g.createRadialGradient(cx,SS/2,0,cx,SS/2,SS/2);
    grd.addColorStop(0,'rgba('+(r+(255-r)*0.4|0)+','+(gg+(255-gg)*0.4|0)+','+(b+(255-b)*0.4|0)+',1)');
    grd.addColorStop(0.3,'rgba('+r+','+gg+','+b+',0.9)');
    grd.addColorStop(1,'rgba('+r+','+gg+','+b+',0)');
    g.fillStyle=grd;g.fillRect(i*SS,0,SS,SS);
  }
})();

/* sample logo alpha once -> particle table (stride ST):
   0 tx 1 ty (0..1 of logo box) 2 orbit radius (x logo width) 3 start angle
   4 total spin (rad) 5 delay ms 6 size px 7 color cell 8 twinkle phase */
function sample(img){
  iw=img.naturalWidth||564;ih=img.naturalHeight||349;
  var oc=document.createElement('canvas');oc.width=iw;oc.height=ih;
  var g=oc.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0);
  var d=g.getImageData(0,0,iw,ih).data,cand=[],x,y,i;
  for(y=2;y<ih;y+=6)for(x=2;x<iw;x+=6)if(d[(y*iw+x)*4+3]>128)cand.push(x,y);
  var n=cand.length/2,keep=Math.min(Math.max(0.5,600/n),900/n),asp=iw/ih,tmp=[],tx,ty,a0;
  for(i=0;i<n;i++){
    if(Math.random()>=keep)continue;
    tx=(cand[i*2]+Math.random()*4-2)/iw;ty=(cand[i*2+1]+Math.random()*4-2)/ih;
    a0=Math.atan2(ty-0.5,(tx-0.5)*asp)+(Math.random()-0.5)*1.2;
    tmp.push(tx,ty,0.3+Math.random()*0.43,a0,
      (Math.random()<0.8?1:-1)*(0.6+Math.random()*0.6)*TAU,
      Math.random()*350,2+Math.random()*2,
      Math.max(0,Math.min(NC-1,Math.round(tx*(NC-1)))),Math.random()*TAU);
  }
  N=tmp.length/ST;P=new Float32Array(tmp);pos=new Float32Array(N*2);apr=new Float32Array(N);
}

function resize(){
  W=window.innerWidth||document.documentElement.clientWidth||330;
  H=window.innerHeight||document.documentElement.clientHeight||340;
  var dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  lw=W*0.58;lh=lw*ih/iw;lx=(W-lw)/2;ly=H*0.45-lh/2;
  sc=Math.min(2,Math.max(0.75,lw/190));
  bg=ctx.createRadialGradient(W/2,H*1.02,0,W/2,H*1.02,Math.max(W,H)*0.6);
  bg.addColorStop(0,'rgba(110,160,255,0.12)');bg.addColorStop(1,'rgba(110,160,255,0)');
  holdDrawn=false;
}

function draw(t){
  var i,o,e,d,rad,ang,x,y,R,a,band,sx,f;
  ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  var layer=t<T_INK?1:1-ease((t-T_INK)/(T_END-T_INK));
  var k2=t<T_FLY?0:ease((t-T_FLY)/(T_INK-T_FLY));
  if(layer>0.005){
    for(i=0;i<N;i++){
      o=i*ST;d=P[o+5];
      e=ease((t-d)/(T_FLY-d));
      rad=P[o+2]*lw*(1-e);ang=P[o+3]+P[o+4]*e;
      pos[i*2]=lx+P[o]*lw+rad*Math.cos(ang);
      pos[i*2+1]=ly+P[o+1]*lh+rad*Math.sin(ang);
      apr[i]=e;
    }
    var ga=(1-k2)*layer;
    if(ga>0.005){
      for(i=0;i<N;i++){
        o=i*ST;e=apr[i];
        a=Math.min(1,e*5)*(0.7+0.3*Math.sin(t*0.01+P[o+8]))*ga;
        if(a<=0.01)continue;
        R=P[o+6]*sc*(1.5-0.9*k2);
        ctx.globalAlpha=a;
        ctx.drawImage(sheet,P[o+7]*SS,0,SS,SS,pos[i*2]-R,pos[i*2+1]-R,2*R,2*R);
      }
    }
    if(k2>0.005){
      ctx.globalAlpha=k2*layer;ctx.fillStyle='#111';ctx.beginPath();
      for(i=0;i<N;i++){
        o=i*ST;R=P[o+6]*sc*0.55;x=pos[i*2];y=pos[i*2+1];
        ctx.moveTo(x+R,y);ctx.arc(x,y,R,0,TAU);
      }
      ctx.fill();
    }
    if(t>T_FLY&&t<T_INK){
      band=lw*0.07;sx=lx-band+(lw+2*band)*(t-T_FLY)/(T_INK-T_FLY);
      for(i=0;i<N;i++){
        x=pos[i*2];d=Math.abs(x-sx);
        if(d>=band)continue;
        o=i*ST;f=1-d/band;R=P[o+6]*sc*1.8;
        ctx.globalAlpha=f*f*0.9*layer;
        ctx.drawImage(sheet,NC*SS,0,SS,SS,x-R,pos[i*2+1]-R,2*R,2*R);
      }
    }
  }
  if(t>T_INK){
    ctx.globalAlpha=ease((t-T_INK)/(T_END-T_INK));
    ctx.drawImage(img,lx,ly,lw,lh);
  }
  ctx.globalAlpha=1;
}

function frame(now){
  var t=now-t0;
  if(t>=T_LOOP){t0=now;t=0;holdDrawn=false;}
  if(t<T_END)draw(t);
  else if(!holdDrawn){draw(T_END);holdDrawn=true;}
  requestAnimationFrame(frame);
}
function restart(){t0=performance.now();holdDrawn=false;}

var img=new Image();
function init(){
  if(started)return;started=true;
  sample(img);resize();
  window.addEventListener('resize',resize);
  window.addEventListener('pointerdown',restart);
  t0=performance.now();
  requestAnimationFrame(frame);
}
img.onload=init;
img.src=SRC;
})();
