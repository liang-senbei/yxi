<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin:0; font-family:'Space Grotesk', system-ui, sans-serif; }
    a { color:#ffb787; } a:hover { color:#ffd0ad; }
    * { box-sizing:border-box; }
    .k { height:44px; border-radius:14px; background:#221f1b; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', monospace; font-size:12px; color:#d0c4b8; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#100e0b; color:#ebe1d9; display:flex; flex-direction:column; overflow:hidden; position:relative;">

  <div style="display:flex; align-items:center; gap:11px; padding:10px 14px; background:#1e1b17; border-bottom:1px solid #2d2925; flex-shrink:0;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a89b8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="flex-grow:1; min-width:0;">
      <div style="font-size:15px; font-weight:600; letter-spacing:-0.01em;">cc-mail</div>
    </div>
    <div style="display:flex; background:#16130f; border-radius:100px; padding:4px; flex-shrink:0;">
      <div style="padding:11px 11px; font-size:12px; font-weight:600; color:#4d2600; background:#ffb787; border-radius:7px;">终端</div>
      <div style="padding:11px 11px; font-size:12px; font-weight:500; color:#a89b8f; border-radius:7px;">对话</div>
      <div style="padding:11px 11px; font-size:12px; font-weight:500; color:#a89b8f; border-radius:7px;">文件</div>
    </div>
  </div>

  <!-- terminal showing a Claude Code permission prompt (the ↑↓+Enter case) -->
  <div style="flex-grow:1; padding:12px; font-family:'JetBrains Mono', monospace; font-size:12px; line-height:1.62; color:#d0c4b8; overflow:hidden;">
    <div style="color:#8a7d72;">● Claude 想执行 Bash 命令</div>
    <div style="height:8px;"></div>
    <div style="border-left:2px solid #8a5a2e; padding-left:10px; color:#ffb4a6;">rm -rf build/ dist/</div>
    <div style="height:10px;"></div>
    <div style="color:#8a7d72;">是否允许？</div>
    <div style="height:6px;"></div>
    <div style="color:#9ce0a8;">❯ 1. 允许这一次</div>
    <div style="color:#8a7d72;">  2. 允许本会话内所有同类命令</div>
    <div style="color:#8a7d72;">  3. 不允许，告诉 Claude 该怎么做</div>
    <div style="height:14px;"></div>
    <div style="color:#8a7d72; font-size:11px;">↑↓ 选择 · Enter 确认 · Esc 取消</div>
  </div>

  <!-- D-Pad overlay -->
  <div style="position:absolute; right:22px; bottom:150px; width:186px; height:186px;">
    <!-- corner slot: top-left = Backspace -->
    <div style="position:absolute; left:0; top:0; width:46px; height:46px; border-radius:23px; background:rgba(43,40,38,0.96); display:flex; align-items:center; justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#d0c4b8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/><path d="M18 9l-6 6M12 9l6 6"/></svg>
    </div>
    <!-- corner slot: top-right = Ctrl+C -->
    <div style="position:absolute; right:0; top:0; width:46px; height:46px; border-radius:23px; background:rgba(51,36,31,0.96); display:flex; align-items:center; justify-content:center;">
      <div style="font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:700; color:#ffb4a6;">^C</div>
    </div>

    <!-- circular dpad -->
    <div style="position:absolute; left:19px; top:19px; width:148px; height:148px; border-radius:74px; background:rgba(35,33,32,0.93); ">
      <!-- up (active) -->
      <div style="position:absolute; left:50%; top:9px; transform:translateX(-50%); width:46px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:22px; background:#ffb787;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4d2600" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </div>
      <!-- down -->
      <div style="position:absolute; left:50%; bottom:9px; transform:translateX(-50%); width:46px; height:44px; display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a89b8f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
      </div>
      <!-- left -->
      <div style="position:absolute; left:9px; top:50%; transform:translateY(-50%); width:44px; height:46px; display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a89b8f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </div>
      <!-- right -->
      <div style="position:absolute; right:9px; top:50%; transform:translateY(-50%); width:44px; height:46px; display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a89b8f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>
      <!-- center Enter -->
      <div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:58px; height:58px; border-radius:29px; background:#221f1b; display:flex; align-items:center; justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffb787" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10l-5 5 5 5"/><path d="M20 4v7a4 4 0 01-4 4H4"/></svg>
      </div>
    </div>
  </div>

  <!-- hint -->
  <div style="position:absolute; left:16px; bottom:172px; width:150px;">
    <div style="background:rgba(35,33,32,0.94); border-radius:20px; padding:10px 11px;">
      <div style="font-size:11px; line-height:1.5; color:#a89b8f;">按住不放 = <span style="color:#ffb787; font-weight:600;">连发</span><br>压住往一边推 = 持续走</div>
    </div>
  </div>

  <!-- keyboard toolbar with dpad trigger highlighted -->
  <div style="flex-shrink:0; background:#16130f; border-top:1px solid #2d2925; padding:9px 10px 12px; display:flex; gap:6px;">
    <div class="k" style="flex-grow:1;">esc</div>
    <div class="k" style="flex-grow:1;">tab</div>
    <div class="k" style="flex-grow:1;">ctrl</div>
    <div class="k" style="flex-grow:1;">^C</div>
    <div class="k" style="width:56px; background:#ffb787; border-color:#ffb787;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4d2600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    </div>
    <div class="k" style="width:56px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d0c4b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
