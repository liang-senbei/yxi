<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin:0; font-family:'Space Grotesk', system-ui, sans-serif; }
    a { color:#e08b57; } a:hover { color:#f0a473; }
    * { box-sizing:border-box; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:linear-gradient(165deg,#241f1c 0%,#141312 55%,#1c1917 100%); color:#ece8e3; display:flex; flex-direction:column; overflow:hidden; padding:0 12px;">

  <div style="height:110px; flex-shrink:0;"></div>

  <!-- lock clock -->
  <div style="text-align:center; margin-bottom:34px; flex-shrink:0;">
    <div style="font-size:66px; font-weight:300; letter-spacing:-0.03em; line-height:1; color:#f2eee9;">14:32</div>
    <div style="font-size:13px; color:#9b938a; margin-top:6px;">8月22日 周六</div>
  </div>

  <!-- approval notification -->
  <div style="border-radius:20px; background:rgba(43,40,38,0.94); border:1px solid #4a443d; overflow:hidden; flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:9px; padding:12px 15px 0;">
      <div style="width:19px; height:19px; border-radius:5px; background:#e08b57; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1a1917" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
      </div>
      <div style="font-size:12px; font-weight:600; color:#9b938a; letter-spacing:0.01em;">Yxi</div>
      <div style="flex-grow:1;"></div>
      <div style="font-size:11.5px; color:#6d665f; font-family:'JetBrains Mono', monospace;">现在</div>
    </div>

    <div style="padding:9px 15px 13px;">
      <div style="font-size:15.5px; font-weight:600; letter-spacing:-0.01em; margin-bottom:7px;">cc-mail 要跑一条命令</div>
      <div style="font-family:'JetBrains Mono', monospace; font-size:12.5px; line-height:1.5; background:#1a1917; border:1px solid #39352f; border-radius:9px; padding:10px 11px; color:#dd8a76; word-break:break-all;">rm -rf build/ dist/ .cache/</div>

      <!-- countdown -->
      <div style="display:flex; align-items:center; gap:9px; margin-top:11px;">
        <div style="flex-grow:1; height:4px; border-radius:2px; background:#39352f; overflow:hidden;">
          <div style="width:62%; height:4px; border-radius:2px; background:#d5a244;"></div>
        </div>
        <div style="font-size:11.5px; color:#d5a244; font-family:'JetBrains Mono', monospace; font-weight:500;">还剩 5:52</div>
      </div>
    </div>

    <div style="display:flex; border-top:1px solid #39352f;">
      <div style="flex-grow:1; height:50px; display:flex; align-items:center; justify-content:center; font-size:14.5px; font-weight:600; color:#e08b57; border-right:1px solid #39352f;">批准</div>
      <div style="flex-grow:1; height:50px; display:flex; align-items:center; justify-content:center; font-size:14.5px; font-weight:500; color:#dd8a76; border-right:1px solid #39352f;">拒绝</div>
      <div style="width:104px; height:50px; display:flex; align-items:center; justify-content:center; font-size:14.5px; font-weight:500; color:#9b938a;">转终端</div>
    </div>
  </div>

  <!-- ongoing foreground-service notification -->
  <div style="margin-top:10px; border-radius:20px; background:rgba(35,33,32,0.8); border:1px solid #39352f; padding:12px 15px; display:flex; align-items:center; gap:11px; flex-shrink:0;">
    <div style="width:19px; height:19px; border-radius:5px; background:#3a3633; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#9b938a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
    </div>
    <div style="flex-grow:1; min-width:0;">
      <div style="font-size:13px; font-weight:500; color:#c9c2ba;">守着 3 台服务器</div>
      <div style="font-size:11.5px; color:#6d665f; font-family:'JetBrains Mono', monospace; margin-top:1px;">14 个会话 · 常驻</div>
    </div>
    <div style="font-size:11px; color:#6d665f;">静音</div>
  </div>

  <div style="flex-grow:1;"></div>
  <div style="text-align:center; padding-bottom:26px; flex-shrink:0;">
    <div style="font-size:11.5px; color:#4a443d; font-family:'JetBrains Mono', monospace;">前台服务常驻通知 · 无 FCM</div>
  </div>

</div>
</x-dc>
</body>
</html>
