            <span>图片2</span>

          </div>
          <div class="chip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#35b1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
            <span>附件1</span>

          </div>
        </div>
        <div style="font-size:14px; line-height:1.5;">看下 <span style="background:#332f2b; border:1px solid #4a443d; border-radius:5px; padding:1px 6px; font-size:13px; font-weight:600;">图片1</span> 的报错，对照 <span style="background:#332f2b; border:1px solid #4a443d; border-radius:5px; padding:1px 6px; font-size:13px; font-weight:600;">附件1</span> 的日志<span style="display:inline-block; width:2px; height:15px; background:#e08b57; vertical-align:-2px; margin-left:1px;"></span></div>
        <div style="display:flex; align-items:center; gap:9px;">
          <div style="font-size:11px; color:#6d665f; font-family:'JetBrains Mono', monospace; flex-grow:1;">→ /root/src/tmp/Yxi/ · 保留 3 天</div>
