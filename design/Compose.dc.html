<!doctype html>
<html>
<head>

</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin:0; font-family:'Space Grotesk', system-ui, sans-serif; }
    a { color:#ffb787; } a:hover { color:#ffd0ad; }
    * { box-sizing:border-box; }
    .chip { display:flex; align-items:center; gap:6px; height:32px; padding:0 10px; border-radius:14px; background:#2d2925; font-size:12px; font-weight:500; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#16130f; color:#ebe1d9; display:flex; flex-direction:column; overflow:hidden;">

  <div style="padding:14px 16px 12px; background:#1e1b17; border-bottom:1px solid #2d2925; flex-shrink:0;">
    <div style="font-size:12px; font-weight:600; color:#8a7d72; letter-spacing:0.06em;">输入区状态</div>
  </div>

  <div style="flex-grow:1; display:flex; flex-direction:column; gap:22px; padding:18px 14px; overflow:hidden;">

    <!-- A: attachments -->
    <div style="display:flex; flex-direction:column; gap:9px;">
      <div style="font-size:11px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">A · 带附件</div>
      <div style="border-radius:28px; background:#1e1b17; padding:11px 12px 12px; display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; flex-wrap:wrap; gap:7px;">
          <div class="chip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffb787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span>图片1</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8a7d72" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </div>
          <div class="chip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffb787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span>图片2</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8a7d72" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </div>
          <div class="chip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8fd8c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
            <span>附件1</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8a7d72" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </div>
        </div>
        <div style="font-size:15px; line-height:1.6;">看下 <span style="background:#2d2925; border-radius:5px; padding:1px 6px; font-size:13px; font-weight:600;">图片1</span> 的报错，对照 <span style="background:#2d2925; border-radius:5px; padding:1px 6px; font-size:13px; font-weight:600;">附件1</span> 的日志<span style="display:inline-block; width:2px; height:15px; background:#ffb787; vertical-align:-2px; margin-left:1px;"></span></div>
        <div style="display:flex; align-items:center; gap:9px;">
          <div style="font-size:11px; color:#8a7d72; font-family:'JetBrains Mono', monospace; flex-grow:1;">→ /root/src/tmp/Yxi/ · 保留 3 天</div>
          <div style="width:44px; height:48px; border-radius:100px; background:#ffb787; display:flex; align-items:center; justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4d2600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- B: listening -->
    <div style="display:flex; flex-direction:column; gap:9px;">
      <div style="font-size:11px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">B · 正在听</div>
      <div style="border-radius:28px; background:#1e1b17; padding:16px 14px; display:flex; align-items:center; gap:13px;">
        <div style="width:44px; height:44px; border-radius:22px; background:#ffb787; display:flex; align-items:center; justify-content:center; flex-shrink:0;">

          <div style="width:3px; height:10px; background:#8a5a2e; border-radius:2px;"></div>

          <div style="width:3px; height:32px; background:#ffb787; border-radius:2px;"></div>
          <div style="width:3px; height:16px; background:#ffb787; border-radius:2px;"></div>
          <div style="width:3px; height:26px; background:#ffb787; border-radius:2px;"></div>
          <div style="width:3px; height:11px; background:#8a5a2e; border-radius:2px;"></div>
          <div style="width:3px; height:19px; background:#8a5a2e; border-radius:2px;"></div>
          <div style="width:3px; height:8px; background:#8a5a2e; border-radius:2px;"></div>
        </div>
        <div style="font-size:12px; color:#a89b8f; font-family:'JetBrains Mono', monospace;">0:04</div>
      </div>
    </div>

    <!-- C: confirm before send -->
    <div style="display:flex; flex-direction:column; gap:9px;">
      <div style="font-size:11px; color:#8a7d72; font-family:'JetBrains Mono', monospace;">C · 识别完，等你确认</div>
      <div style="border-radius:28px; background:#1e1b17; overflow:hidden;">
        <div style="display:flex; align-items:center; gap:7px; padding:9px 13px; background:#6d3a10; border-bottom:1px solid #8a5a2e;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffc46b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
          <div style="font-size:11.5px; font-weight:600; color:#ffc46b;">终端模式 · 确认后才发送</div>
        </div>
        <div style="padding:13px; font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.5;">git checkout main &amp;&amp; git pull</div>
        <div style="display:flex; gap:8px; padding:0 13px 13px;">
          <div style="flex-grow:1; height:48px; border-radius:100px; background:#ffb787; color:#4d2600; font-size:13.5px; font-weight:600; display:flex; align-items:center; justify-content:center;">发送</div>
          <div style="width:90px; height:48px; border-radius:100px; font-size:13.5px; display:flex; align-items:center; justify-content:center;">编辑</div>
          <div style="width:44px; height:48px; border-radius:100px; display:flex; align-items:center; justify-content:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a89b8f" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
